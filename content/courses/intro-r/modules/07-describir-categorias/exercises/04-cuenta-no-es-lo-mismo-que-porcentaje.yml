id: intro-r-07-004
course: intro-r
module: 07-describir-categorias
order: 3
title: Cuenta no es lo mismo que porcentaje
context: |-
  Para facilitar la comunicación social, multiplicamos las proporciones por 100 y obtenemos porcentajes directos:

  `prop.table(tabla) * 100`
instruction: |-
  1. Guarda en `tabla_carrera` el conteo de frecuencias de `carrera`.
  2. Calcula los porcentajes multiplicando las proporciones por 100.
learning_objectives:
  r: Calcular frecuencias y proporciones sobre una variable categórica.
  data: Se mantiene `carrera` para que la dificultad provenga de recuperar y coordinar
    las herramientas, no de aprender nuevos d
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # cuenta los casos de cada carrera y guarda el resultado


  # obtén las proporciones de esa tabla
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_campus <- data.frame(
    id = 1:8,
    transporte = c("Metro", "Bus", "Bicicleta", "Metro", "A pie", "Bus", "Metro", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  tabla_carrera <- table(encuesta_social_demo$carrera)

  prop.table(tabla_carrera)
checks:
- type: object_exists
  object: tabla_carrera
  message: Debes crear el objeto 'tabla_carrera' usando <-.
- type: custom_r
  code: exists('tabla_carrera', envir = .target_env, inherits = FALSE)
  message: El objeto 'tabla_carrera' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero obtén los conteos. Después expresa esos conteos respecto del total.
- title: Pista 2 · Procedimiento
  text: Recupera las dos herramientas de los ejercicios anteriores.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    tabla_carrera <- table(encuesta_social_demo$carrera)

    prop.table(tabla_carrera)
success_message: Bien. La frecuencia responde cuántos casos hay; la proporción responde
  qué parte del total representan. Por eso la misma frecuencia puede corresponder
  a proporciones distintas si cambia el total.
navigation:
  next: intro-r-07-005
schema_version: 1
