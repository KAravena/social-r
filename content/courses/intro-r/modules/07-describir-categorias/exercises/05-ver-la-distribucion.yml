id: intro-r-07-005
course: intro-r
module: 07-describir-categorias
order: 4
title: Ver la distribución
context: 'Ya podemos leer la distribución de `carrera` como una tabla.


  También podemos representar **los mismos conteos** visualmente:


  ```r

  barplot(tabla_carrera)

  ```


  En este gráfico:


  - cada barra representa una categoría;

  - la altura representa su frecuencia.


  Antes de ejecutar:


  > ¿qué categoría esperas que tenga la barra más alta?


  Después de observar el gráfico:


  > ¿qué representa la altura de esa barra?


  El gráfico no cambia los datos ni crea una nueva medida.'
instruction: Representa visualmente la misma tabla de frecuencias.
learning_objectives:
  r: Puede leer un gráfico de barras de frecuencias relacionando cada barra con una
    categoría y su altura con el número de casos.
  data: 'Distribución de carrera en los mismos ocho casos.


    Mantener el contexto permite concentrar la atención en la equivalenci'
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: 'tabla_carrera <- table(encuesta_social_demo$carrera)


  barplot(tabla_carrera)'
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n\
  )\ntabla_carrera <- table(encuesta_social_demo$carrera)\nencuesta_campus <- data.frame(\n\
  \  id = 1:8,\n  transporte = c(\"Metro\", \"Bus\", \"Bicicleta\", \"Metro\", \"\
  A pie\", \"Bus\", \"Metro\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: 'tabla_carrera <- table(encuesta_social_demo$carrera)


  barplot(tabla_carrera)'
checks:
- type: object_exists
  object: tabla_carrera
  message: Debes crear el objeto 'tabla_carrera' con table(encuesta_social_demo$carrera).
- type: custom_r
  code: is.table(get('tabla_carrera', envir = .target_env))
  message: '''tabla_carrera'' debe ser una tabla de frecuencias.'
- type: custom_r
  code: grepl('barplot[[:space:]]*[(][[:space:]]*tabla_carrera[[:space:]]*[)]', .user_code)
  message: 'Genera el gráfico de barras pasando la tabla: barplot(tabla_carrera).'
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: El gráfico representa la tabla de frecuencias que ya construiste.
- title: Pista 2 · Procedimiento
  text: '`barplot()` puede recibir directamente una tabla de conteos.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: barplot(tabla_carrera)
success_message: Bien. Cada barra representa una categoría y su altura representa
  la frecuencia. Sociología es la barra más alta porque aparece en 3 casos.
