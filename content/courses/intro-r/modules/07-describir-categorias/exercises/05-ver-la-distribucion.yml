id: intro-r-07-005
course: intro-r
module: 07-describir-categorias
order: 4
title: Ver la distribución
context: |-
  Un **gráfico de barras** muestra visualmente la distribución de una variable categórica:

  `barplot(tabla)`

  Cada barra representa una categoría y su altura refleja la frecuencia observada.
instruction: Genera el gráfico de barras de `tabla_carrera` usando la función `barplot()`.
learning_objectives:
  r: Visualizar la distribución de frecuencias de una variable categórica con `barplot()`.
  data: |-
    Distribución de carrera en los mismos ocho casos.

    Mantener el contexto permite concentrar la atención en la equivalenci
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  tabla_carrera <- table(encuesta_social_demo$carrera)

  # Genera el gráfico de barras de tabla_carrera:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_campus <- data.frame(
    id = 1:8,
    transporte = c("Metro", "Bus", "Bicicleta", "Metro", "A pie", "Bus", "Metro", "Bicicleta"),
    stringsAsFactors = FALSE
  )
  tabla_carrera <- table(encuesta_social_demo$carrera)
solution_code: |-
  tabla_carrera <- table(encuesta_social_demo$carrera)
  barplot(tabla_carrera)
checks:
- type: custom_r
  code: grepl('barplot\\s*\\(', .user_code)
  message: Genera el gráfico de barras usando barplot(tabla_carrera).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: El gráfico representa la tabla de frecuencias que ya construiste.
- title: Pista 2 · Procedimiento
  text: '`barplot()` puede recibir directamente una tabla de conteos.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: barplot(tabla_carrera)
success_message: Bien. Cada barra representa una categoría y su altura representa
  la frecuencia. Sociología es la barra más alta porque aparece en 3 casos.
navigation:
  next: intro-r-07-006
schema_version: 1
