id: intro-r-07-006
course: intro-r
module: 07-describir-categorias
order: 5
title: Describe otra variable categórica
context: |-
  En `encuesta_campus` consultamos la satisfacción de ocho estudiantes:

  | id | transporte | carrera | satisfaccion |
  |:---|:---|:---|:---|
  | 1 | Metro | Sociología | Alta |
  | 2 | Bus | Historia | Media |
  | 3 | Bicicleta | Antropología | Alta |
  | 4 | Metro | Sociología | Baja |
  | 5 | A pie | Trabajo Social | Media |
  | 6 | Bus | Antropología | Alta |
  | 7 | Metro | Historia | Media |
  | 8 | Bicicleta | Sociología | Alta |
instruction: |-
  1. Construye la tabla de frecuencias de `satisfaccion` y guárdala en `tabla_satisfaccion`.
  2. Calcula sus proporciones con `prop.table()` y genera su gráfico con `barplot()`.
learning_objectives:
  r: Describir una variable categórica nueva combinando tabla, proporciones y gráfico
    de barras.
  data: Formas de transporte utilizadas para llegar al campus
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # 1. Obtén los conteos de transporte en tabla_transporte:


  # 2. Obtén después las proporciones con prop.table:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_campus <- data.frame(
    id = 1:8,
    transporte = c("Metro", "Bus", "Bicicleta", "Metro", "A pie", "Bus", "Metro", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  tabla_transporte <- table(encuesta_campus$transporte)

  tabla_transporte

  prop.table(tabla_transporte)
checks:
- type: object_exists
  object: tabla_transporte
  message: Debes crear el objeto 'tabla_transporte' usando table().
- type: custom_r
  code: is.table(.target_env$tabla_transporte) && sum(.target_env$tabla_transporte)
    == 8
  message: '''tabla_transporte'' debe guardar la tabla de frecuencias de transporte.'
- type: custom_r
  code: grepl('prop\\.table\\s*\\(', .user_code) && isTRUE(all.equal(sum(.res_val),
    1))
  message: Calcula las proporciones de la tabla con prop.table(tabla_transporte).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Primero necesitas saber cuántos casos hay en cada categoría. Después, qué
    parte del total representan.
- title: Pista 2 · Procedimiento
  text: Recupera las dos herramientas que usaste para obtener frecuencias y después
    proporciones.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    tabla_transporte <- table(encuesta_campus$transporte)

    prop.table(tabla_transporte)
success_message: Bien. Reconociste una variable categórica nueva, calculaste sus frecuencias
  y proporciones y pudiste interpretar la categoría más frecuente respecto del total.
navigation:
  next: intro-r-08-001
schema_version: 1
