id: intro-r-07-002
course: intro-r
module: 07-describir-categorias
order: 1
title: ¿Cuántas personas respondieron cada cosa?
context: |-
  Para resumir una variable categórica contamos cuántos casos hay en cada grupo mediante una tabla de frecuencias:

  `tabla_carrera <- table(encuesta_social_demo$carrera)`

  Cada número indica la **frecuencia** observada.
instruction: Construye la tabla de frecuencias de `carrera` usando `table()` y guárdala
  en `tabla_carrera`.
learning_objectives:
  r: Construir e interpretar una tabla de frecuencias con `table()`.
  data: Distribución de carreras en `encuesta_social_demo`
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  tabla_carrera <- table(encuesta_social_demo$carrera)

  tabla_carrera
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_campus <- data.frame(
    id = 1:8,
    transporte = c("Metro", "Bus", "Bicicleta", "Metro", "A pie", "Bus", "Metro", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  tabla_carrera <- table(encuesta_social_demo$carrera)

  tabla_carrera
checks:
- type: object_exists
  object: tabla_carrera
  message: Debes crear el objeto 'tabla_carrera' usando <-.
- type: custom_r
  code: exists('tabla_carrera', envir = .target_env, inherits = FALSE)
  message: El objeto 'tabla_carrera' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Necesitas contar cuántos casos aparecen en cada categoría.
- title: Pista 2 · Procedimiento
  text: '`table()` recibe una variable y produce un conteo por categoría.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: tabla_carrera <- table(encuesta_social_demo$carrera)
success_message: Bien. `table()` contó cuántos casos pertenecen a cada categoría.
  Sociología aparece 3 veces y es la categoría más frecuente.
navigation:
  next: intro-r-07-003
schema_version: 1
