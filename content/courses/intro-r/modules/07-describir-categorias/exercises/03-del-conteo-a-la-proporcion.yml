id: intro-r-07-003
course: intro-r
module: 07-describir-categorias
order: 2
title: Del conteo a la proporción
context: 'Para saber qué fracción del total representa cada categoría convertimos
  la tabla en **proporciones** con `prop.table()`:


  `prop.table(tabla_carrera)`


  Cada valor va de 0 a 1 y la suma de todas las celdas es 1.'
instruction: Calcula las proporciones de cada carrera aplicando `prop.table()` a `tabla_carrera`.
learning_objectives:
  r: Calcular proporciones a partir de una tabla de frecuencias con `prop.table()`.
  data: La misma distribución de `carrera` para mantener estable el contexto mientras
    cambia el tipo de resumen
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: prop.table(____________)
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n\
  )\ntabla_carrera <- table(encuesta_social_demo$carrera)\nencuesta_campus <- data.frame(\n\
  \  id = 1:8,\n  transporte = c(\"Metro\", \"Bus\", \"Bicicleta\", \"Metro\", \"\
  A pie\", \"Bus\", \"Metro\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: prop.table(tabla_carrera)
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Ahora quieres saber qué parte del total representa cada conteo.
- title: Pista 2 · Procedimiento
  text: '`prop.table()` transforma una tabla de frecuencias en proporciones.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: prop.table(tabla_carrera)
success_message: Bien. La frecuencia de Sociología es 3 casos y su proporción es 0.375
  porque representa 3 de los 8 casos, equivalente a 37.5 %.
navigation:
