id: intro-r-07-003
course: intro-r
module: 07-describir-categorias
order: 2
title: Del conteo a la proporción
context: |-
  Para saber qué fracción del total representa cada categoría convertimos la tabla en **proporciones** con `prop.table()`:

  `prop.table(tabla)`

  Cada valor va de 0 a 1 y todas las celdas suman 1.0.
instruction: Aplica `prop.table()` a `tabla_carrera` para calcular la proporción de
  estudiantes en cada disciplina.
learning_objectives:
  r: Calcular proporciones a partir de una tabla de frecuencias con `prop.table()`.
  data: La misma distribución de `carrera` para mantener estable el contexto mientras
    cambia el tipo de resumen
  social: 'Aplicación a investigación social en módulo 7: describir categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Calcula las proporciones de tabla_carrera:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_campus <- data.frame(
    id = 1:8,
    transporte = c("Metro", "Bus", "Bicicleta", "Metro", "A pie", "Bus", "Metro", "Bicicleta"),
    stringsAsFactors = FALSE
  )
  tabla_carrera <- table(encuesta_social_demo$carrera)
solution_code: prop.table(tabla_carrera)
checks:
- type: custom_r
  code: grepl('prop\\.table\\s*\\(', .user_code)
  message: Calcula las proporciones usando prop.table(tabla_carrera).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Ahora quieres saber qué parte del total representa cada conteo.
- title: Pista 2 · Procedimiento
  text: '`prop.table()` transforma una tabla de frecuencias en proporciones.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: prop.table(tabla_carrera)
success_message: Bien. La frecuencia de Sociología es 3 casos y su proporción es 0.375
  porque representa 3 de los 8 casos, equivalente a 37.5 %.
navigation:
  next: intro-r-07-004
schema_version: 1
