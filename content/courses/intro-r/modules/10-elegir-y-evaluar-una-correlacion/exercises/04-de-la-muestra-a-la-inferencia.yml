id: intro-r-10-004
course: intro-r
module: 10-elegir-y-evaluar-una-correlacion
order: 3
title: De la muestra a la inferencia
context: |-
  Para evaluar si la correlación observada en una muestra aporta evidencia sobre una asociación en la población usamos `cor.test()`:

  `cor.test(x, y)`

  Entrega: estimación puntual (`estimate`), significación (`p-value`) e intervalo de confianza del 95% (`conf.int`).
instruction: Ejecuta `cor.test(encuesta_social$horas_estudio, encuesta_social$puntaje_metodos)`
  y localiza estimate, p-value e intervalo de confianza.
learning_objectives:
  r: Ejecutar una prueba de correlación con `cor.test()` e identificar sus componentes
    clave.
  data: Horas de estudio y puntaje de métodos en los 12 pares completos de `encuesta_social`
  social: 'Aplicación a investigación social en módulo 10: elegir y evaluar una correlación.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  cor.test(
    encuesta_social$horas_estudio,
    encuesta_social$puntaje_metodos,
    method = "pearson"
  )
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    stringsAsFactors = FALSE
  )
  x_curva <- c(1, 2, 3, 4, 5, 6, 7, 8)
  y_curva <- c(1, 2, 4, 8, 16, 32, 64, 128)
  encuesta_emprendimiento <- data.frame(
    id = 1:8,
    antiguedad_anos = c(1, 2, 3, 4, 5, 6, 7, 8),
    ventas_mensuales = c(100, 110, 120, 140, 180, 300, 800, 3000),
    stringsAsFactors = FALSE
  )
solution_code: |-
  cor.test(
    encuesta_social$horas_estudio,
    encuesta_social$puntaje_metodos,
    method = "pearson"
  )
checks:
- type: custom_r
  code: grepl('cor\\.test\\s*\\(', .user_code)
  message: Evalúa inferencialmente la relación usando cor.test().
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Ya conoces el coeficiente descriptivo. Ahora necesitamos una herramienta
    inferencial.'
- title: Pista 2 · Procedimiento
  text: '> La función es `cor.test()` y utiliza las mismas dos variables.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    cor.test(
      encuesta_social$horas_estudio,
      encuesta_social$puntaje_metodos,
      method = "pearson"
    )
success_message: '> Bien. Encontraste el mismo coeficiente observado y localizaste
  las dos piezas nuevas que analizaremos a continuación: p-value e intervalo de confianza.'
navigation:
  next: intro-r-10-005
schema_version: 1
