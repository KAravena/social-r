id: intro-r-10-008
course: intro-r
module: 10-elegir-y-evaluar-una-correlacion
order: 7
title: 'Checkpoint D: decide y justifica'
context: |-
  **Checkpoint D — Decidir y evaluar una correlación**

  En `encuesta_emprendimiento` observamos que las ventas crecen de forma fuertemente acelerada según los años del negocio:

  | id | antiguedad_anos | ventas_mensuales |
  |:---|---:|---:|
  | 1 | 1 | 100 |
  | 2 | 2 | 110 |
  | 3 | 3 | 120 |
  | 4 | 4 | 140 |
  | 5 | 5 | 180 |
  | 6 | 6 | 300 |
  | 7 | 7 | 800 |
  | 8 | 8 | 3000 |
instruction: Evalúa la relación monótona entre `antiguedad_anos` y `ventas_mensuales`
  aplicando la prueba de correlación de Spearman (`method = "spearman"`) con `cor.test()`.
learning_objectives:
  r: Decidir el método de correlación pertinente y evaluar su evidencia inferencial
    de forma integrada.
  data: Antigüedad de emprendimientos y ventas mensuales
  social: 'Aplicación a investigación social en módulo 10: elegir y evaluar una correlación.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |
  # evalúa la relación entre antiguedad_anos y ventas_mensuales
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    stringsAsFactors = FALSE
  )
  x_curva <- c(1, 2, 3, 4, 5, 6, 7, 8)
  y_curva <- c(1, 2, 4, 8, 16, 32, 64, 128)
  encuesta_emprendimiento <- data.frame(
    id = 1:8,
    antiguedad_anos = c(1, 2, 3, 4, 5, 6, 7, 8),
    ventas_mensuales = c(100, 110, 120, 140, 180, 300, 800, 3000),
    stringsAsFactors = FALSE
  )
solution_code: cor.test(encuesta_emprendimiento$antiguedad_anos, encuesta_emprendimiento$ventas_mensuales,
  method = "spearman")
checks:
- type: custom_r
  code: grepl('cor\.test\s*\(', .user_code)
  message: Aplica la prueba de correlación inferencial usando cor.test().
- type: custom_r
  code: grepl('spearman', .user_code, ignore.case = TRUE)
  message: Como la relación es curva monótona (crecimiento acelerado), debes usar
    el método 'spearman'.
diagnostics:
- when_r: grepl('pearson', .user_code, ignore.case = TRUE)
  message: La relación de ventas con antigüedad es curva, no recta. El método adecuado
    para relaciones monótonas es Spearman.
  type: warning
hints:
- title: Pista 1 · Orientación
  text: 'Observa el gráfico de dispersión: la relación asciende en curva pronunciada,
    no en línea recta.'
- title: Pista 2 · Herramienta
  text: Cuando una relación es monótona curva o con crecimiento exponencial, el método
    adecuado es Spearman.
- title: Pista 3 · Sintaxis
  text: Ejecuta `cor.test(encuesta_emprendimiento$antiguedad_anos, encuesta_emprendimiento$ventas_mensuales,
    method = "spearman")`.
success_message: '> Bien. Elegiste Spearman por la forma monotónica no lineal, interpretaste
  rho y p, y no exigiste un componente que R base no devuelve en esta ruta.'
navigation:
  next: intro-r-11-001
schema_version: 1
