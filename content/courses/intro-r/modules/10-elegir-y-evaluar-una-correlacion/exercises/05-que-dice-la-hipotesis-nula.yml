id: intro-r-10-005
course: intro-r
module: 10-elegir-y-evaluar-una-correlacion
order: 4
title: ¿Qué dice la hipótesis nula?
context: |-
  En inferencia estadística:

  - **Hipótesis nula ($H_0$)**: no hay correlación en la población ($r = 0$).
  - **p-value**: mide qué tan compatibles son los datos observados con $H_0$. Un valor pequeño indica que los datos observados serían muy raros si no hubiera relación real.
instruction: Evalúa cada afirmación asignando `TRUE` o `FALSE` a `afirmacion_probabilidad_h0`
  e `afirmacion_incompatibilidad`.
learning_objectives:
  r: Comprender la hipótesis nula en correlación y el p-value como medida de compatibilidad
    con $H_0$.
  data: La correlación `horas_estudio`–`puntaje_metodos` ya conocida
  social: 'Aplicación a investigación social en módulo 10: elegir y evaluar una correlación.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |
  # Responde si cada afirmación sobre el p-value (p = 0.00496) es TRUE o FALSE:
  # afirmacion_probabilidad_h0 <- FALSE
  # afirmacion_incompatibilidad <- TRUE
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    stringsAsFactors = FALSE
  )
  x_curva <- c(1, 2, 3, 4, 5, 6, 7, 8)
  y_curva <- c(1, 2, 4, 8, 16, 32, 64, 128)
  encuesta_emprendimiento <- data.frame(
    id = 1:8,
    antiguedad_anos = c(1, 2, 3, 4, 5, 6, 7, 8),
    ventas_mensuales = c(100, 110, 120, 140, 180, 300, 800, 3000),
    stringsAsFactors = FALSE
  )
solution_code: |-
  afirmacion_probabilidad_h0 <- FALSE
  afirmacion_incompatibilidad <- TRUE
checks:
- type: object_value
  object: afirmacion_probabilidad_h0
  expected: false
  message: 'Falso: el p-value NO es la probabilidad de que la hipótesis nula sea verdadera.'
- type: object_value
  object: afirmacion_incompatibilidad
  expected: true
  message: 'Verdadero: un p pequeño indica que los datos observados son poco compatibles
    con el escenario nulo.'
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Pregunta primero: ¿qué escenario está suponiendo el test?'
- title: Pista 2 · Procedimiento
  text: '> El p-value se interpreta bajo ese escenario; no asigna probabilidad a H0.'
- title: Pista 3 · Sintaxis / Acción
  text: '> H0 aquí es correlación lineal poblacional 0; p describe compatibilidad
    de los datos con ese escenario.'
success_message: '> Exacto. El p-value se interpreta respecto del escenario nulo;
  no es la probabilidad de que H0 sea verdadera ni una medida del tamaño de la asociación.'
navigation:
  next: intro-r-10-006
schema_version: 1
