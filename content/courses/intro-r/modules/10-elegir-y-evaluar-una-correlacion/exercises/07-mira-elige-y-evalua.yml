id: intro-r-10-007
course: intro-r
module: 10-elegir-y-evaluar-una-correlacion
order: 6
title: Mira, elige y evalúa
context: 'Queremos estudiar cómo se relacionan la edad y las horas de ocio diario.


  1. representa la relación;

  2. describe su forma y dirección;

  3. decide qué coeficiente corresponde mejor al patrón;

  4. evalúa inferencialmente la asociación;

  5. interpreta magnitud, evidencia e incertidumbre;

  6. explica qué no podemos concluir.


  Las funciones no están indicadas.'
instruction: Empieza por el gráfico.
learning_objectives:
  r: Puede ejecutar una ruta Pearson completa desde el scatterplot hasta una interpretación
    conjunta de magnitud, evidencia e
  data: Edad y horas de ocio diario en `encuesta_social`
  social: 'Aplicación a investigación social en módulo 10: elegir y evaluar una correlación.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: '# representa la relación



  # elige y ejecuta el análisis inferencial'
setup_code: "encuesta_social <- data.frame(\n  id = 1:12,\n  horas_estudio = c(2,\
  \ 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),\n  puntaje_metodos = c(59, 68, 58, 64, 62,\
  \ 75, 65, 64, 74, 84, 59, 73),\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26,\
  \ 22, 24),\n  horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5,\
  \ 5.1),\n  stringsAsFactors = FALSE\n)\nx_curva <- c(1, 2, 3, 4, 5, 6, 7, 8)\ny_curva\
  \ <- c(1, 2, 4, 8, 16, 32, 64, 128)\nencuesta_emprendimiento <- data.frame(\n  id\
  \ = 1:8,\n  antiguedad_anos = c(1, 2, 3, 4, 5, 6, 7, 8),\n  ventas_mensuales = c(100,\
  \ 110, 120, 140, 180, 300, 800, 3000),\n  stringsAsFactors = FALSE\n)"
solution_code: "plot(\n  encuesta_social$edad,\n  encuesta_social$horas_ocio\n)\n\n\
  cor.test(\n  encuesta_social$edad,\n  encuesta_social$horas_ocio,\n  method = \"\
  pearson\"\n)"
checks:
- type: custom_r
  code: grepl('(plot|hist|barplot)\\s*\\(', .user_code)
  message: Asegúrate de generar el gráfico solicitado utilizando la función correspondiente
    (plot, hist o barplot).
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Empieza mirando la forma de la relación.'
- title: Pista 2 · Procedimiento
  text: '> El patrón es aproximadamente lineal y negativo.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "cor.test(\n  encuesta_social$edad,\n  encuesta_social$horas_ocio,\n  method\
    \ = \"pearson\"\n)"
success_message: '> Bien. Miraste primero el patrón, justificaste Pearson y separaste
  magnitud, evidencia e incertidumbre.'
navigation:
  next: intro-r-10-008
schema_version: 1
