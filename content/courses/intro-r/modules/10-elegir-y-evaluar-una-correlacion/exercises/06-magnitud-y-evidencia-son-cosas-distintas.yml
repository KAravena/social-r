id: intro-r-10-006
course: intro-r
module: 10-elegir-y-evaluar-una-correlacion
order: 5
title: Magnitud y evidencia son cosas distintas
context: |-
  No confundas **magnitud** ($r$) con **evidencia** ($p$):

  Dos muestras pueden tener la misma correlación ($r = 0.50$), pero con mayor tamaño muestral ($N$) el p-value es más pequeño y la estimación es más precisa.
instruction: Compara el Estudio A ($n = 10$) y el Estudio B ($n = 500$). Asigna `"Estudio
  A"` o `"Estudio B"` a `estudio_menor_p` y a `estudio_mayor_precision`.
learning_objectives:
  r: Diferenciar magnitud del efecto, significación inferencial y precisión según
    el tamaño muestral.
  data: Dos estudios hipotéticos con la misma correlación observada pero tamaños muestrales
    diferentes
  social: 'Aplicación a investigación social en módulo 10: elegir y evaluar una correlación.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  # Compara ambos estudios (ambos r = 0.50):
  estudio_menor_p <- "___"             # "¿Cuál tiene menor p-value? ("Estudio A" o "Estudio B")"
  estudio_mayor_precision <- "___"     # "¿Cuál tiene el IC más estrecho/preciso? ("Estudio A" o "Estudio B")"
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    stringsAsFactors = FALSE
  )
  x_curva <- c(1, 2, 3, 4, 5, 6, 7, 8)
  y_curva <- c(1, 2, 4, 8, 16, 32, 64, 128)
  encuesta_emprendimiento <- data.frame(
    id = 1:8,
    antiguedad_anos = c(1, 2, 3, 4, 5, 6, 7, 8),
    ventas_mensuales = c(100, 110, 120, 140, 180, 300, 800, 3000),
    stringsAsFactors = FALSE
  )
solution_code: |-
  estudio_menor_p <- "Estudio B"
  estudio_mayor_precision <- "Estudio B"
checks:
- type: object_value
  object: estudio_menor_p
  expected: Estudio B
  message: El Estudio B tiene N = 50, por lo que produce mucha mayor evidencia estadística
    (p = 0.0002 frente a p = 0.098).
- type: object_value
  object: estudio_mayor_precision
  expected: Estudio B
  message: Con mayor tamaño muestral, el intervalo de confianza es más estrecho y
    preciso.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Compara primero los dos valores de `r`.'
- title: Pista 2 · Procedimiento
  text: '> Después separa N, p y ancho del intervalo.'
- title: Pista 3 · Sintaxis / Acción
  text: '> `r` responde cuánto; p e IC responden preguntas diferentes sobre evidencia
    e incertidumbre.'
success_message: '> Exacto. La magnitud observada es la misma. Lo que cambia con la
  cantidad de información es la evidencia relativa a H0 y la precisión.'
navigation:
  next: intro-r-10-007
schema_version: 1
