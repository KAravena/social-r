id: intro-r-10-001
course: intro-r
module: 10-elegir-y-evaluar-una-correlacion
order: 0
title: No todas las relaciones son lineales
context: |-
  No todas las relaciones siguen una línea recta. Si una relación es creciente pero curva, conserva el orden relativo de los casos (**relación monótona**).

  El coeficiente de **Spearman** resume relaciones monótonas basándose en los rangos (orden) de los datos:

  `cor(x, y, method = "spearman")`
instruction: Compara los gráficos de la relación lineal y de la relación curva monótona
  en los datos.
learning_objectives:
  r: Distinguir una relación lineal de una relación monótona no lineal y reconocer
    el uso de Spearman.
  data: Contraste entre la relación educacional ya conocida de M9 y un patrón pedagógico
    abstracto deliberadamente curvo
  social: 'Aplicación a investigación social en módulo 10: elegir y evaluar una correlación.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  # Ejecuta la correlación de Spearman para la relación monotónica curva:
  cor(x_curva, y_curva, method = "spearman")
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    stringsAsFactors = FALSE
  )
  x_curva <- c(1, 2, 3, 4, 5, 6, 7, 8)
  y_curva <- c(1, 2, 4, 8, 16, 32, 64, 128)
  encuesta_emprendimiento <- data.frame(
    id = 1:8,
    antiguedad_anos = c(1, 2, 3, 4, 5, 6, 7, 8),
    ventas_mensuales = c(100, 110, 120, 140, 180, 300, 800, 3000),
    stringsAsFactors = FALSE
  )
solution_code: cor(x_curva, y_curva, method = "spearman")
checks:
- type: result_equals
  expected: 1.0
  message: El coeficiente de Spearman para una relación monotónica creciente perfecta
    es 1.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Mira primero la forma general del patrón.'
- title: Pista 2 · Procedimiento
  text: '> Pregunta si los casos altos en `x` también tienden a ocupar posiciones
    altas en `y`.'
- title: Pista 3 · Sintaxis / Acción
  text: '> Una relación curva puede ser monotónica si mantiene la misma dirección
    general; Spearman resume el orden de esos casos.'
success_message: '> Exacto. El segundo patrón no sigue una recta, pero conserva perfectamente
  el orden de los casos. Esa es la propiedad que Spearman resume.'
navigation:
  next: intro-r-10-002
schema_version: 1
