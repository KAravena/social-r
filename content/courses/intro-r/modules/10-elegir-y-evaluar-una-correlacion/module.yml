id: 10-elegir-y-evaluar-una-correlacion
title: 'Módulo 10: Elegir y evaluar una correlación'
short_title: Módulo 10
order: 10
description: Distingue relaciones lineales de monotónicas curvas, elige entre Pearson
  y Spearman (rho), y evalúa la evidencia inferencial con cor.test() interpretando
  p-values e intervalos de confianza.
learning_outcomes:
- Dominar las habilidades nucleares del Módulo 10.
- Aplicar análisis reproducible con datos de ciencias sociales.
