id: 08-describir-cantidades
title: 'Módulo 8: Describir cantidades'
short_title: Módulo 8
order: 8
description: Explora variables cuantitativas mediante histogramas, medidas de tendencia
  central (media y mediana) y medidas de dispersión (desviación estándar), evaluando
  el impacto de valores extremos.
learning_outcomes:
- Describir el centro de una distribución con media y mediana.
- Examinar cuánto varían los valores.
- Elegir medidas descriptivas según la forma de los datos.
