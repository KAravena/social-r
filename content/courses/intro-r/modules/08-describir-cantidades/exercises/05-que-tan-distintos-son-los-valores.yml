id: intro-r-08-005
course: intro-r
module: 08-describir-cantidades
order: 4
title: ¿Qué tan distintos son los valores?
context: |-
  Dos grupos pueden tener la misma media pero comportarse muy diferente. La **desviación estándar** mide qué tan dispersos están los datos respecto a su media:

  `sd(vector)`

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---||
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: Observa la dispersión en los grupos de prueba y calcula la desviación
  estándar de `horas_estudio` en `encuesta_social_demo` usando `sd()`.
learning_objectives:
  r: Calcular e interpretar la desviación estándar con `sd()` como medida de dispersión.
  data: Microdatos pedagógicos sin contexto complejo para aislar la idea de dispersión.
    Después se aplica `sd()` a `horas_estudi
  social: 'Aplicación a investigación social en módulo 8: describir cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  sd(grupo_a)

  sd(grupo_b)

  # ahora calcula la desviación estándar de horas_estudio
  # Calcula la desviación estándar de horas_estudio:
  sd(encuesta_social_demo$horas_estudio, na.rm = TRUE)
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_estudio <- encuesta_social_demo$horas_estudio
  minutos_lectura <- c(25, 10, 20, 30, 15, 22, 18)
  viaje_regular <- c(20, 22, 24, 25, 26, 28, 30)
  viaje_extremo <- c(20, 22, 24, 25, 26, 28, 120)
  grupo_a <- c(4, 4, 4, 4, 4)
  grupo_b <- c(2, 3, 4, 5, 6)
  encuesta_movilidad <- data.frame(
    id = 1:10,
    transporte = c("Metro", "Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus", "A pie", "Metro", "Bus"),
    minutos_viaje = c(25, 30, 32, 28, 35, 27, 31, 29, 34, 90),
    stringsAsFactors = FALSE
  )
solution_code: |-
  sd(grupo_a)

  sd(grupo_b)

  sd(encuesta_social_demo$horas_estudio)
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: El centro ya es igual en ambos grupos. Falta describir cuánto se separan sus
    valores.
- title: Pista 2 · Procedimiento
  text: La función que resume esta dispersión es `sd()`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    sd(grupo_a)
    sd(grupo_b)

    sd(encuesta_social_demo$horas_estudio)
success_message: '> Bien. Los grupos comparten el mismo centro, pero B tiene mayor
  dispersión. `sd()` permite resumir esa diferencia.'
navigation:
  next: intro-r-08-006
schema_version: 1
