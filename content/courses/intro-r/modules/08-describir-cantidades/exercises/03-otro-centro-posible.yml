id: intro-r-08-003
course: intro-r
module: 08-describir-cantidades
order: 2
title: Otro centro posible
context: |-
  La **mediana** es el valor que ocupa la posición central una vez ordenados los datos de menor a mayor:

  `median(vector)`

  Deja exactamente el 50% de las observaciones por debajo y el 50% por encima.

  Tiempos registrados: `minutos_lectura <- c(15, 20, 25, 30, 45, 60, 120)`.
instruction: Calcula la mediana de `minutos_lectura` usando la función `median()`.
learning_objectives:
  r: Calcular e interpretar la mediana como medida de centro basada en el orden con
    `median()`.
  data: Minutos de lectura diaria en siete casos de ejemplo
  social: 'Aplicación a investigación social en módulo 8: describir cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |
  minutos_lectura <- c(15, 20, 25, 30, 45, 60, 120)

  # Calcula la mediana de minutos_lectura:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_estudio <- encuesta_social_demo$horas_estudio
  minutos_lectura <- c(25, 10, 20, 30, 15, 22, 18)
  viaje_regular <- c(20, 22, 24, 25, 26, 28, 30)
  viaje_extremo <- c(20, 22, 24, 25, 26, 28, 120)
  grupo_a <- c(4, 4, 4, 4, 4)
  grupo_b <- c(2, 3, 4, 5, 6)
  encuesta_movilidad <- data.frame(
    id = 1:10,
    transporte = c("Metro", "Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus", "A pie", "Metro", "Bus"),
    minutos_viaje = c(25, 30, 32, 28, 35, 27, 31, 29, 34, 90),
    stringsAsFactors = FALSE
  )
solution_code: |-
  minutos_lectura <- c(15, 20, 25, 30, 45, 60, 120)
  median(minutos_lectura)
checks:
- type: custom_r
  code: grepl('median\\s*\\(', .user_code)
  message: Calcula la mediana usando median(minutos_lectura).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Ordena mentalmente los valores de menor a mayor y busca qué queda en el centro.
- title: Pista 2 · Procedimiento
  text: La función que calcula la mediana es `median()`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: median(minutos_lectura)
success_message: '> Bien. La mediana depende del orden de los valores. Con siete observaciones,
  20 queda exactamente en el centro.'
navigation:
  next: intro-r-08-004
schema_version: 1
