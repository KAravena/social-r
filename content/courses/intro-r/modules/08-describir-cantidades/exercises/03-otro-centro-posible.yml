id: intro-r-08-003
course: intro-r
module: 08-describir-cantidades
order: 2
title: Otro centro posible
context: 'La media utiliza la magnitud de todos los valores.


  Existe otra forma de describir el centro.


  Observa:


  ```text

  25, 10, 20, 30, 15, 22, 18

  ```


  Si los ordenamos mentalmente:


  ```text

  10, 15, 18, 20, 22, 25, 30

  ```


  hay un valor exactamente en el centro:


  ```text

  20

  ```


  Ese centro se llama **mediana**.


  En R:


  ```r

  median(minutos_lectura)

  ```'
instruction: No necesitamos aprender una función para ordenar en esta pantalla. El
  orden es parte de la idea que queremos comprender.
learning_objectives:
  r: Comprende la mediana como centro del orden y puede calcularla con `median()`
    en un caso introductorio de N impar
  data: Minutos de lectura diaria en siete casos de ejemplo
  social: 'Aplicación a investigación social en módulo 8: describir cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: median(minutos_lectura)
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  horas_cuidado = c(6, NA, 0,\
  \ 8, 4, 5, NA, 7),\n  stringsAsFactors = FALSE\n)\nhoras_estudio <- encuesta_social_demo$horas_estudio\n\
  minutos_lectura <- c(25, 10, 20, 30, 15, 22, 18)\nviaje_regular <- c(20, 22, 24,\
  \ 25, 26, 28, 30)\nviaje_extremo <- c(20, 22, 24, 25, 26, 28, 120)\ngrupo_a <- c(4,\
  \ 4, 4, 4, 4)\ngrupo_b <- c(2, 3, 4, 5, 6)\nencuesta_movilidad <- data.frame(\n\
  \  id = 1:10,\n  transporte = c(\"Metro\", \"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"\
  , \"Metro\", \"Bus\", \"A pie\", \"Metro\", \"Bus\"),\n  minutos_viaje = c(25, 30,\
  \ 32, 28, 35, 27, 31, 29, 34, 90),\n  stringsAsFactors = FALSE\n)"
solution_code: median(minutos_lectura)
checks:
- type: custom_r
  code: isTRUE(all.equal(.res_val, median(minutos_lectura)))
  message: La mediana de minutos_lectura debe ser 25.
- type: custom_r
  code: grepl('median[[:space:]]*[(][[:space:]]*minutos_lectura[[:space:]]*[)]', .user_code)
  message: Calcula la mediana usando median(minutos_lectura).
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Ordena mentalmente los valores de menor a mayor y busca qué queda en el centro.
- title: Pista 2 · Procedimiento
  text: La función que calcula la mediana es `median()`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: median(minutos_lectura)
success_message: '> Bien. La mediana depende del orden de los valores. Con siete observaciones,
  20 queda exactamente en el centro.'
navigation:
