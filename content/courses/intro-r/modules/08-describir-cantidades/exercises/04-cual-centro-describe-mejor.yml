id: intro-r-08-004
course: intro-r
module: 08-describir-cantidades
order: 3
title: ¿Cuál centro describe mejor?
context: |-
  Compara dos grupos donde solo cambia un valor extremo:

  - `viaje_regular`: 20, 22, 24, 25, 26, 28, **30**
  - `viaje_con_accidente`: 20, 22, 24, 25, 26, 28, **120**

  La media es sensible a valores extremos, mientras que la mediana es resistente (robusta).
instruction: Calcula la media y la mediana de `viaje_con_accidente` y observa cómo
  la media se distorsiona mientras la mediana permanece estable.
learning_objectives:
  r: Evaluar la sensibilidad de la media y la robustez de la mediana ante valores
    extremos.
  data: Tiempos de viaje en dos grupos pedagógicos casi idénticos
  social: 'Aplicación a investigación social en módulo 8: describir cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  viaje_regular <- c(20, 22, 24, 25, 26, 28, 30)

  viaje_extremo <- c(20, 22, 24, 25, 26, 28, 120)

  # calcula la media de viaje_regular


  # calcula la mediana de viaje_regular


  # calcula la media de viaje_extremo


  # calcula la mediana de viaje_extremo
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_estudio <- encuesta_social_demo$horas_estudio
  minutos_lectura <- c(25, 10, 20, 30, 15, 22, 18)
  viaje_regular <- c(20, 22, 24, 25, 26, 28, 30)
  viaje_extremo <- c(20, 22, 24, 25, 26, 28, 120)
  grupo_a <- c(4, 4, 4, 4, 4)
  grupo_b <- c(2, 3, 4, 5, 6)
  encuesta_movilidad <- data.frame(
    id = 1:10,
    transporte = c("Metro", "Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus", "A pie", "Metro", "Bus"),
    minutos_viaje = c(25, 30, 32, 28, 35, 27, 31, 29, 34, 90),
    stringsAsFactors = FALSE
  )
solution_code: |-
  mean(viaje_regular)
  median(viaje_regular)

  mean(viaje_extremo)
  median(viaje_extremo)
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Compara qué ocurre con cada centro cuando solo cambia el último valor.
- title: Pista 2 · Procedimiento
  text: Recupera las dos funciones de centro que aprendiste en E2 y E3.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    mean(viaje_regular)
    median(viaje_regular)

    mean(viaje_extremo)
    median(viaje_extremo)
success_message: '> Bien. La media usa la magnitud de todos los valores y por eso
  120 la desplaza mucho. La mediana depende del orden y permanece en 25. La elección
  depende de qué queremos describir.'
navigation:
  next: intro-r-08-005
schema_version: 1
