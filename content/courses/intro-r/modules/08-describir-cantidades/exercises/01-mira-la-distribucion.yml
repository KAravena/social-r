id: intro-r-08-001
course: intro-r
module: 08-describir-cantidades
order: 0
title: Mira la distribución
context: |-
  Para explorar una variable cuantitativa observamos cómo se reparten sus valores mediante un **histograma**:

  `hist(base$variable)`

  El eje horizontal muestra intervalos continuos y la altura de cada barra refleja cuántos casos caen en ese rango.

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---|
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: Genera un histograma de la variable `horas_estudio` en `encuesta_social_demo`
  usando `hist()`.
learning_objectives:
  r: Visualizar la distribución de una variable cuantitativa con un histograma mediante
    `hist()`.
  data: Horas de estudio reportadas por ocho personas de `encuesta_social_demo`
  social: 'Aplicación a investigación social en módulo 8: describir cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |
  # Genera el histograma de horas_estudio:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_estudio <- encuesta_social_demo$horas_estudio
  minutos_lectura <- c(25, 10, 20, 30, 15, 22, 18)
  viaje_regular <- c(20, 22, 24, 25, 26, 28, 30)
  viaje_extremo <- c(20, 22, 24, 25, 26, 28, 120)
  grupo_a <- c(4, 4, 4, 4, 4)
  grupo_b <- c(2, 3, 4, 5, 6)
  encuesta_movilidad <- data.frame(
    id = 1:10,
    transporte = c("Metro", "Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus", "A pie", "Metro", "Bus"),
    minutos_viaje = c(25, 30, 32, 28, 35, 27, 31, 29, 34, 90),
    stringsAsFactors = FALSE
  )
solution_code: hist(encuesta_social_demo$horas_estudio)
checks:
- type: custom_r
  code: grepl('hist\\s*\\(', .user_code)
  message: Genera el histograma usando hist(encuesta_social_demo$horas_estudio).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: 'Pregunta primero qué representan los números de `horas_estudio`: ¿son códigos
    de grupos o cantidades de horas?'
- title: Pista 2 · Procedimiento
  text: Son cantidades. El histograma permite observar cómo se reparten esos valores
    antes de resumirlos.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: hist(encuesta_social_demo$horas_estudio)
success_message: '> Bien. Primero identificaste que `horas_estudio` representa cantidades
  y utilizaste el histograma para observar cómo se distribuyen antes de resumirlas.'
navigation:
  next: intro-r-08-002
schema_version: 1
