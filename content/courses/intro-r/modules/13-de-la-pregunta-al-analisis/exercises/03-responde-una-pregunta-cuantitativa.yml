id: intro-r-13-003
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 2
title: Responde una pregunta cuantitativa
context: Entre estudiantes de jornada diurna queremos evaluar si las horas semanales
  de estudio se relacionan con la autoeficacia académica.
instruction: Genera el scatterplot entre `horas_estudio` y `autoeficacia_academica`,
  ejecuta `cor.test()` de Pearson e interpreta magnitud, evidencia e incertidumbre.
learning_objectives:
  r: 'Conducir e interpretar un análisis bivariado cuantitativo completo: visualización,
    inferencia y alcance.'
  data: Horas de estudio y autoeficacia académica entre estudiantes de jornada diurna
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: '# representa conjuntamente las dos variables



  # elige un método a partir de la forma observada



  # evalúa la asociación



  # interpreta el resultado'
setup_code: "encuesta_vida_universitaria <- data.frame(\n  id = 1:48,\n  jornada =\
  \ c(rep(\"Diurna\", 32), rep(\"Vespertina\", 16)),\n  horas_estudio = c(\n    c(2,\
  \ 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8,\
  \ 4, 6, 5, 3, 7),\n    c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)\n  ),\n\
  \  autoeficacia_academica = c(\n    c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59,\
  \ 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57,\
  \ 74),\n    c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)\n\
  \  ),\n  transporte_campus = rep(c(\"Metro\", \"Bus\", \"Bicicleta\", \"Bus\"),\
  \ 12),\n  participa_organizacion = rep(c(\"Sí\", \"No\", \"Sí\", \"No\", \"No\"\
  , \"Sí\"), 8),\n  stringsAsFactors = FALSE\n)\ndatos_estudio_diurno <- subset(encuesta_vida_universitaria,\
  \ jornada == \"Diurna\", select = c(\"horas_estudio\", \"autoeficacia_academica\"\
  ))\nencuesta_vinculos_barriales <- data.frame(\n  id = 1:40,\n  ocupado = c(rep(\"\
  Sí\", 28), rep(\"No\", 12)),\n  participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1,\
  \ 0), 4), rep(c(0, 1, 0), 4)),\n  confianza_comunitaria = c(\n    c(7, 8, 6, 9,\
  \ 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),\n   \
  \ c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)\n  ),\n  stringsAsFactors = FALSE\n)"
solution_code: "plot(\n  datos_estudio_diurno$horas_estudio,\n  datos_estudio_diurno$autoeficacia_academica\n\
  )\n\ncor.test(\n  datos_estudio_diurno$horas_estudio,\n  datos_estudio_diurno$autoeficacia_academica,\n\
  \  method = \"pearson\"\n)"
checks:
- type: custom_r
  code: grepl('(plot|hist|barplot)\\s*\\(', .user_code)
  message: Asegúrate de generar el gráfico solicitado utilizando la función correspondiente
    (plot, hist o barplot).
- type: custom_r
  code: grepl('cor\\.test\\s*\\(', .user_code)
  message: Evalúa inferencialmente la relación usando cor.test().
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Antes de elegir un coeficiente, representa conjuntamente las dos variables.'
- title: Pista 2 · Procedimiento
  text: '> El patrón es ascendente y aproximadamente lineal; recupera el método que
    resume asociación lineal.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "plot(\n  datos_estudio_diurno$horas_estudio,\n  datos_estudio_diurno$autoeficacia_academica\n\
    )\n\ncor.test(\n  datos_estudio_diurno$horas_estudio,\n  datos_estudio_diurno$autoeficacia_academica,\n\
    \  method = \"pearson\"\n)"
success_message: '> Bien. La elección de Pearson está justificada por la forma aproximadamente
  lineal del patrón, y separaste coeficiente, p-value e incertidumbre.'
navigation:
  next: intro-r-13-004
schema_version: 1
