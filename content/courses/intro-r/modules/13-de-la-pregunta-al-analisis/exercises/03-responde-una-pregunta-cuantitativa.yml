id: intro-r-13-003
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 2
title: Responde una pregunta cuantitativa
context: Con los datos preparados en `datos_estudio_diurno`, respondemos la pregunta
  sobre horas de estudio y autoeficacia académica.
instruction: |-
  1. Genera el gráfico de dispersión con `plot()` entre horas de estudio y autoeficacia.
  2. Ejecuta la prueba de correlación inferencial de Pearson con `cor.test()`.
learning_objectives:
  r: 'Conducir e interpretar un análisis bivariado cuantitativo completo: visualización,
    inferencia y alcance.'
  data: Horas de estudio y autoeficacia académica entre estudiantes de jornada diurna
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  # representa conjuntamente las dos variables


  # elige un método a partir de la forma observada


  # evalúa la asociación


  # interpreta el resultado
setup_code: |-
  encuesta_vida_universitaria <- data.frame(
    id = 1:48,
    jornada = c(rep("Diurna", 32), rep("Vespertina", 16)),
    horas_estudio = c(
      c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8, 4, 6, 5, 3, 7),
      c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)
    ),
    autoeficacia_academica = c(
      c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57, 74),
      c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)
    ),
    transporte_campus = rep(c("Metro", "Bus", "Bicicleta", "Bus"), 12),
    participa_organizacion = rep(c("Sí", "No", "Sí", "No", "No", "Sí"), 8),
    stringsAsFactors = FALSE
  )
  encuesta_vinculos_barriales <- data.frame(
    id = 1:40,
    ocupado = c(rep("Sí", 28), rep("No", 12)),
    participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1, 0), 4), rep(c(0, 1, 0), 4)),
    confianza_comunitaria = c(
      c(7, 8, 6, 9, 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),
      c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)
    ),
    stringsAsFactors = FALSE
  )
  datos_estudio_diurno <- subset(encuesta_vida_universitaria, jornada == "Diurna", select = c("horas_estudio", "autoeficacia_academica"))
solution_code: |-
  plot(
    datos_estudio_diurno$horas_estudio,
    datos_estudio_diurno$autoeficacia_academica
  )

  cor.test(
    datos_estudio_diurno$horas_estudio,
    datos_estudio_diurno$autoeficacia_academica,
    method = "pearson"
  )
checks:
- type: custom_r
  code: grepl('(plot|hist|barplot)\\s*\\(', .user_code)
  message: Asegúrate de generar el gráfico solicitado utilizando la función correspondiente
    (plot, hist o barplot).
- type: custom_r
  code: grepl('cor\\.test\\s*\\(', .user_code)
  message: Evalúa inferencialmente la relación usando cor.test().
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Antes de elegir un coeficiente, representa conjuntamente las dos variables.'
- title: Pista 2 · Procedimiento
  text: '> El patrón es ascendente y aproximadamente lineal; recupera el método que
    resume asociación lineal.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    plot(
      datos_estudio_diurno$horas_estudio,
      datos_estudio_diurno$autoeficacia_academica
    )

    cor.test(
      datos_estudio_diurno$horas_estudio,
      datos_estudio_diurno$autoeficacia_academica,
      method = "pearson"
    )
success_message: '> Bien. La elección de Pearson está justificada por la forma aproximadamente
  lineal del patrón, y separaste coeficiente, p-value e incertidumbre.'
navigation:
