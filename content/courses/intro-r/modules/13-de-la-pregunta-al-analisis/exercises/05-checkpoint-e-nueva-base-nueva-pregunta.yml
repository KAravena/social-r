id: intro-r-13-005
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 4
title: 'Checkpoint E: nueva base, nueva pregunta'
context: |-
  **Checkpoint E — Integración final**

  En `encuesta_vinculos_barriales` investigamos si participar en una organización vecinal se asocia con la confianza comunitaria entre quienes trabajan.
instruction: |-
  1. Prepara `datos_checkpoint` filtrando a quienes están ocupados (`ocupado == "Sí"`) y seleccionando `participa_vecinal_01` y `confianza_comunitaria`.
  2. Evalúa la correlación entre ambas variables con `cor.test()`.
learning_objectives:
  r: Diseñar y ejecutar de forma autónoma una ruta analítica completa en un contexto
    nuevo.
  data: Trabajo, participación vecinal y confianza comunitaria
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # 1. prepara los datos en datos_checkpoint


  # 2. evalúa la correlación con cor.test
setup_code: |-
  encuesta_vida_universitaria <- data.frame(
    id = 1:48,
    jornada = c(rep("Diurna", 32), rep("Vespertina", 16)),
    horas_estudio = c(
      c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8, 4, 6, 5, 3, 7),
      c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)
    ),
    autoeficacia_academica = c(
      c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57, 74),
      c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)
    ),
    transporte_campus = rep(c("Metro", "Bus", "Bicicleta", "Bus"), 12),
    participa_organizacion = rep(c("Sí", "No", "Sí", "No", "No", "Sí"), 8),
    stringsAsFactors = FALSE
  )
  encuesta_vinculos_barriales <- data.frame(
    id = 1:40,
    ocupado = c(rep("Sí", 28), rep("No", 12)),
    participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1, 0), 4), rep(c(0, 1, 0), 4)),
    confianza_comunitaria = c(
      c(7, 8, 6, 9, 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),
      c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)
    ),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_checkpoint <- encuesta_vinculos_barriales |>
    filter(ocupado == "Sí") |>
    select(participa_vecinal_01, confianza_comunitaria)

  cor.test(datos_checkpoint$participa_vecinal_01, datos_checkpoint$confianza_comunitaria)
checks:
- type: object_exists
  object: datos_checkpoint
  message: Debes crear el data frame 'datos_checkpoint' con los casos filtrados.
- type: custom_r
  code: is.data.frame(.target_env$datos_checkpoint) && nrow(.target_env$datos_checkpoint)
    == 28 && all(c('participa_vecinal_01', 'confianza_comunitaria') %in% names(.target_env$datos_checkpoint))
  message: '''datos_checkpoint'' debe contener los 28 casos ocupados y las dos variables
    seleccionadas.'
- type: custom_r
  code: grepl('cor\.test\s*\(', .user_code)
  message: Evalúa inferencialmente la correlación entre las variables preparadas con
    cor.test().
diagnostics:
- when_r: '!exists(''datos_checkpoint'', envir = .target_env)'
  message: Primero prepara los datos filtrando a quienes están ocupados con filter(ocupado
    == 'Sí').
  type: warning
hints:
- title: Pista 1 · Orientación
  text: Primero filtra a los ocupados (`ocupado == "Sí"`) y selecciona las variables
    de interés en `datos_checkpoint`.
- title: Pista 2 · Herramienta
  text: Como una variable es 0/1 y la otra es numérica continua, evalúa la relación
    con `cor.test()`.
- title: Pista 3 · Sintaxis
  text: Ejecuta `cor.test(datos_checkpoint$participa_vecinal_01, datos_checkpoint$confianza_comunitaria)`.
success_message: '> Bien. Definiste correctamente la población, reconociste la variable
  binaria pese a su codificación 0/1 y construiste una interpretación que separa asociación,
  evidencia e incertidumbre.'
navigation:
