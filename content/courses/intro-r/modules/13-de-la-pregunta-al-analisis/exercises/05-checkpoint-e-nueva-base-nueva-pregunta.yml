id: intro-r-13-005
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 4
title: 'Checkpoint E: nueva base, nueva pregunta'
context: '**Checkpoint E — Integración final**


  Entre las personas ocupadas de `encuesta_vinculos_barriales`, investiga si participar
  en una organización vecinal se asocia con la confianza comunitaria.'
instruction: Filtra los casos pertinentes (`ocupado == "Sí"`), ejecuta el análisis
  correspondiente entre `participa_vecinal_01` y `confianza_comunitaria` e interpreta
  la evidencia.
learning_objectives:
  r: Diseñar y ejecutar de forma autónoma una ruta analítica completa en un contexto
    nuevo.
  data: Trabajo, participación vecinal y confianza comunitaria
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: '# identifica los casos y variables necesarios



  # prepara los datos



  # revisa los datos ausentes relevantes



  # analiza la pregunta



  # interpreta qué puedes y qué no puedes concluir'
setup_code: "encuesta_vida_universitaria <- data.frame(\n  id = 1:48,\n  jornada =\
  \ c(rep(\"Diurna\", 32), rep(\"Vespertina\", 16)),\n  horas_estudio = c(\n    c(2,\
  \ 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8,\
  \ 4, 6, 5, 3, 7),\n    c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)\n  ),\n\
  \  autoeficacia_academica = c(\n    c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59,\
  \ 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57,\
  \ 74),\n    c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)\n\
  \  ),\n  transporte_campus = rep(c(\"Metro\", \"Bus\", \"Bicicleta\", \"Bus\"),\
  \ 12),\n  participa_organizacion = rep(c(\"Sí\", \"No\", \"Sí\", \"No\", \"No\"\
  , \"Sí\"), 8),\n  stringsAsFactors = FALSE\n)\ndatos_estudio_diurno <- subset(encuesta_vida_universitaria,\
  \ jornada == \"Diurna\", select = c(\"horas_estudio\", \"autoeficacia_academica\"\
  ))\nencuesta_vinculos_barriales <- data.frame(\n  id = 1:40,\n  ocupado = c(rep(\"\
  Sí\", 28), rep(\"No\", 12)),\n  participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1,\
  \ 0), 4), rep(c(0, 1, 0), 4)),\n  confianza_comunitaria = c(\n    c(7, 8, 6, 9,\
  \ 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),\n   \
  \ c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)\n  ),\n  stringsAsFactors = FALSE\n)"
solution_code: "datos_checkpoint <- encuesta_vinculos_barriales |>\n  filter(ocupado\
  \ == \"Sí\") |>\n  select(\n    participa_vecinal_01,\n    confianza_comunitaria\n\
  \  )\n\nsum(is.na(datos_checkpoint$participa_vecinal_01))\n\nsum(is.na(datos_checkpoint$confianza_comunitaria))\n\
  \ncor.test(\n  datos_checkpoint$participa_vecinal_01,\n  datos_checkpoint$confianza_comunitaria,\n\
  \  method = \"pearson\"\n)"
checks:
- type: object_exists
  object: datos_checkpoint
  message: Debes crear el objeto 'datos_checkpoint' usando <-.
- type: custom_r
  code: exists('datos_checkpoint', envir = .target_env, inherits = FALSE)
  message: El objeto 'datos_checkpoint' debe existir en el entorno.
- type: custom_r
  code: grepl('cor\\.test\\s*\\(', .user_code)
  message: Evalúa inferencialmente la relación usando cor.test().
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Empieza por la población indicada en la pregunta. Después identifica qué
    representan realmente los valores de las variables focales.'
- title: Pista 2 · Procedimiento
  text: '> Una variable representa dos grupos codificados 0/1 y la otra es cuantitativa.
    Ya trabajaste esta combinación.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "datos_checkpoint <- encuesta_vinculos_barriales |>\n  filter(ocupado == \"\
    Sí\") |>\n  select(\n    participa_vecinal_01,\n    confianza_comunitaria\n  )\n\
    \ncor.test(\n  datos_checkpoint$participa_vecinal_01,\n  datos_checkpoint$confianza_comunitaria,\n\
    \  method = \"pearson\"\n)"
success_message: '> Bien. Definiste correctamente la población, reconociste la variable
  binaria pese a su codificación 0/1 y construiste una interpretación que separa asociación,
  evidencia e incertidumbre.'
