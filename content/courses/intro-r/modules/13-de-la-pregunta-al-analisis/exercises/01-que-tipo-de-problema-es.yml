id: intro-r-13-001
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 0
title: ¿Qué tipo de problema es?
context: |-
  Antes de analizar debemos identificar el tipo de variables y la técnica adecuada:

  - **Cuantitativo**: cantidades medibles continuas (promedios, correlaciones).
  - **Categórico**: grupos o clasificaciones cualitativas (tablas cruzadas, Chi-cuadrado).

  Preguntas de estudio:
  - Problema 1: ¿Dedicar más horas de estudio se asocia con mayor autoeficacia académica?
  - Problema 2: ¿El medio de transporte se asocia con la participación estudiantil?
instruction: Clasifica cada problema asignando `"cuantitativo"` o `"categorico"` a
  `problema_1` y `problema_2`.
learning_objectives:
  r: Seleccionar la técnica estadística adecuada a partir de la pregunta y el tipo
    de variables involucradas.
  data: Cinco preguntas breves sobre vida universitaria, todas comprensibles sin conocimiento
    disciplinar adicional
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  # Clasifica el tipo de problema ("cuantitativo" o "categorico"):
  problema_1 <- "___"  # Horas de estudio y autoeficacia (números)
  problema_2 <- "___"  # Transporte y participación (grupos/categorías)
setup_code: |-
  encuesta_vida_universitaria <- data.frame(
    id = 1:48,
    jornada = c(rep("Diurna", 32), rep("Vespertina", 16)),
    horas_estudio = c(
      c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8, 4, 6, 5, 3, 7),
      c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)
    ),
    autoeficacia_academica = c(
      c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57, 74),
      c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)
    ),
    transporte_campus = rep(c("Metro", "Bus", "Bicicleta", "Bus"), 12),
    participa_organizacion = rep(c("Sí", "No", "Sí", "No", "No", "Sí"), 8),
    stringsAsFactors = FALSE
  )
  encuesta_vinculos_barriales <- data.frame(
    id = 1:40,
    ocupado = c(rep("Sí", 28), rep("No", 12)),
    participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1, 0), 4), rep(c(0, 1, 0), 4)),
    confianza_comunitaria = c(
      c(7, 8, 6, 9, 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),
      c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)
    ),
    stringsAsFactors = FALSE
  )
solution_code: |-
  problema_1 <- "cuantitativo"
  problema_2 <- "categorico"
checks:
- type: object_value
  object: problema_1
  expected: cuantitativo
  message: 'Horas y puntajes son cantidades continuas: problema cuantitativo (correlación).'
- type: object_value
  object: problema_2
  expected: categorico
  message: 'Transporte y participación son grupos: problema categórico (tablas de
    contingencia y chi-cuadrado).'
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Todavía no busques una función. Identifica primero qué variables necesita
    la pregunta y qué representan sus valores.'
- title: Pista 2 · Procedimiento
  text: '> Pregunta si tienes una variable o dos, y si sus valores representan categorías
    o cantidades.'
- title: Pista 3 · Sintaxis / Acción
  text: '> Usa el mapa de familias que aparece después del primer intento y compáralo
    con la combinación de tipos de cada escenario.'
success_message: '> Bien. Elegiste la ruta desde la pregunta y el significado de las
  variables, no desde el nombre de una función.'
navigation:
  next: intro-r-13-002
schema_version: 1
