id: intro-r-13-001
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 0
title: ¿Qué tipo de problema es?
context: 'En los módulos anteriores ya sabías qué familia de problema estabas practicando.
  Ahora queremos decidir a partir de la pregunta.


  Para cada situación responde:


  ```text

  Variables:

  Tipo(s):

  Familia:

  ¿Por qué?

  ```


  **A.** Queremos describir cómo se distribuye el medio principal de transporte al
  campus.


  **B.** Queremos describir el centro y la dispersión de las horas de sueño reportadas.


  **C.** Entre estudiantes de jornada diurna, queremos saber si quienes dedican más
  horas semanales al estudio tienden a reportar mayor o menor autoeficacia académica.


  **D.** Queremos saber si la participación en organizaciones estudiantiles se distribuye
  de la misma manera entre los distintos medios de transporte.'
instruction: '**E.** Queremos saber si trabajar —codificado `0 = No`, `1 = Sí`— se
  asocia con las horas de sueño.'
learning_objectives:
  r: Puede identificar variables relevantes, clasificarlas conceptualmente, elegir
    una familia de análisis y justificar esa elección en cinco situaciones distintas.
  data: Cinco preguntas breves sobre vida universitaria, todas comprensibles sin conocimiento
    disciplinar adicional
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: '# Clasifica el tipo de problema ("cuantitativo" o "categorico"):

  problema_1 <- "___"  # Horas de estudio y autoeficacia (números)

  problema_2 <- "___"  # Transporte y participación (grupos/categorías)'
setup_code: "encuesta_vida_universitaria <- data.frame(\n  id = 1:48,\n  jornada =\
  \ c(rep(\"Diurna\", 32), rep(\"Vespertina\", 16)),\n  horas_estudio = c(\n    c(2,\
  \ 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8,\
  \ 4, 6, 5, 3, 7),\n    c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)\n  ),\n\
  \  autoeficacia_academica = c(\n    c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59,\
  \ 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57,\
  \ 74),\n    c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)\n\
  \  ),\n  transporte_campus = rep(c(\"Metro\", \"Bus\", \"Bicicleta\", \"Bus\"),\
  \ 12),\n  participa_organizacion = rep(c(\"Sí\", \"No\", \"Sí\", \"No\", \"No\"\
  , \"Sí\"), 8),\n  stringsAsFactors = FALSE\n)\ndatos_estudio_diurno <- subset(encuesta_vida_universitaria,\
  \ jornada == \"Diurna\", select = c(\"horas_estudio\", \"autoeficacia_academica\"\
  ))\nencuesta_vinculos_barriales <- data.frame(\n  id = 1:40,\n  ocupado = c(rep(\"\
  Sí\", 28), rep(\"No\", 12)),\n  participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1,\
  \ 0), 4), rep(c(0, 1, 0), 4)),\n  confianza_comunitaria = c(\n    c(7, 8, 6, 9,\
  \ 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),\n   \
  \ c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)\n  ),\n  stringsAsFactors = FALSE\n)"
solution_code: 'problema_1 <- "cuantitativo"

  problema_2 <- "categorico"'
checks:
- type: object_value
  object: problema_1
  expected: cuantitativo
  message: 'Horas y puntajes son cantidades continuas: problema cuantitativo (correlación).'
- type: object_value
  object: problema_2
  expected: categorico
  message: 'Transporte y participación son grupos: problema categórico (tablas de
    contingencia y chi-cuadrado).'
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Todavía no busques una función. Identifica primero qué variables necesita
    la pregunta y qué representan sus valores.'
- title: Pista 2 · Procedimiento
  text: '> Pregunta si tienes una variable o dos, y si sus valores representan categorías
    o cantidades.'
- title: Pista 3 · Sintaxis / Acción
  text: '> Usa el mapa de familias que aparece después del primer intento y compáralo
    con la combinación de tipos de cada escenario.'
success_message: '> Bien. Elegiste la ruta desde la pregunta y el significado de las
  variables, no desde el nombre de una función.'
navigation:
