id: intro-r-13-002
course: intro-r
module: 13-de-la-pregunta-al-analisis
order: 1
title: Prepara antes de analizar
context: |-
  En `encuesta_vida_universitaria` analizaremos a los estudiantes de jornada diurna:

  | id | jornada | horas_estudio | autoeficacia_academica | transporte_campus | participa_organizacion |
  |:---|:---|---:|---:|:---|:---|
  | 1 | Diurna | 2 | 59 | Metro | Sí |
  | 2 | Diurna | 4 | 68 | Bus | No |
  | 3 | Diurna | 3 | 58 | Bicicleta | Sí |
  | 4 | Diurna | 6 | 64 | Bus | No |
  | 5 | Diurna | 5 | 62 | Metro | No |
  | 6 | Diurna | 8 | 75 | Bus | Sí |
  | ... | ... | ... | ... | ... | ... |
instruction: |-
  1. Filtra a los estudiantes de jornada diurna (`jornada == "Diurna"`), selecciona `horas_estudio` y `autoeficacia_academica`, y guarda el resultado en `datos_estudio_diurno`.
  2. Cuenta los valores ausentes en ambas variables usando `sum(is.na())`.
learning_objectives:
  r: Preparar una submuestra reproducible filtrando casos, seleccionando variables
    y diagnosticando ausencias.
  data: Estudio y autoeficacia académica en estudiantes de jornada diurna
  social: 'Aplicación a investigación social en módulo 13: de la pregunta al análisis.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  # conserva únicamente los casos relevantes
  # y las variables necesarias


  # revisa si las variables del análisis
  # tienen datos ausentes
setup_code: |-
  encuesta_vida_universitaria <- data.frame(
    id = 1:48,
    jornada = c(rep("Diurna", 32), rep("Vespertina", 16)),
    horas_estudio = c(
      c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6, 3, 5, 2, 7, 8, 6, 4, 5, 9, 3, 4, 6, 5, 7, 8, 4, 6, 5, 3, 7),
      c(2, 3, 1, 4, 2, 5, 3, 4, 2, 3, 4, 1, 3, 2, 4, 3)
    ),
    autoeficacia_academica = c(
      c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73, 60, 66, 56, 70, 78, 69, 63, 67, 79, 58, 62, 71, 65, 72, 76, 61, 70, 64, 57, 74),
      c(52, 55, 48, 60, 51, 62, 54, 58, 50, 56, 61, 47, 55, 53, 63, 57)
    ),
    transporte_campus = rep(c("Metro", "Bus", "Bicicleta", "Bus"), 12),
    participa_organizacion = rep(c("Sí", "No", "Sí", "No", "No", "Sí"), 8),
    stringsAsFactors = FALSE
  )
  encuesta_vinculos_barriales <- data.frame(
    id = 1:40,
    ocupado = c(rep("Sí", 28), rep("No", 12)),
    participa_vecinal_01 = c(rep(c(1, 0, 1, 1, 0, 1, 0), 4), rep(c(0, 1, 0), 4)),
    confianza_comunitaria = c(
      c(7, 8, 6, 9, 5, 8, 6, 7, 8, 9, 6, 7, 8, 6, 9, 7, 8, 5, 7, 8, 6, 9, 7, 8, 6, 7, 8, 6),
      c(5, 6, 4, 6, 5, 7, 4, 5, 6, 5, 6, 4)
    ),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_estudio_diurno <- encuesta_vida_universitaria |>
    filter(jornada == "Diurna") |>
    select(
      horas_estudio,
      autoeficacia_academica
    )

  sum(is.na(datos_estudio_diurno$horas_estudio))

  sum(is.na(datos_estudio_diurno$autoeficacia_academica))
checks:
- type: object_exists
  object: datos_estudio_diurno
  message: Debes crear el objeto 'datos_estudio_diurno' usando <-.
- type: custom_r
  code: exists('datos_estudio_diurno', envir = .target_env, inherits = FALSE)
  message: El objeto 'datos_estudio_diurno' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> ¿Qué parte de la pregunta indica qué personas deben entrar al análisis?'
- title: Pista 2 · Procedimiento
  text: '> Después de definir los casos, conserva solo `horas_estudio` y `autoeficacia_academica`.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    encuesta_vida_universitaria |>
      filter(jornada == "Diurna") |>
      select(
        horas_estudio,
        autoeficacia_academica
      )
success_message: '> Bien. Primero definiste la población y las variables de la pregunta;
  después comprobaste el missing que realmente importa para este análisis.'
navigation:
