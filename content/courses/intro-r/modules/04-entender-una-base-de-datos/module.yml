id: 04-entender-una-base-de-datos
title: 'Módulo 4: Entender una base de datos'
short_title: Módulo 4
order: 4
description: 'Comprende la estructura de un data frame: cómo las filas representan
  casos o personas, las columnas representan variables, y cómo extraer una columna
  como vector utilizando el operador $.'
learning_outcomes: &id001
- Reconocer qué muestran las filas y las columnas de una base.
- Inspeccionar los primeros casos y la estructura de los datos.
- Recuperar una variable completa usando `$`.
