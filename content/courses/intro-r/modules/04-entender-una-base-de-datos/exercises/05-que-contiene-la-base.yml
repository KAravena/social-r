id: intro-r-04-005
course: intro-r
module: 04-entender-una-base-de-datos
order: 4
title: ¿Qué contiene la base?
context: '`str()` resume la estructura técnica de una base: cantidad de observaciones,
  número de variables, nombres y tipo de almacenamiento (`num`, `chr`, etc.):


  `str(encuesta_social_demo)`'
instruction: Ejecuta `str(encuesta_social_demo)` y revisa la lista de variables y
  el número de casos en la consola.
learning_objectives:
  r: Inspeccionar la estructura de un data frame usando `str()`.
  data: Inspección de `encuesta_social_demo`
  social: 'Aplicación a investigación social en módulo 4: entender una base de datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: str(encuesta_social_demo)
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n\
  )\nencuesta_barrio <- data.frame(\n  persona = 1:4,\n  edad = c(34, 27, 41, 22),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"),\n  minutos_viaje\
  \ = c(45, 30, 50, 20),\n  stringsAsFactors = FALSE\n)"
solution_code: str(encuesta_social_demo)
checks:
- type: custom_r
  code: grepl('str\\s*\\(', .user_code)
  message: Ejecuta str(encuesta_social_demo) para observar la estructura interna de
    la base.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Busca los nombres de las columnas dentro de la salida.
- title: Pista 2 · Procedimiento
  text: No necesitas interpretar las abreviaciones técnicas para responder.
- title: Pista 3 · Sintaxis / Acción
  text: 'Ejecuta:




    y busca `edad`, `carrera` y `horas_estudio`.'
  code: str(encuesta_social_demo)
success_message: '**Bien.** Usaste `str()` como una vista rápida de la estructura
  y localizaste las variables de la base sin convertir los códigos técnicos de almacenamiento
  en tipos estadísticos.'
