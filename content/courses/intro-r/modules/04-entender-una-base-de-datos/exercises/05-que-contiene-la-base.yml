id: intro-r-04-005
course: intro-r
module: 04-entender-una-base-de-datos
order: 4
title: ¿Qué contiene la base?
context: 'Ya puedes mirar las primeras filas y extraer una variable.


  Otra pregunta útil al recibir una base es:


  > ¿cómo está organizada?


  R puede mostrar una descripción rápida con:


  ```r

  str(encuesta_social_demo)

  ```


  No necesitas comprender todo lo que aparece.


  Por ahora fíjate solo en:


  1. que el objeto contiene varias variables;

  2. los nombres de esas variables;

  3. que R muestra además información técnica sobre cómo almacena sus valores.


  Puedes ver abreviaciones como `int`, `num` o `chr`.


  **No necesitas memorizarlas en este módulo.**


  Y, sobre todo:


  > esos códigos describen cómo R almacena valores; no equivalen automáticamente a
  clasificar una variable como cuantitativa o categórica.


  Esa clasificación se trabajará después a partir de lo que la variable representa.


  Ejecuta:


  ```r

  str(encuesta_social_demo)

  ```


  Después responde:'
instruction: '- ¿aparece una variable llamada `edad`?

  - ¿aparece una variable llamada `carrera`?

  - ¿aparece una variable llamada `horas_estudio`?'
learning_objectives:
  r: Puede ejecutar `str()` con apoyo y localizar variables dentro de su salida sin
    confundir códigos de almacenamiento con t
  data: Inspección de `encuesta_social_demo`
  social: 'Aplicación a investigación social en módulo 4: entender una base de datos.'
