id: intro-r-04-006
course: intro-r
module: 04-entender-una-base-de-datos
order: 5
title: Otra encuesta
context: |-
  Dispones de una base sobre movilidad llamada `encuesta_barrio`:

  | persona | edad | transporte | minutos_viaje |
  |:---|---:|:---|---:|
  | 1 | 34 | Bus | 45 |
  | 2 | 27 | Metro | 30 |
  | 3 | 41 | Bus | 50 |
  | 4 | 22 | Bicicleta | 20 |
instruction: |-
  Usando lo aprendido en el módulo:

  1. Extrae la variable `minutos_viaje` de `encuesta_barrio` y guárdala en `tiempos`.
  2. Extrae la variable `transporte` de `encuesta_barrio` y guárdala en `medios`.
learning_objectives:
  r: Transferir de forma autónoma la lectura e identificación de variables y extracción
    con `$` a una nueva base.
  data: Encuesta de movilidad barrial
  social: 'Aplicación a investigación social en módulo 4: entender una base de datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: |+
  # 1. Guarda la columna minutos_viaje de encuesta_barrio en tiempos


  # 2. Guarda la columna transporte de encuesta_barrio en medios

setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_barrio <- data.frame(
    persona = 1:4,
    edad = c(34, 27, 41, 22),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta"),
    minutos_viaje = c(45, 30, 50, 20),
    stringsAsFactors = FALSE
  )
solution_code: |-
  tiempos <- encuesta_barrio$minutos_viaje
  medios <- encuesta_barrio$transporte
checks:
- type: object_exists
  object: tiempos
  message: Debes crear el objeto 'tiempos' con minutos_viaje.
- type: object_value
  object: tiempos
  expected:
  - 45
  - 30
  - 50
  - 20
  message: '''tiempos'' debe contener c(45, 30, 50, 20).'
- type: object_exists
  object: medios
  message: Debes crear el objeto 'medios' con transporte.
- type: object_value
  object: medios
  expected:
  - Bus
  - Metro
  - Bus
  - Bicicleta
  message: '''medios'' debe contener c(''Bus'', ''Metro'', ''Bus'', ''Bicicleta'').'
- type: custom_r
  code: grepl('encuesta_barrio\\s*\\$', .user_code)
  message: Extrae ambas variables desde encuesta_barrio usando el operador $.
diagnostics:
- when_r: '!exists(''tiempos'', envir = .target_env)'
  message: Extrae los tiempos con 'tiempos <- encuesta_barrio$minutos_viaje'.
  type: warning
- when_r: '!exists(''medios'', envir = .target_env)'
  message: Extrae los medios de transporte con 'medios <- encuesta_barrio$transporte'.
  type: warning
hints:
- title: Pista 1 · Conceptual
  text: Decide primero si cada pregunta se refiere a un caso o a una variable.
- title: Pista 2 · Procedimiento
  text: Para recuperar una variable necesitas el nombre de la base y el nombre de
    la columna.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: encuesta_barrio$minutos_viaje
success_message: '**Bien.** La base cambió, pero la organización es la misma: cada
  fila representa un caso, cada columna una variable, y pudiste recuperar una variable
  nueva por su nombre.'
navigation:
  next: intro-r-05-001
schema_version: 1
