id: intro-r-04-006
course: intro-r
module: 04-entender-una-base-de-datos
order: 5
title: Otra encuesta
context: 'Dispones de una base con cuatro observaciones sobre transporte y tiempos
  de viaje:


  ```text

  encuesta_barrio

  persona   edad   transporte   minutos_viaje

  1         34     Bus          45

  2         27     Metro        30

  3         41     Bus          50

  4         22     Bicicleta    20

  ```'
instruction: Extrae la columna `minutos_viaje` desde `encuesta_barrio` utilizando
  el operador `$`.
learning_objectives:
  r: Extraer una columna de un data frame como vector usando el operador `$`.
  data: Encuesta de movilidad barrial
  social: 'Aplicación a investigación social en módulo 4: entender una base de datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: '# Extrae la columna minutos_viaje de encuesta_barrio

  '
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n\
  )\nencuesta_barrio <- data.frame(\n  persona = 1:4,\n  edad = c(34, 27, 41, 22),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"),\n  minutos_viaje\
  \ = c(45, 30, 50, 20),\n  stringsAsFactors = FALSE\n)"
solution_code: encuesta_barrio$minutos_viaje
checks:
- type: result_equals
  expected:
  - 45
  - 30
  - 50
  - 20
  message: Extrae la columna minutos_viaje de encuesta_barrio con el operador $.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Decide primero si cada pregunta se refiere a un caso o a una variable.
- title: Pista 2 · Procedimiento
  text: Para recuperar una variable necesitas el nombre de la base y el nombre de
    la columna.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: encuesta_barrio$minutos_viaje
success_message: '**Bien.** La base cambió, pero la organización es la misma: cada
  fila representa un caso, cada columna una variable, y pudiste recuperar una variable
  nueva por su nombre.'
navigation:
