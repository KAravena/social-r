id: intro-r-04-001
course: intro-r
module: 04-entender-una-base-de-datos
order: 0
title: Varias características de las mismas personas
context: "Un **data frame** organiza múltiples características de las mismas personas\
  \ en una tabla:\n\n- **Filas (casos)**: cada fila reúne todas las respuestas de\
  \ una persona.\n- **Columnas (variables)**: cada columna mide una misma característica\
  \ para todos los casos.\n\n```text\n             edad   horas_estudio   carrera\n\
  Persona 1      20         3         Sociología\nPersona 2      22         5    \
  \     Historia\nPersona 3      19         2         Antropología\nPersona 4    \
  \  21         4         Sociología\n```"
instruction: Revisa la tabla y guarda en `edad_persona_2` la edad de la persona que
  estudia 5 horas (Persona 2).
learning_objectives:
  r: 'Comprender la estructura de un data frame: filas como casos y columnas como
    variables.'
  data: Una pequeña encuesta a cuatro estudiantes
  social: 'Aplicación a investigación social en módulo 4: entender una base de datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: '# Pregunta 1: ¿Cuántos años tiene la persona que estudia 5 horas?

  edad_persona_2 <- ___'
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n\
  )\nencuesta_barrio <- data.frame(\n  persona = 1:4,\n  edad = c(34, 27, 41, 22),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"),\n  minutos_viaje\
  \ = c(45, 30, 50, 20),\n  stringsAsFactors = FALSE\n)"
solution_code: edad_persona_2 <- 22
checks:
- type: object_exists
  object: edad_persona_2
  message: Debes crear el objeto 'edad_persona_2'.
- type: object_value
  object: edad_persona_2
  expected: 22
  message: La persona que estudia 5 horas tiene 22 años (Persona 2).
diagnostics:
- when_r: exists('edad_persona_2', envir = .target_env) && !isTRUE(all.equal(get('edad_persona_2',
    envir = .target_env), 22))
  message: 'Revisa la tabla: la Persona 2 tiene 22 años y estudia 5 horas.'
  type: warning
hints:
- title: Pista 1 · Conceptual
  text: Sigue a una sola persona a través de las distintas características.
- title: Pista 2 · Procedimiento
  text: Los valores que estaban en la misma posición pertenecen al mismo caso y quedan
    en la misma fila.
- title: Pista 3 · Sintaxis / Acción
  text: La persona con 5 horas de estudio está en la segunda fila; en esa misma fila
    la edad es 22.
success_message: '**Bien.** Seguiste a la misma persona a través de distintas características.
  Una fila mantiene juntas las características de un mismo caso.'
navigation:
  next: intro-r-04-002
schema_version: 1
