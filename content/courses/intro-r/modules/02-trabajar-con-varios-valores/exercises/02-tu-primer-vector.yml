id: intro-r-02-002
course: intro-r
module: 02-trabajar-con-varios-valores
order: 1
title: Tu primer vector
context: 'Cinco personas informaron estos tiempos de viaje en minutos: **20, 35, 45,
  25 y 30**, en ese orden.'
instruction: Reúne los cinco tiempos en un solo vector usando `c()`, guárdalo en `tiempos_viaje`
  y consúltalo.
learning_objectives:
  r: Construir un vector numérico con valores en un orden determinado.
  data: Otro grupo de cinco personas informa sus tiempos de viaje
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: '# guarda aquí los cinco tiempos en tiempos_viaje'
setup_code: ''
solution_code: |-
  tiempos_viaje <- c(20, 35, 45, 25, 30)
  tiempos_viaje
checks:
- type: object_exists
  object: tiempos_viaje
  message: Debes crear el objeto 'tiempos_viaje' usando <-.
- type: custom_r
  code: exists('tiempos_viaje', envir = .target_env, inherits = FALSE)
  message: El objeto 'tiempos_viaje' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Piensa en la estructura que permitió guardar cinco valores juntos en E1.
- title: Pista 2 · Procedimiento
  text: El objeto debe llamarse `tiempos_viaje` y a la derecha de `<-` necesitas `c(...)`.
- title: Pista 3 · Sintaxis / Acción
  text: Después consulta `tiempos_viaje`.
  code: tiempos_viaje <- c(20, 35, 45, 25, 30)
success_message: '**Bien.** Creaste un solo objeto que contiene los cinco tiempos
  y mantuviste su orden. Ya no necesitas un objeto diferente para cada observación.'
navigation:
  next: intro-r-02-003
schema_version: 1
