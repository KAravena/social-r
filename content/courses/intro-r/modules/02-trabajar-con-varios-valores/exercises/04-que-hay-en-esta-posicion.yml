id: intro-r-02-004
course: intro-r
module: 02-trabajar-con-varios-valores
order: 3
title: ¿Qué hay en esta posición?
context: |-
  Para recuperar un valor según su posición usamos corchetes `[]`. En R las posiciones comienzan en 1:

  `tiempos_viaje[3]` recupera el tercer valor (`35`), no el número 3.
instruction: Recupera la tercera observación de `tiempos_viaje` ejecutando `tiempos_viaje[3]`.
learning_objectives:
  r: Recuperar un valor individual de un vector usando corchetes de posición `[]`.
  data: |-
    Tiempos de viaje:

    `25, 40, 35, 50, 30`
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: |-
  tiempos_viaje <- c(25, 40, 35, 50, 30)

  tiempos_viaje[3]
setup_code: tiempos_viaje <- c(25, 40, 35, 50, 30)
solution_code: tiempos_viaje[3]
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: 'Primero identifica dónde está el dato: ¿qué valor ocupa la tercera posición?'
- title: Pista 2 · Procedimiento
  text: Para seleccionar una posición, escribe el nombre del objeto seguido de corchetes.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: tiempos_viaje[3]
success_message: '**Bien.** Usaste una posición para recuperar un valor desde el vector.
  El `3` dentro de los corchetes significa “tercera posición”, no “valor 3”.'
navigation:
  next: intro-r-02-005
schema_version: 1
