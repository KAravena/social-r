id: intro-r-02-006
course: intro-r
module: 02-trabajar-con-varios-valores
order: 5
title: Vuelve a usar lo aprendido
context: Cinco estudiantes informaron que estudiaron **2, 4, 3, 5 y 1** horas, en
  ese orden.
instruction: |-
  1. Guarda los cinco valores juntos en `horas_estudio`.
  2. Calcula la suma de todos los valores y guárdala en `total`.
  3. Recupera la cuarta observación y guárdala en `cuarta`.
learning_objectives:
  r: Integrar creación, suma y selección por posición de un vector.
  data: Cinco estudiantes informaron cuántas horas estudiaron el día anterior
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: |
  # guarda los cinco valores en horas_estudio


  # calcula el total


  # recupera la cuarta observación
setup_code: ''
solution_code: |-
  horas_estudio <- c(2, 4, 3, 5, 1)
  total <- sum(horas_estudio)
  cuarta <- horas_estudio[4]
checks:
- type: object_exists
  object: horas_estudio
  message: Debes crear el objeto 'horas_estudio' usando <-.
- type: object_value
  object: horas_estudio
  expected:
  - 2
  - 4
  - 3
  - 5
  - 1
  message: '''horas_estudio'' debe contener los cinco valores c(2, 4, 3, 5, 1).'
- type: object_exists
  object: total
  message: Debes guardar el total de horas en 'total'.
- type: object_value
  object: total
  expected: 15
  message: '''total'' debe ser 15.'
- type: object_exists
  object: cuarta
  message: Debes guardar la cuarta observación en 'cuarta'.
- type: object_value
  object: cuarta
  expected: 5
  message: '''cuarta'' debe ser 5 (la cuarta posición de horas_estudio).'
diagnostics:
- when_r: '!exists(''horas_estudio'', envir = .target_env)'
  message: Crea 'horas_estudio <- c(2, 4, 3, 5, 1)'.
  type: warning
- when_r: '!exists(''total'', envir = .target_env)'
  message: Calcula 'total <- sum(horas_estudio)'.
  type: warning
- when_r: '!exists(''cuarta'', envir = .target_env)'
  message: Recupera 'cuarta <- horas_estudio[4]'.
  type: warning
hints:
- title: Pista 1 · Conceptual
  text: 'Divide el problema en tres decisiones: primero guardar juntos, después usar
    todos, después recuperar una posición.'
- title: Pista 2 · Procedimiento
  text: Para el primer paso necesitas la construcción de vectores; para el total,
    la función vista en E3; para la cuarta observación, los corchetes.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    horas_estudio <- c(2, 4, 3, 5, 1)
    total <- sum(horas_estudio)
    cuarta <- horas_estudio[4]
success_message: '**Bien.** Recuperaste varias ideas sin que la consigna nombrara
  directamente cada herramienta: construiste un vector, usaste todos sus valores y
  recuperaste una posición concreta.'
navigation:
  next: intro-r-02-007
schema_version: 1
