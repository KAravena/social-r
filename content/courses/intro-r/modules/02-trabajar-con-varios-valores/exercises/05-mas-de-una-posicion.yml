id: intro-r-02-005
course: intro-r
module: 02-trabajar-con-varios-valores
order: 4
title: Más de una posición
context: 'Para recuperar varias posiciones pasamos un vector dentro de los corchetes:


  `tiempos_viaje[c(2, 5)]`


  Extrae los valores de las posiciones 2 y 5 (`40` y `30`).'
instruction: Recupera los tiempos de las posiciones 2 y 5 ejecutando `tiempos_viaje[c(2,
  5)]`.
learning_objectives:
  r: Seleccionar múltiples posiciones de un vector combinando `[]` y `c()`.
  data: Del mismo vector de tiempos, queremos recuperar los valores registrados en
    las posiciones 2 y 5
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)


  # selecciona las posiciones 2 y 5'
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  respuestas_diarias <- c(18, 22, 15, 25, 20)

  horas_estudio <- c(4, 6, 2, 8, 5)'
solution_code: tiempos_viaje[c(2, 5)]
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Piensa primero en **dónde** están los dos valores, no en cuáles son.
- title: Pista 2 · Procedimiento
  text: Necesitas reunir las posiciones 2 y 5 y colocar ese conjunto dentro de los
    corchetes.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: tiempos_viaje[c(2, 5)]
success_message: '**Bien.** Reuniste las posiciones 2 y 5 con `c()` y después las
  usaste para seleccionar desde `tiempos_viaje`. Aquí `c(2, 5)` representa posiciones,
  no tiempos de viaje.'
navigation:
  next: intro-r-02-006
schema_version: 1
