    y después consulta `tiempos_viaje`.
  code: tiempos_viaje <- c(25, 40, 35, 50, 30)
success_message: '**Bien.** Antes cada objeto contenía un valor. Ahora `tiempos_viaje`
  contiene cinco valores relacionados y conserva su orden. A este conjunto ordenado
  de valores dentro de un objeto lo llamaremos **vector**.'
