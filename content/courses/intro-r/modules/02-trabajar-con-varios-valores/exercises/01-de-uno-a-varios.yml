id: intro-r-02-001
course: intro-r
module: 02-trabajar-con-varios-valores
order: 0
title: De uno a varios
context: '**Situación.** Cinco personas informaron tiempos de viaje de 25, 40, 35, 50 y 30 minutos.


  En M1 aprendiste a guardar un valor dentro de un objeto. Aquí queremos guardar **los cinco tiempos juntos**.


  Antes de ejecutar, piensa:


  > ¿`tiempos_viaje` guardará un solo valor o los cinco?


  Observa el código:


  ```r

  tiempos_viaje <- c(25, 40, 35, 50, 30)

  ```


  `c()` combina varios valores para que puedan quedar juntos dentro de un mismo objeto.


  Ejecuta esa línea y después consulta:


  ```r

  tiempos_viaje

  ```


  Ahora `tiempos_viaje` contiene cinco valores. En R llamamos **vector** a una estructura como esta.


  El orden también queda guardado: 25 está primero, 40 segundo, 35 tercero, y así sucesivamente.'
instruction: Ejecuta la asignación de `tiempos_viaje` en el script, consulta el objeto en la consola y observa cómo guarda los cinco valores en orden.
learning_objectives:
  r: Comprende que un objeto puede contener varios valores relacionados y reconoce `c()` como la forma inicial de construir ese conjunto en R.
  data: 'Cinco personas informaron cuánto tardaron en viajar a la universidad.


    Tiempos, en minutos:


    `25, 40, 35, 50, 30`'
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
