hints:
- title: Pista 1 · Conceptual
  text: No queremos calcular todavía. Queremos conservar los cinco tiempos juntos.
- title: Pista 2 · Procedimiento
  text: '`c()` permite reunir varios valores dentro del objeto que está a la izquierda
    de `<-`.'
