id: intro-r-02-007
course: intro-r
module: 02-trabajar-con-varios-valores
order: 6
title: Encuentra la información que piden
context: 'Durante cinco semanas se registraron estas participaciones: **3, 1, 4, 2
  y 5**, en ese orden.'
instruction: '1. Guarda los cinco valores en `participacion`.

  2. Calcula el total acumulado y guárdalo en `total`.

  3. Guarda los valores de las semanas 2 y 5 en `seleccion`.'
learning_objectives:
  r: Resolver agregación y selección sobre un vector con autonomía.
  data: Durante cinco semanas se registró la cantidad de participaciones de un grupo
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: '# 1. guarda los cinco valores en participacion



  # 2. calcula el total acumulado en total



  # 3. guarda las posiciones 2 y 5 en seleccion

  '
setup_code: ''
solution_code: 'participacion <- c(3, 1, 4, 2, 5)

  total <- sum(participacion)

  seleccion <- participacion[c(2, 5)]'
checks:
- type: object_exists
  object: participacion
  message: Debes crear el objeto 'participacion' usando <-.
- type: object_value
  object: participacion
  expected:
  - 3
  - 1
  - 4
  - 2
  - 5
  message: '''participacion'' debe contener los cinco valores c(3, 1, 4, 2, 5).'
- type: object_exists
  object: total
  message: Debes calcular y guardar el total en 'total'.
- type: object_value
  object: total
  expected: 15
  message: '''total'' debe ser 15.'
- type: custom_r
  code: grepl('sum\\s*\\(', .user_code)
  message: Calcula 'total' usando la función sum(participacion).
- type: object_exists
  object: seleccion
  message: Debes guardar las posiciones 2 y 5 en 'seleccion'.
- type: object_value
  object: seleccion
  expected:
  - 1
  - 5
  message: '''seleccion'' debe guardar los valores de las posiciones 2 y 5 (1 y 5).'
- type: custom_r
  code: grepl('\\[', .user_code)
  message: Recupera los valores en 'seleccion' indexando con corchetes [c(2, 5)].
diagnostics:
- when_r: '!exists(''participacion'', envir = .target_env)'
  message: Crea 'participacion <- c(3, 1, 4, 2, 5)'.
  type: warning
- when_r: '!exists(''total'', envir = .target_env)'
  message: Falta calcular 'total <- sum(participacion)'.
  type: warning
- when_r: '!exists(''seleccion'', envir = .target_env)'
  message: Falta seleccionar 'seleccion <- participacion[c(2, 5)]'.
  type: warning
- when_r: identical(.target_env$total, 15) && !grepl('sum\\(', .user_code)
  message: Calcula el total usando sum(participacion), no escribiendo 15 directamente.
  type: warning
- when_r: identical(.target_env$seleccion, c(1, 5)) && !grepl('\\[', .user_code)
  message: Recupera los valores usando corchetes [], no creando un vector nuevo con
    c(1, 5).
  type: warning
hints:
- title: Pista 1 · Orientación
  text: ¿Qué función permite combinar varios valores en un solo vector? Revisa el
    uso de `c()`.
- title: Pista 2 · Herramienta
  text: ¿Qué función suma todos los elementos de un vector? Revisa `sum()`.
- title: Pista 3 · Sintaxis
  text: 'Para seleccionar varias posiciones, pasa un vector con los números de posición
    dentro de corchetes: `participacion[c(2, 5)]`.'
success_message: '**Bien.** Decidiste cuándo trabajar con todos los valores y cuándo
  recuperar posiciones específicas. Construiste y usaste un vector sin que la consigna
  nombrara las herramientas.


  Cierre conceptual:


  > Hasta ahora pudiste encontrar valores cuando sabías **en qué posición estaban**.

  >

  > Pero ¿qué pasa si no conoces la posición y solo sabes qué característica buscas?

  >

  > Por ejemplo: “los tiempos mayores que 30”.'
navigation:
  next: intro-r-03-001
schema_version: 1
