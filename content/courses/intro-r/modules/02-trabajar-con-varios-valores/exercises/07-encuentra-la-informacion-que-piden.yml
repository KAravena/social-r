id: intro-r-02-007
course: intro-r
module: 02-trabajar-con-varios-valores
order: 6
title: Encuentra la información que piden
context: '**Situación.** Durante cinco semanas se registraron estas cantidades de participaciones:


  **3, 1, 4, 2 y 5**, en ese orden.'
instruction: 'Escribe código para:


  1. guardar los cinco valores juntos en un objeto llamado `participacion`;

  2. responder cuántas participaciones hubo en total y guardarlo en `total`;

  3. recuperar cuántas participaciones se registraron en las semanas 2 y 5 y guardarlas en `seleccion`.'
learning_objectives:
  r: Puede decidir de forma relativamente autónoma cómo construir y usar un vector para responder preguntas simples sobre todos sus valores o sobre posiciones específicas.
  data: Durante cinco semanas se registró la cantidad de participaciones de un grupo
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: '# guarda los datos



  # responde las dos preguntas'
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  respuestas_diarias <- c(18, 22, 15, 25, 20)

  horas_estudio <- c(4, 6, 2, 8, 5)'
solution_code: 'participacion <- c(3, 1, 4, 2, 5)

  total <- sum(participacion)

  seleccion <- participacion[c(2, 5)]'
checks:
- type: object_exists
  object: participacion
  message: Debes crear el objeto 'participacion' con los cinco valores solicitados.
- type: object_value
  object: participacion
  expected:
  - 3
  - 1
  - 4
  - 2
  - 5
  message: El vector 'participacion' debe contener los valores c(3, 1, 4, 2, 5) en ese orden.
- type: object_exists
  object: total
  message: Todavía falta calcular el total y guardarlo en el objeto 'total'.
- type: custom_r
  code: grepl('sum[[:space:]]*[(][[:space:]]*participacion', .user_code) || (isTRUE(all.equal(get('total', envir = .target_env), 15)) && !grepl('total[[:space:]]*<-[[:space:]]*15', .user_code))
  message: El total coincide o debe calcularse a partir de 'participacion' usando sum(participacion).
- type: object_value
  object: total
  expected: 15
  message: El objeto 'total' debe ser igual a 15.
- type: object_exists
  object: seleccion
  message: Falta recuperar las semanas 2 y 5 y guardar el resultado en 'seleccion'.
- type: custom_r
  code: grepl('participacion[[:space:]]*[[]', .user_code)
  message: Debes recuperar los valores desde las posiciones del objeto 'participacion' usando corchetes [ ], no escribirlos directamente.
- type: object_value
  object: seleccion
  expected:
  - 1
  - 5
  message: El objeto 'seleccion' debe contener los valores de las semanas 2 y 5 (1 y 5).
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Para cada pregunta, decide primero si necesitas trabajar con **todos los valores** o con **posiciones concretas**.
- title: Pista 2 · Procedimiento
  text: Primero necesitas crear `participacion`. Después una pregunta usa el vector completo y la otra pide las posiciones 2 y 5.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: 'participacion <- c(3, 1, 4, 2, 5)

    total <- sum(participacion)

    seleccion <- participacion[c(2, 5)]'
success_message: '**Bien.** Decidiste cuándo trabajar con todos los valores y cuándo recuperar posiciones específicas. Construiste y usaste un vector sin que la consigna nombrara las herramientas.


  Cierre conceptual:


  > Hasta ahora pudiste encontrar valores cuando sabías **en qué posición estaban**.

  >

  > Pero ¿qué pasa si no conoces la posición y solo sabes qué característica buscas?

  >

  > Por ejemplo: “los tiempos mayores que 30”.'
navigation:
  next: intro-r-03-001
schema_version: 1
