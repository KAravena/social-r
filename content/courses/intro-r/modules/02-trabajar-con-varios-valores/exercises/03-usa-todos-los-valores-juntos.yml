id: intro-r-02-003
course: intro-r
module: 02-trabajar-con-varios-valores
order: 2
title: Usa todos los valores juntos
context: '`respuestas_diarias` guarda la cantidad de respuestas recibidas durante
  cinco días:


  ```r

  respuestas_diarias <- c(18, 22, 15, 25, 20)

  ```


  Ahora queremos sumar **todos los valores del vector**.


  Observa:


  ```r

  sum(respuestas_diarias)

  ```


  `sum()` suma todos los valores contenidos en el objeto.


  `c()` y `sum()` son funciones de R. Por ahora basta con reconocer este patrón: una
  función se escribe con su nombre seguido de paréntesis, y dentro colocamos la información
  que necesita.'
instruction: Guarda el resultado de `sum(respuestas_diarias)` en un objeto llamado
  `total_respuestas`. Después consúltalo.
learning_objectives:
  r: Puede usar un vector completo como entrada de una función sencilla y guardar
    el resultado
  data: Cantidad de respuestas recibidas durante cinco días
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: 'respuestas_diarias <- c(18, 22, 15, 25, 20)


  # guarda la suma completa en total_respuestas'
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  respuestas_diarias <- c(18, 22, 15, 25, 20)

  horas_estudio <- c(4, 6, 2, 8, 5)'
solution_code: 'respuestas_diarias <- c(18, 22, 15, 25, 20)


  total_respuestas <- sum(respuestas_diarias)

  total_respuestas'
checks:
- type: object_exists
  object: respuestas_diarias
  message: Debes crear el objeto 'respuestas_diarias' usando <-.
- type: custom_r
  code: exists('respuestas_diarias', envir = .target_env, inherits = FALSE)
  message: El objeto 'respuestas_diarias' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Los cinco valores ya están guardados en `respuestas_diarias`. No necesitas
    escribirlos otra vez.
- title: Pista 2 · Procedimiento
  text: La función que acabas de ver se usa como `sum(objeto)`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: 'total_respuestas <- sum(respuestas_diarias)

    total_respuestas'
success_message: '**Bien.** Reutilizaste el vector completo dentro de una función.
  No tuviste que volver a escribir los cinco valores: `sum()` trabajó directamente
  con `respuestas_diarias`.'
