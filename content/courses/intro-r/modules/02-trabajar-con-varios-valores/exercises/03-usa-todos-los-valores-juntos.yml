id: intro-r-02-003
course: intro-r
module: 02-trabajar-con-varios-valores
order: 2
title: Usa todos los valores juntos
context: 'Las funciones en R reciben datos entre paréntesis y devuelven un resultado:


  `sum(respuestas_diarias)`


  `sum()` recibe un vector completo y suma todos sus elementos.'
instruction: Aplica `sum()` a `respuestas_diarias`, guarda el resultado en `total_respuestas`
  y consúltalo.
learning_objectives:
  r: Aplicar una función como `sum()` a un vector completo y guardar el resultado.
  data: Cantidad de respuestas recibidas durante cinco días
  social: 'Aplicación a investigación social en módulo 2: trabajar con varios valores.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: 'respuestas_diarias <- c(18, 22, 15, 25, 20)


  # guarda la suma completa en total_respuestas'
setup_code: respuestas_diarias <- c(18, 22, 15, 25, 20)
solution_code: 'respuestas_diarias <- c(18, 22, 15, 25, 20)


  total_respuestas <- sum(respuestas_diarias)

  total_respuestas'
checks:
- type: object_exists
  object: total_respuestas
  message: Debes crear el objeto 'total_respuestas' usando <-.
- type: custom_r
  code: exists('total_respuestas', envir = .target_env, inherits = FALSE)
  message: El objeto 'total_respuestas' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Los cinco valores ya están guardados en `respuestas_diarias`. No necesitas
    escribirlos otra vez.
- title: Pista 2 · Procedimiento
  text: La función que acabas de ver se usa como `sum(objeto)`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: 'total_respuestas <- sum(respuestas_diarias)

    total_respuestas'
success_message: '**Bien.** Reutilizaste el vector completo dentro de una función.
  No tuviste que volver a escribir los cinco valores: `sum()` trabajó directamente
  con `respuestas_diarias`.'
navigation:
  next: intro-r-02-004
schema_version: 1
