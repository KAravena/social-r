id: 02-trabajar-con-varios-valores
title: 'Módulo 2: Trabajar con varios valores'
short_title: Módulo 2
order: 2
description: Descubre cómo organizar múltiples datos de una misma característica mediante
  vectores con c(), comprender el orden de las observaciones y acceder a posiciones
  específicas con corchetes [].
learning_outcomes: &id001
- Guardar varios valores juntos en un vector.
- Usar todos los valores de un vector para obtener resultados.
- Recuperar uno o varios valores según su posición.
