id: intro-r-12-005
course: intro-r
module: 12-relacionar-categorias
order: 4
title: Mira lo que esperaba la prueba
context: El objeto retornado por `chisq.test()` contiene tanto las frecuencias reales
  (`prueba$observed`) como las frecuencias esperadas teóricas (`prueba$expected`).
instruction: Consulta primero las frecuencias observadas (`prueba$observed`) y luego
  las frecuencias esperadas (`prueba$expected`).
learning_objectives:
  r: Inspeccionar las frecuencias esperadas de una prueba chi-cuadrado con `$expected`
    para validar sus supuestos.
  data: Mismo test de participación × transporte
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # 1. Consulta las frecuencias observadas:
  prueba$observed

  # 2. Ahora consulta las frecuencias esperadas:
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
  tabla <- table(encuesta_participacion$participacion_organizacion, encuesta_participacion$transporte_campus)
  prueba <- suppressWarnings(chisq.test(tabla))
solution_code: |-
  prueba$observed
  prueba$expected
checks:
- type: custom_r
  code: grepl('prueba\\$expected', .user_code)
  message: Consulta las frecuencias esperadas con prueba$expected.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> `prueba` guarda más componentes que el p-value.'
- title: Pista 2 · Procedimiento
  text: '> Recupera `$`, igual que cuando extraías una variable de una base.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: prueba$expected
success_message: '> Bien. Volviste desde el test al patrón que lo genera: observed
  muestra lo ocurrido; expected muestra el escenario de independencia.'
navigation:
  next: intro-r-12-006
schema_version: 1
