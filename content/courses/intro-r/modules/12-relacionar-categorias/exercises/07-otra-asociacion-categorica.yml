id: intro-r-12-007
course: intro-r
module: 12-relacionar-categorias
order: 6
title: Otra asociación categórica
context: En `encuesta_comunidad` queremos estudiar si la actividad comunitaria se
  distribuye de manera diferente según la zona de residencia.
instruction: |-
  1. Construye la tabla cruzada entre `zona_residencia` y `actividad_comunitaria` y guárdala en `tabla_comunidad`.
  2. Evalúa la independencia entre ambas variables con `chisq.test()` y guarda el resultado en `prueba_comunidad`.
learning_objectives:
  r: 'Analizar autónomamente la asociación entre dos variables categóricas: tabla,
    porcentajes y chi-cuadrado.'
  data: Zona de residencia y participación en actividades comunitarias
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  # organiza conjuntamente las dos variables


  # compara los grupos con porcentajes adecuados


  # evalúa la asociación


  # revisa los valores esperados antes de interpretar
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
solution_code: |-
  tabla_comunidad <- table(
    encuesta_comunidad$zona_residencia,
    encuesta_comunidad$actividad_comunitaria
  )

  prop.table(
    tabla_comunidad,
    1
  )

  prueba_comunidad <- chisq.test(
    tabla_comunidad
  )

  prueba_comunidad

  prueba_comunidad$expected
checks:
- type: object_exists
  object: tabla_comunidad
  message: Debes crear el objeto 'tabla_comunidad' usando <-.
- type: custom_r
  code: exists('tabla_comunidad', envir = .target_env, inherits = FALSE)
  message: El objeto 'tabla_comunidad' debe existir en el entorno.
- type: object_exists
  object: prueba_comunidad
  message: Debes crear el objeto 'prueba_comunidad' usando <-.
- type: custom_r
  code: exists('prueba_comunidad', envir = .target_env, inherits = FALSE)
  message: El objeto 'prueba_comunidad' debe existir en el entorno.
- type: custom_r
  code: grepl('chisq\\.test\\s*\\(', .user_code)
  message: Ejecuta la prueba de chi-cuadrado con chisq.test().
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Ambas variables son categóricas: empieza organizando sus combinaciones.'
- title: Pista 2 · Procedimiento
  text: '> La pregunta compara la actividad **dentro de cada zona**, así que decide
    el denominador desde esa frase.'
- title: Pista 3 · Sintaxis / Acción
  text: '> Después de la tabla y los porcentajes, recupera el test de independencia
    y revisa sus esperados.'
success_message: '> Bien. Separaste la descripción del patrón, la evidencia contra
  independencia y la magnitud, y mantuviste la interpretación en términos de asociación.'
navigation:
