id: intro-r-12-001
course: intro-r
module: 12-relacionar-categorias
order: 0
title: Dos variables categóricas
context: |-
  Para estudiar la relación entre dos variables cualitativas, construimos una **tabla de contingencia (cruzada)**:

  `table(base$variable_fila, base$variable_columna)`

  Distribución en `encuesta_participacion` (60 casos):

  | Participación | Metro | Bus | Bicicleta | Total |
  |:---|---:|---:|---:|---:|
  | **Participa** | 12 | 20 | 8 | 40 |
  | **No participa** | 3 | 10 | 7 | 20 |
  | **Total** | 15 | 30 | 15 | 60 |
instruction: Cruza `participacion_organizacion` y `transporte_campus` en `encuesta_participacion`
  con `table()`, guárdala en `tabla` y muéstrala en consola.
learning_objectives:
  r: Construir una tabla de contingencia bidimensional con `table(x, y)`.
  data: Participación en organizaciones y medio principal de transporte al campus
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # Construye la tabla cruzada entre participacion_organizacion y transporte_campus:
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
solution_code: |-
  tabla <- table(
    encuesta_participacion$participacion_organizacion,
    encuesta_participacion$transporte_campus
  )
  tabla
checks:
- type: object_exists
  object: tabla
  message: Debes guardar la tabla cruzada en el objeto 'tabla'.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> En M7 usaste `table()` para una variable. Ahora necesitas contar combinaciones
    de dos.'
- title: Pista 2 · Procedimiento
  text: '> `table()` puede recibir dos variables: la primera formará las filas y la
    segunda las columnas.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    tabla <- table(
      encuesta_participacion$participacion_organizacion,
      encuesta_participacion$transporte_campus
    )
success_message: '> Bien. Cada celda cuenta personas que pertenecen simultáneamente
  a una categoría de participación y una categoría de transporte.'
navigation:
  next: intro-r-12-002
schema_version: 1
