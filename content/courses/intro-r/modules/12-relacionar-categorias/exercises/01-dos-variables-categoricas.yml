id: intro-r-12-001
course: intro-r
module: 12-relacionar-categorias
order: 0
title: Dos variables categóricas
context: 'Hasta ahora contamos categorías de una variable a la vez.


  Ahora las dos características representan categorías:


  - participación en organizaciones;

  - medio principal de transporte al campus.


  No necesitamos convertirlas en números.


  Queremos saber **cuántas personas aparecen en cada combinación**.'
instruction: Antes de ejecutar, predice qué forma tendrá la tabla si la primera variable
  tiene 2 categorías y la segunda 3.
learning_objectives:
  r: Puede construir y leer una tabla bidimensional de frecuencias conjuntas con `table(x,
    y)` y explicar qué representan filas, columnas y una celda.
  data: Participación en organizaciones y medio principal de transporte al campus
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: "tabla <- table(\n  encuesta_participacion$participacion_organizacion,\n\
  \  encuesta_participacion$transporte_campus\n)\n\ntabla"
setup_code: "set.seed(42)\nencuesta_participacion <- data.frame(\n  id = 1:60,\n \
  \ participacion_organizacion = c(rep(\"Participa\", 40), rep(\"No participa\", 20)),\n\
  \  transporte_campus = c(\n    rep(\"Metro\", 12), rep(\"Bus\", 20), rep(\"Bicicleta\"\
  , 8),\n    rep(\"Metro\", 3), rep(\"Bus\", 10), rep(\"Bicicleta\", 7)\n  ),\n  stringsAsFactors\
  \ = FALSE\n)\ntabla <- table(encuesta_participacion$participacion_organizacion,\
  \ encuesta_participacion$transporte_campus)\nencuesta_comunidad <- data.frame(\n\
  \  id = 1:80,\n  zona_residencia = rep(c(\"Norte\", \"Centro\", \"Sur\"), length.out\
  \ = 80),\n  actividad_comunitaria = rep(c(\"Alta\", \"Media\", \"Baja\", \"Media\"\
  ), 20),\n  stringsAsFactors = FALSE\n)"
solution_code: "tabla <- table(\n  encuesta_participacion$participacion_organizacion,\n\
  \  encuesta_participacion$transporte_campus\n)\n\ntabla"
checks:
- type: object_exists
  object: tabla
  message: Debes crear el objeto 'tabla'.
- type: custom_r
  code: is.table(get('tabla', envir = .target_env)) && length(dim(get('tabla', envir
    = .target_env))) == 2
  message: '''tabla'' debe ser una tabla de contingencia bidimensional creada con
    table(x, y).'
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> En M7 usaste `table()` para una variable. Ahora necesitas contar combinaciones
    de dos.'
- title: Pista 2 · Procedimiento
  text: '> `table()` puede recibir dos variables: la primera formará las filas y la
    segunda las columnas.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "tabla <- table(\n  encuesta_participacion$participacion_organizacion,\n \
    \ encuesta_participacion$transporte_campus\n)"
success_message: '> Bien. Cada celda cuenta personas que pertenecen simultáneamente
  a una categoría de participación y una categoría de transporte.'
navigation:
  next: intro-r-12-002
schema_version: 1
