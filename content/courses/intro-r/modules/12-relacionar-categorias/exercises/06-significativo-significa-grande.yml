id: intro-r-12-006
course: intro-r
module: 12-relacionar-categorias
order: 5
title: ¿Significativo significa grande?
context: |-
  Un p-value pequeño indica evidencia contra la independencia, pero no mide la fuerza de la asociación:

  - **Tabla 1**: Diferencias mínimas del 2% entre grupos con muestra masiva ($p = 0.03$).
  - **Tabla 2**: Diferencias sustantivas del 25% entre grupos con muestra moderada ($p = 0.01$).
instruction: Compara ambas tablas significativas. Asigna `"Tabla 1"` o `"Tabla 2"`
  a `tabla_asociacion_mas_fuerte` según cuál muestra una asociación sustantivamente
  más intensa.
learning_objectives:
  r: Distinguir entre significación estadística y magnitud sustantiva de una asociación.
  data: Mismo patrón de participación × transporte con N=60 y N=120
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  # Compara ambas tablas (ambas p < 0.05). ¿Cuál muestra una asociación más fuerte y concentrada? ("Tabla 1" o "Tabla 2")
  tabla_asociacion_mas_fuerte <- "___"
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
solution_code: tabla_asociacion_mas_fuerte <- "Tabla 2"
checks:
- type: object_value
  object: tabla_asociacion_mas_fuerte
  expected: Tabla 2
  message: La Tabla 2 tiene una asociación sustantivamente más fuerte (V de Cramér
    mayor) a pesar de que ambas son estadísticamente significativas.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Compara primero las proporciones, no el p-value.'
- title: Pista 2 · Procedimiento
  text: '> Después compara Cramér''s V: ¿cambió?'
- title: Pista 3 · Sintaxis / Acción
  text: '> Si proporciones y V son iguales pero N cambia, p puede cambiar sin que
    la magnitud sea distinta.'
success_message: '> Exacto. Las dos tablas tienen la misma asociación proporcional
  y el mismo Cramér''s V, aunque la evidencia estadística cambia al aumentar N.'
navigation:
  next: intro-r-12-007
schema_version: 1
