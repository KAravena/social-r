id: intro-r-12-004
course: intro-r
module: 12-relacionar-categorias
order: 3
title: Medir observado vs esperado
context: |-
  La **prueba de chi-cuadrado ($\chi^2$) de independencia** evalúa si las discrepancias entre observados y esperados son mayores a las atribuibles al azar:

  `prueba <- chisq.test(tabla)`

  $H_0$: las variables son independientes en la población.
instruction: Ejecuta `chisq.test(tabla)`, guárdalo en `prueba` y revisa el estadístico
  $\chi^2$ y su p-value.
learning_objectives:
  r: Ejecutar la prueba de chi-cuadrado de independencia con `chisq.test()` e interpretar
    $H_0$ y p-value.
  data: La misma tabla de participación × transporte
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  prueba <- chisq.test(
    tabla
  )

  prueba
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
  tabla <- table(encuesta_participacion$participacion_organizacion, encuesta_participacion$transporte_campus)
solution_code: |-
  prueba <- chisq.test(
    tabla
  )

  prueba
checks:
- type: object_exists
  object: prueba
  message: Debes crear el objeto 'prueba' usando <-.
- type: custom_r
  code: exists('prueba', envir = .target_env, inherits = FALSE)
  message: El objeto 'prueba' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Ya tienes la tabla de conteos observados. Necesitas un test de independencia
    para esa tabla.'
- title: Pista 2 · Procedimiento
  text: '> El procedimiento debe comparar globalmente observed con expected.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: prueba <- chisq.test(tabla)
success_message: '> Bien. El p-value indica baja compatibilidad con el escenario nulo
  de independencia, pero todavía no indica cuán marcada es la asociación.'
navigation:
  next: intro-r-12-005
schema_version: 1
