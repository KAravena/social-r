id: intro-r-12-004
course: intro-r
module: 12-relacionar-categorias
order: 3
title: Medir observado vs esperado
context: 'Ya tenemos seis comparaciones entre observado y esperado.


  Chi-cuadrado resume esas discrepancias en un único estadístico.


  Nuestra hipótesis nula será:


  > participación y transporte son independientes en la población.


  Ejecuta el ejemplo y separa tres cosas:'
instruction: '1. qué resume χ²;

  2. qué nos dice p sobre compatibilidad con H0;

  3. qué **todavía no** sabemos sobre la magnitud de la asociación.'
learning_objectives:
  r: Puede ejecutar `chisq.test(tabla)` e interpretar χ², H0 y p sin confundir evidencia
    con magnitud
  data: La misma tabla de participación × transporte
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: "prueba <- chisq.test(\n  tabla\n)\n\nprueba"
setup_code: "set.seed(42)\nencuesta_participacion <- data.frame(\n  id = 1:60,\n \
  \ participacion_organizacion = c(rep(\"Participa\", 40), rep(\"No participa\", 20)),\n\
  \  transporte_campus = c(\n    rep(\"Metro\", 12), rep(\"Bus\", 20), rep(\"Bicicleta\"\
  , 8),\n    rep(\"Metro\", 3), rep(\"Bus\", 10), rep(\"Bicicleta\", 7)\n  ),\n  stringsAsFactors\
  \ = FALSE\n)\ntabla <- table(encuesta_participacion$participacion_organizacion,\
  \ encuesta_participacion$transporte_campus)\nencuesta_comunidad <- data.frame(\n\
  \  id = 1:80,\n  zona_residencia = rep(c(\"Norte\", \"Centro\", \"Sur\"), length.out\
  \ = 80),\n  actividad_comunitaria = rep(c(\"Alta\", \"Media\", \"Baja\", \"Media\"\
  ), 20),\n  stringsAsFactors = FALSE\n)"
solution_code: "prueba <- chisq.test(\n  tabla\n)\n\nprueba"
checks:
- type: object_exists
  object: prueba
  message: Debes guardar el resultado del test en 'prueba'.
- type: custom_r
  code: inherits(get('prueba', envir = .target_env), 'htest')
  message: '''prueba'' debe crearse ejecutando chisq.test(tabla).'
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> Ya tienes la tabla de conteos observados. Necesitas un test de independencia
    para esa tabla.'
- title: Pista 2 · Procedimiento
  text: '> El procedimiento debe comparar globalmente observed con expected.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: prueba <- chisq.test(tabla)
success_message: '> Bien. El p-value indica baja compatibilidad con el escenario nulo
  de independencia, pero todavía no indica cuán marcada es la asociación.'
navigation:
  next: intro-r-12-005
schema_version: 1
