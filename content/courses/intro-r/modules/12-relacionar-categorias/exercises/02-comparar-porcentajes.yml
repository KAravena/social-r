id: intro-r-12-002
course: intro-r
module: 12-relacionar-categorias
order: 1
title: Comparar porcentajes
context: |-
  Como los grupos tienen tamaños diferentes (40 que participan vs 20 que no), debemos comparar **porcentajes condicionales por fila**:

  `prop.table(tabla, margin = 1) * 100`

  Cada fila suma exactamente 100%.
instruction: Calcula las proporciones por fila de `tabla` usando `prop.table()` con
  el argumento `margin = 1`.
learning_objectives:
  r: Calcular porcentajes condicionales por fila en una tabla de contingencia.
  data: Queremos comparar cómo se distribuye el transporte **dentro de cada grupo
    de participación**
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # Calcula las proporciones por fila de tabla:
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
  tabla <- table(encuesta_participacion$participacion_organizacion, encuesta_participacion$transporte_campus)
solution_code: prop.table(tabla, 1)
checks:
- type: custom_r
  code: grepl('prop\\.table\\s*\\(', .user_code)
  message: Calcula las proporciones por fila usando prop.table(tabla, 1) o margin
    = 1.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> La pregunta dice “dentro de cada grupo de participación”.'
- title: Pista 2 · Procedimiento
  text: '> Participación está en las filas; cada fila debe sumar 100 %.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    prop.table(
      tabla,
      1
    )
success_message: '> Bien. La pregunta era “dentro de cada grupo de participación”,
  por eso cada fila es su propio denominador.'
navigation:
  next: intro-r-12-003
schema_version: 1
