id: intro-r-12-002
course: intro-r
module: 12-relacionar-categorias
order: 1
title: Comparar porcentajes
context: 'Para comparar grupos calculamos porcentajes según el denominador adecuado
  a la pregunta:


  - `prop.table(tabla, 1) * 100`: porcentajes por fila (cada fila suma 100%).

  - `prop.table(tabla, 2) * 100`: porcentajes por columna (cada columna suma 100%).'
instruction: Calcula los porcentajes por fila de `tabla` usando `prop.table(tabla,
  1) * 100` para comparar el transporte según participación.
learning_objectives:
  r: Calcular porcentajes condicionales por fila o columna en una tabla de contingencia.
  data: Queremos comparar cómo se distribuye el transporte **dentro de cada grupo
    de participación**
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: "prop.table(\n  tabla,\n  ___\n)"
setup_code: "set.seed(42)\nencuesta_participacion <- data.frame(\n  id = 1:60,\n \
  \ participacion_organizacion = c(rep(\"Participa\", 40), rep(\"No participa\", 20)),\n\
  \  transporte_campus = c(\n    rep(\"Metro\", 12), rep(\"Bus\", 20), rep(\"Bicicleta\"\
  , 8),\n    rep(\"Metro\", 3), rep(\"Bus\", 10), rep(\"Bicicleta\", 7)\n  ),\n  stringsAsFactors\
  \ = FALSE\n)\nencuesta_comunidad <- data.frame(\n  id = 1:80,\n  zona_residencia\
  \ = rep(c(\"Norte\", \"Centro\", \"Sur\"), length.out = 80),\n  actividad_comunitaria\
  \ = rep(c(\"Alta\", \"Media\", \"Baja\", \"Media\"), 20),\n  stringsAsFactors =\
  \ FALSE\n)\ntabla <- table(encuesta_participacion$participacion_organizacion, encuesta_participacion$transporte_campus)"
solution_code: "prop.table(\n  tabla,\n  1\n)"
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> La pregunta dice “dentro de cada grupo de participación”.'
- title: Pista 2 · Procedimiento
  text: '> Participación está en las filas; cada fila debe sumar 100 %.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "prop.table(\n  tabla,\n  1\n)"
success_message: '> Bien. La pregunta era “dentro de cada grupo de participación”,
  por eso cada fila es su propio denominador.'
navigation:
  next: intro-r-12-003
schema_version: 1
