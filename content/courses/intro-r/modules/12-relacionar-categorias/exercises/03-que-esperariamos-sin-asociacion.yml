id: intro-r-12-003
course: intro-r
module: 12-relacionar-categorias
order: 2
title: ¿Qué esperaríamos sin asociación?
context: |-
  Dos variables son **independientes** si la distribución de una no cambia según la categoría de la otra:

  En el total de la muestra, 15 de 60 personas usan Metro (el **25%**). Si no hubiera relación, esperaríamos ese mismo 25% en ambos grupos.
instruction: Si el transporte fuera completamente independiente de la participación,
  ¿qué porcentaje de usuarios de Metro esperaríamos en cada grupo? Revisa el porcentaje
  global en el texto y guárdalo en `porcentaje_esperado_metro`.
learning_objectives:
  r: Comprender el concepto de independencia estadística y distinguir frecuencias
    observadas de esperadas.
  data: Participación organizacional y transporte
  social: 'Aplicación a investigación social en módulo 12: relacionar categorías.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: "# ¿Qué porcentaje de personas esperaríamos que usen Metro si el transporte\
  \ fuera independiente? (25, 50 o 75)\nporcentaje_esperado_metro <- \n"
setup_code: |-
  set.seed(42)
  encuesta_participacion <- data.frame(
    id = 1:60,
    participacion_organizacion = c(rep("Participa", 40), rep("No participa", 20)),
    transporte_campus = c(
      rep("Metro", 12), rep("Bus", 20), rep("Bicicleta", 8),
      rep("Metro", 3), rep("Bus", 10), rep("Bicicleta", 7)
    ),
    stringsAsFactors = FALSE
  )
  encuesta_comunidad <- data.frame(
    id = 1:80,
    zona_residencia = rep(c("Norte", "Centro", "Sur"), length.out = 80),
    actividad_comunitaria = rep(c("Alta", "Media", "Baja", "Media"), 20),
    stringsAsFactors = FALSE
  )
solution_code: porcentaje_esperado_metro <- 25
checks:
- type: object_value
  object: porcentaje_esperado_metro
  expected: 25
  message: Como el 25% del total usa Metro (15 de 60), bajo independencia esperaríamos
    ese mismo 25% en cada grupo.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Mira primero la distribución global de transporte: 25 %, 50 %, 25 %.'
- title: Pista 2 · Procedimiento
  text: '> Bajo independencia esperaríamos esa misma distribución dentro de cada grupo
    de participación.'
- title: Pista 3 · Sintaxis / Acción
  text: '> Para una celda: total de fila × total de columna / N.'
success_message: '> Bien. El esperado conserva los tamaños observados de filas y columnas
  y pregunta cómo se combinarían bajo independencia.'
navigation:
  next: intro-r-12-004
schema_version: 1
