id: intro-r-01-005
course: intro-r
module: 01-empezar-a-pensar-con-r
order: 4
title: Reutiliza lo guardado
context: Los dos conteos ya están guardados en objetos.
instruction: Crea `total_respuestas` sumando **los objetos** `respuestas_sociologia`
  y `respuestas_antropologia`. No escribas `33` directamente. Después consulta `total_respuestas`.
learning_objectives:
  r: Puede usar objetos existentes como partes de una operación nueva y guardar el
    resultado en otro objeto
  data: Queremos calcular el total de respuestas a partir de los conteos ya guardados
    para Sociología y Antropología
  social: 'Aplicación a investigación social en módulo 1: empezar a pensar con r.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intro
type: code
starter_code: 'respuestas_sociologia <- 18

  respuestas_antropologia <- 15


  # calcula total_respuestas usando los objetos anteriores'
setup_code: ''
solution_code: 'respuestas_sociologia <- 18

  respuestas_antropologia <- 15


  total_respuestas <- respuestas_sociologia + respuestas_antropologia

  total_respuestas'
checks:
- type: object_exists
  object: respuestas_sociologia
  message: Debes crear el objeto 'respuestas_sociologia' usando <-.
- type: custom_r
  code: exists('respuestas_sociologia', envir = .target_env, inherits = FALSE)
  message: El objeto 'respuestas_sociologia' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Los dos valores que necesitas ya tienen nombre. No necesitas volver a escribir
    `18` ni `15`.
- title: Pista 2 · Procedimiento
  text: Puedes usar nombres de objetos a ambos lados de `+`, igual que antes usaste
    números.
- title: Pista 3 · Sintaxis / Acción
  text: Usa `total_respuestas <- respuestas_sociologia + respuestas_antropologia`
    y después consulta `total_respuestas`.
success_message: '**Bien.** `total_respuestas` se calcula a partir de objetos que
  ya existían. Si cambia un dato fuente y vuelves a ejecutar el script, el cálculo
  puede actualizarse sin que tengas que reemplazar manualmente el total.


  Después del éxito, plantear:


  > Si `respuestas_antropologia` cambiara de 15 a 16 y ejecutaras nuevamente todo
  el código, ¿qué debería ocurrir con `total_respuestas`?


  Respuesta conceptual esperada: debería pasar de 33 a 34 al reejecutar el cálculo.'
navigation:
  next: intro-r-01-006
schema_version: 1
