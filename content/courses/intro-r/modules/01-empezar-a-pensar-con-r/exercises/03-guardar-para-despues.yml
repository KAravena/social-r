title: Guardar para después
context: 'Para conservar un valor y reutilizarlo, lo guardamos en un **objeto** con
  `<-`:


  `respuestas <- 33`


  La asignación guarda el valor sin imprimirlo. Para consultar su contenido, escribe
  el nombre del objeto: `respuestas`.'
instruction: '1. Ejecuta `respuestas <- 33` para guardar el valor.

  2. Ejecuta `respuestas` para consultar el contenido guardado.'
learning_objectives:
  r: Guardar un valor en un objeto con `<-` y consultar su contenido por su nombre.
  data: El conteo actualizado de la encuesta es `33`. Queremos conservarlo para usarlo
    después sin volver a escribir el número c
  social: 'Aplicación a investigación social en módulo 1: empezar a pensar con r.'
