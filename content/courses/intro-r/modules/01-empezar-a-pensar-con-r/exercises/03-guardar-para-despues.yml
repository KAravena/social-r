id: intro-r-01-003
course: intro-r
module: 01-empezar-a-pensar-con-r
order: 2
title: Guardar para después
context: '**Situación.** Ya sabemos que la encuesta tiene 33 respuestas. Ahora queremos
  guardar ese valor para volver a usarlo después.


  **Antes de ejecutar**, responde mentalmente:


  > ¿Crees que `respuestas <- 33` mostrará `33` inmediatamente como resultado?


  Ejecuta solo la primera línea.


  ```r

  respuestas <- 33

  ```


  Si no apareció `33`, no significa que haya fallado: R guardó el valor.


  Un **objeto** permite guardar información usando un nombre para poder consultarla
  y reutilizarla después.


  Ahora ejecuta la segunda línea:'
instruction: '```r

  respuestas

  ```'
learning_objectives:
  r: Puede guardar un valor con un nombre y consultar posteriormente el contenido
    de ese objeto
  data: El conteo actualizado de la encuesta es `33`. Queremos conservarlo para usarlo
    después sin volver a escribir el número c
  social: 'Aplicación a investigación social en módulo 1: empezar a pensar con r.'
