id: intro-r-01-006
course: intro-r
module: 01-empezar-a-pensar-con-r
order: 5
title: Número o texto
context: |-
  Los objetos guardan distintos tipos de información:

  - **Números**: van sin comillas (`20`).
  - **Texto**: va entre comillas (`"Historia"`).
instruction: Asigna `21` a `edad` y `"Sociología"` a `carrera`. Luego consulta ambos
  objetos.
learning_objectives:
  r: Distinguir números de texto respetando el uso de comillas.
  data: Guardar la edad de una persona y el nombre de su carrera
  social: 'Aplicación a investigación social en módulo 1: empezar a pensar con r.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intro
type: code
starter_code: |-
  # guarda 21 en edad


  # guarda Sociología en carrera


  # consulta ambos objetos
setup_code: ''
solution_code: |-
  edad <- 21
  carrera <- "Sociología"

  edad
  carrera
checks:
- type: object_exists
  object: edad
  message: Debes crear el objeto 'edad' usando <-.
- type: custom_r
  code: exists('edad', envir = .target_env, inherits = FALSE)
  message: El objeto 'edad' debe existir en el entorno.
- type: object_exists
  object: carrera
  message: Debes crear el objeto 'carrera' usando <-.
- type: custom_r
  code: exists('carrera', envir = .target_env, inherits = FALSE)
  message: El objeto 'carrera' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: 'Pregunta para cada valor: ¿representa una **cantidad** o una **palabra/nombre**?'
- title: Pista 2 · Procedimiento
  text: Las cantidades se escriben sin comillas; el texto se escribe entre comillas.
- title: Pista 3 · Sintaxis / Acción
  text: Escribe `edad <- 21` y `carrera <- "Sociología"`. Después consulta `edad`
    y `carrera`.
success_message: '**Bien.** Guardaste una cantidad como número y un nombre como texto.
  Las comillas le indican a R que un valor debe tratarse como texto.'
navigation:
  next: intro-r-01-007
schema_version: 1
