id: intro-r-01-008
course: intro-r
module: 01-empezar-a-pensar-con-r
order: 7
title: Encuesta piloto
context: 'Una encuesta piloto llamada **“Encuesta de vida universitaria”** recibió:


  - 14 respuestas de estudiantes de Sociología;

  - 11 respuestas de estudiantes de Antropología.'
instruction: 'Construye un pequeño script que:


  1. guarde el nombre del estudio en `estudio`;

  2. guarde cada conteo en `respuestas_sociologia` y `respuestas_antropologia`;

  3. cree `total_respuestas` usando los dos objetos anteriores;

  4. consulte `total_respuestas`.


  No necesitas ninguna herramienta nueva: todo lo necesario apareció en los ejercicios
  anteriores.'
learning_objectives:
  r: Puede construir un pequeño script desde una situación descrita en lenguaje natural,
    guardar distintos valores y derivar
  data: Una encuesta piloto llamada **“Encuesta de vida universitaria”** obtuvo 14
    respuestas de Sociología y 11 de Antropología
  social: 'Aplicación a investigación social en módulo 1: empezar a pensar con r.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intro
type: code
starter_code: '# Guarda el nombre del estudio



  # Guarda las respuestas de cada carrera



  # Calcula el total usando los objetos anteriores



  # Consulta total_respuestas'
setup_code: ''
solution_code: 'estudio <- "Encuesta de vida universitaria"

  respuestas_sociologia <- 14

  respuestas_antropologia <- 11


  total_respuestas <- respuestas_sociologia + respuestas_antropologia

  total_respuestas'
checks:
- type: object_exists
  object: estudio
  message: Debes crear el objeto 'estudio' usando <-.
- type: custom_r
  code: exists('estudio', envir = .target_env, inherits = FALSE)
  message: El objeto 'estudio' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: 'Divide el problema en partes: un nombre de estudio, dos conteos y un total.
    Decide primero cuáles son texto y cuáles son cantidades.'
- title: Pista 2 · Procedimiento
  text: Crea primero `estudio`, `respuestas_sociologia` y `respuestas_antropologia`
    con `<-`. Después usa los dos conteos para construir el total.
- title: Pista 3 · Sintaxis / Acción
  text: 'La estructura final puede seguir este patrón:'
  code: 'estudio <- "Encuesta de vida universitaria"

    respuestas_sociologia <- 14

    respuestas_antropologia <- 11

    total_respuestas <- respuestas_sociologia + respuestas_antropologia

    total_respuestas'
success_message: '**Bien.** Construiste un pequeño script con las ideas centrales
  de M1: guardaste información con nombres, distinguiste texto de cantidades, reutilizaste
  objetos para producir un nuevo resultado y consultaste ese resultado.


  Cierre conceptual:


  > Hasta ahora cada objeto ha guardado un valor. Pero una encuesta tiene muchas personas.
  ¿Tendríamos que crear un objeto distinto para cada respuesta? En el siguiente módulo
  necesitaremos una forma de guardar **varios valores relacionados juntos**.'
navigation:
  next: intro-r-02-001
schema_version: 1
