id: 03-hacer-preguntas-a-los-datos
title: 'Módulo 3: Hacer preguntas a los datos'
short_title: Módulo 3
order: 3
description: Aprende a formular comparaciones con operadores relacionales (> , ==),
  comprender las respuestas lógicas TRUE y FALSE producidas por R, y seleccionar datos
  por condiciones sustantivas.
learning_outcomes: &id001
- Formular comparaciones que producen `TRUE` y `FALSE`.
- Usar condiciones para identificar los valores que cumplen una regla.
- Seleccionar valores a partir de esas condiciones.
