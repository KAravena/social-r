id: intro-r-03-005
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 4
title: Selecciona tú
context: 'Podemos filtrar directamente escribiendo la condición dentro de los corchetes,
  sin crear un objeto intermedio:


  `horas_estudio[horas_estudio > 4]`'
instruction: Filtra las horas de estudio mayores a 4 ejecutando `horas_estudio[horas_estudio
  > 4]`.
learning_objectives:
  r: Filtrar un vector combinando corchetes y condición en un solo paso.
  data: Horas de estudio de cinco estudiantes
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: 'horas_estudio <- c(2, 5, 3, 6, 4)


  # selecciona los valores que superan 4'
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  supera_30 <- tiempos_viaje > 30

  horas_estudio <- c(3, 5, 2, 6, 4)

  carreras <- c("Sociología", "Historia", "Sociología", "Antropología")

  es_sociologia <- carreras == "Sociología"

  horas_cuidado <- c(6, 12, 8, 15, 10)'
solution_code: horas_estudio[horas_estudio > 4]
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: ¿Qué pregunta necesitas hacerle a cada valor de `horas_estudio`?
- title: Pista 2 · Procedimiento
  text: La comparación “mayor que 4” puede utilizarse dentro de los corchetes.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: horas_estudio[horas_estudio > 4]
success_message: '**Bien.** Ya no necesitaste saber dónde estaban los valores: formulaste
  una condición y seleccionaste los que la cumplían.'
navigation:
  next: intro-r-03-006
schema_version: 1
