id: intro-r-03-003
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 2
title: Guarda las respuestas
context: "**Situación.** Ya sabemos que:\n\n```r\ntiempos_viaje > 30\n```\n\nproduce\
  \ una respuesta para cada tiempo.\n\nAhora queremos **guardar esas respuestas**\
  \ para usarlas después.\n\nCompleta:\n\n```r\nsupera_30 <- \n```\n\nDespués consulta\
  \ `supera_30`.\n\nEl objeto debe contener:\n\n```text\nFALSE TRUE TRUE TRUE FALSE\n\
  ```\n\n`supera_30` contiene una respuesta `TRUE/FALSE` para cada valor de `tiempos_viaje`."
instruction: Como contiene varios valores lógicos, podemos llamarlo un **vector lógico**.
learning_objectives:
  r: Puede guardar las respuestas de una comparación y reconocer ese conjunto de `TRUE/FALSE`
    como un vector lógico
  data: Los mismos tiempos de viaje para mantener el foco en el nuevo paso conceptual
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: "tiempos_viaje <- c(25, 40, 35, 50, 30)\n\nsupera_30 <- \n\nsupera_30"
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  supera_30 <- tiempos_viaje > 30

  horas_estudio <- c(3, 5, 2, 6, 4)

  carreras <- c("Sociología", "Historia", "Sociología", "Antropología")

  es_sociologia <- carreras == "Sociología"

  horas_cuidado <- c(6, 12, 8, 15, 10)'
solution_code: 'supera_30 <- tiempos_viaje > 30

  supera_30'
checks:
- type: object_exists
  object: supera_30
  message: Debes crear el objeto 'supera_30' usando <-.
- type: custom_r
  code: exists('supera_30', envir = .target_env, inherits = FALSE)
  message: El objeto 'supera_30' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Piensa qué expresión produjo las cinco respuestas en E2.
- title: Pista 2 · Procedimiento
  text: A la derecha de `<-` debe ir la comparación completa aplicada al vector.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: supera_30 <- tiempos_viaje > 30
success_message: '**Bien.** Guardaste las respuestas de la pregunta. `supera_30` contiene
  un `TRUE/FALSE` por cada valor de `tiempos_viaje`. Ese conjunto es un vector lógico.'
navigation:
  next: intro-r-03-004
schema_version: 1
