id: intro-r-03-004
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 3
title: TRUE conserva
context: "**Situación.** Tenemos los datos:\n\n```text\ndato          25      40      35      50      30\nsupera_30     FALSE   TRUE    TRUE    TRUE    FALSE\n```\n\nCada respuesta corresponde al dato en la misma posición.\n\nAhora observa:\n\n```r\ntiempos_viaje[supera_30]\n```\n\nCuando usamos un vector de `TRUE/FALSE` dentro de los corchetes:\n\n- `TRUE` conserva el valor de esa posición;\n- `FALSE` lo deja fuera.\n\nAntes de ejecutar, predice:\n\n> ¿qué valores deberían quedar?\n\nLa idea puede verse así:\n\n```text\ndato          25      40      35      50      30\nsupera_30     FALSE   TRUE    TRUE    TRUE    FALSE\n                       ↓       ↓       ↓\nresultado             40      35      50\n```"
instruction: Ejecuta la selección lógica `tiempos_viaje[supera_30]` y comprueba cómo `TRUE` conserva los valores correspondientes y `FALSE` los descarta.
learning_objectives:
  r: Puede interpretar y ejecutar una selección `x[condicion]`, comprendiendo por qué permanecen los valores correspondientes a `TRUE`.
  data: Tiempos de viaje mayores que 30
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)


  supera_30 <- tiempos_viaje > 30


  tiempos_viaje[supera_30]'
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  supera_30 <- tiempos_viaje > 30

  horas_estudio <- c(3, 5, 2, 6, 4)

  carreras <- c("Sociología", "Historia", "Sociología", "Antropología")

  es_sociologia <- carreras == "Sociología"

  horas_cuidado <- c(6, 12, 8, 15, 10)'
solution_code: tiempos_viaje[supera_30]
checks:
- type: result_equals
  expected:
  - 40
  - 35
  - 50
  message: 'Al indexar con el vector lógico debes obtener los valores mayores que 30: c(40, 35, 50).'
- type: custom_r
  code: grepl('tiempos_viaje[[:space:]]*[[][[:space:]]*supera_30[[:space:]]*[]]', .user_code)
  message: 'Usa el vector lógico para seleccionar: tiempos_viaje[supera_30].'
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Observa qué posiciones de `supera_30` contienen `TRUE`.
- title: Pista 2 · Procedimiento
  text: El vector lógico puede colocarse dentro de los corchetes del vector de datos.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: tiempos_viaje[supera_30]
success_message: '**Bien.** `supera_30` marca con `TRUE` las posiciones que cumplen la pregunta. Al usarlo dentro de `[]`, permanecen los valores correspondientes.'
navigation:
  next: intro-r-03-005
schema_version: 1
