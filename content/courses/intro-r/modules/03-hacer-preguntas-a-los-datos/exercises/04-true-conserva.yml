id: intro-r-03-004
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 3
title: TRUE conserva
context: |-
  Cuando pasamos un vector de `TRUE` y `FALSE` dentro de los corchetes `[]`, R conserva las posiciones donde hay `TRUE` y descarta las posiciones donde hay `FALSE`:

  `tiempos_viaje[supera_30]`
instruction: Usa el vector lógico `supera_30` dentro de los corchetes para seleccionar
  los tiempos mayores a 30 en `tiempos_viaje`.
learning_objectives:
  r: Filtrar elementos de un vector utilizando un vector lógico dentro de corchetes
    `[]`.
  data: Tiempos de viaje mayores que 30
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: |-
  tiempos_viaje <- c(25, 40, 35, 50, 30)

  supera_30 <- tiempos_viaje > 30

  tiempos_viaje[supera_30]
setup_code: |-
  tiempos_viaje <- c(25, 40, 35, 50, 30)
  supera_30 <- tiempos_viaje > 30
solution_code: tiempos_viaje[supera_30]
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Observa qué posiciones de `supera_30` contienen `TRUE`.
- title: Pista 2 · Procedimiento
  text: El vector lógico puede colocarse dentro de los corchetes del vector de datos.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: tiempos_viaje[supera_30]
success_message: '**Bien.** `supera_30` marca con `TRUE` las posiciones que cumplen
  la pregunta. Al usarlo dentro de `[]`, permanecen los valores correspondientes.'
navigation:
