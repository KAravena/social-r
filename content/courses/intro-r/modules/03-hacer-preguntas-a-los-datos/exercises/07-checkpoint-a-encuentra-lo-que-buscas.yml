id: intro-r-03-007
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 6
title: 'Checkpoint A: encuentra lo que buscas'
context: '# Checkpoint A — Fundamentos


  Cinco personas informaron dedicar:


  **6, 12, 8, 15 y 10 horas semanales** a tareas de cuidado, en ese orden.


  Construye un pequeño script que:


  1. guarde los cinco valores juntos en `horas_cuidado`;

  2. guarde en `supera_10` una pregunta que identifique qué valores son mayores que
  10;

  3. use esa condición para guardar en `horas_seleccionadas` únicamente las horas
  que cumplen la pregunta.'
instruction: Intenta resolver primero sin abrir las pistas.
learning_objectives:
  r: Demuestra que puede reconstruir de forma integrada la cadena `datos → vector
    → condición → selección` en un contexto nue
  data: Horas semanales dedicadas a tareas de cuidado
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: '# guarda las horas en horas_cuidado



  # guarda una condición que identifique valores mayores que 10



  # selecciona las horas que cumplen esa condición'
setup_code: 'tiempos_viaje <- c(25, 40, 35, 50, 30)

  supera_30 <- tiempos_viaje > 30

  horas_estudio <- c(3, 5, 2, 6, 4)

  carreras <- c("Sociología", "Historia", "Sociología", "Antropología")

  es_sociologia <- carreras == "Sociología"

  horas_cuidado <- c(6, 12, 8, 15, 10)'
solution_code: 'horas_cuidado <- c(6, 12, 8, 15, 10)

  supera_10 <- horas_cuidado > 10

  horas_seleccionadas <- horas_cuidado[supera_10]'
checks:
- type: object_exists
  object: horas_cuidado
  message: Debes crear el vector 'horas_cuidado'.
- type: object_value
  object: horas_cuidado
  expected:
  - 6
  - 12
  - 8
  - 15
  - 10
  message: '''horas_cuidado'' debe ser c(6, 12, 8, 15, 10).'
- type: object_exists
  object: supera_10
  message: Falta crear 'supera_10' con la condición horas_cuidado > 10.
- type: object_value
  object: supera_10
  expected:
  - false
  - true
  - false
  - true
  - false
  message: '''supera_10'' debe ser c(FALSE, TRUE, FALSE, TRUE, FALSE).'
- type: object_exists
  object: horas_seleccionadas
  message: Falta crear 'horas_seleccionadas' con los valores que superan 10 horas.
- type: object_value
  object: horas_seleccionadas
  expected:
  - 12
  - 15
  message: '''horas_seleccionadas'' debe contener c(12, 15).'
- type: custom_r
  code: grepl('horas_cuidado[[:space:]]*[[]', .user_code)
  message: Debes seleccionar las horas usando corchetes sobre el vector 'horas_cuidado'.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: 'Divide el problema en tres etapas: guardar los datos, hacer la pregunta y
    usar las respuestas.'
- title: Pista 2 · Procedimiento
  text: La condición central pregunta si cada valor de `horas_cuidado` es mayor que
    10. Guarda esa comparación antes de seleccionar.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: 'horas_cuidado <- c(6, 12, 8, 15, 10)

    supera_10 <- horas_cuidado > 10

    horas_seleccionadas <- horas_cuidado[supera_10]'
success_message: '**Checkpoint completado.** Creaste los datos, formulaste una pregunta,
  guardaste sus respuestas y utilizaste esas respuestas para seleccionar. Ya puedes
  encontrar valores por lo que cumplen sin conocer previamente sus posiciones.'
navigation:
  next: intro-r-04-001
schema_version: 1
