id: intro-r-03-007
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 6
title: 'Checkpoint A: encuentra lo que buscas'
context: 'Se registraron las sesiones de estudio de cinco estudiantes: **6, 12, 8,
  15 y 10** sesiones.'
instruction: |-
  1. Guarda las cinco sesiones en un vector llamado `sesiones`.
  2. Crea el vector lógico `mas_de_ocho` preguntando qué sesiones superan 8.
  3. Usa `mas_de_ocho` para seleccionar las sesiones correspondientes y guárdalas en `seleccionadas`.
learning_objectives:
  r: Integrar formulación de preguntas lógicas y selección condicional con autonomía.
  data: Horas semanales dedicadas a tareas de cuidado
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: |
  # guarda las sesiones en sesiones


  # guarda una condición que identifique valores mayores que 8


  # selecciona las sesiones que cumplen esa condición
setup_code: ''
solution_code: |-
  sesiones <- c(6, 12, 8, 15, 10)
  mas_de_ocho <- sesiones > 8
  seleccionadas <- sesiones[mas_de_ocho]
checks:
- type: object_exists
  object: sesiones
  message: Debes crear el objeto 'sesiones' usando <-.
- type: object_value
  object: sesiones
  expected:
  - 6
  - 12
  - 8
  - 15
  - 10
  message: '''sesiones'' debe contener los cinco valores c(6, 12, 8, 15, 10).'
- type: object_exists
  object: mas_de_ocho
  message: Debes crear el vector lógico 'mas_de_ocho' usando sesiones > 8.
- type: object_value
  object: mas_de_ocho
  expected:
  - false
  - true
  - false
  - true
  - true
  message: '''mas_de_ocho'' debe identificar los valores mayores que 8 con TRUE y
    FALSE.'
- type: object_exists
  object: seleccionadas
  message: Debes guardar las sesiones seleccionadas en 'seleccionadas'.
- type: object_value
  object: seleccionadas
  expected:
  - 12
  - 15
  - 10
  message: '''seleccionadas'' debe contener únicamente las sesiones que superan 8
    (12, 15 y 10).'
- type: custom_r
  code: grepl('\\[', .user_code)
  message: Usa corchetes [] para seleccionar las sesiones que cumplen la condición.
diagnostics:
- when_r: '!exists(''sesiones'', envir = .target_env)'
  message: Recuerda guardar los cinco valores en 'sesiones <- c(6, 12, 8, 15, 10)'.
  type: warning
- when_r: '!exists(''mas_de_ocho'', envir = .target_env)'
  message: Crea 'mas_de_ocho' evaluando la comparación 'sesiones > 8'.
  type: warning
- when_r: '!exists(''seleccionadas'', envir = .target_env)'
  message: Falta guardar las sesiones seleccionadas en 'seleccionadas <- sesiones[mas_de_ocho]'.
  type: warning
- when_r: identical(.target_env$seleccionadas, c(12, 15, 10)) && !grepl('\\[', .user_code)
  message: Selecciona los valores indexando con corchetes [], no escribiendo los números
    directamente.
  type: warning
hints:
- title: Pista 1 · Orientación
  text: Primero reúne los cinco valores en un solo vector usando la función `c()`
    y guárdalo en `sesiones`.
- title: Pista 2 · Herramienta
  text: ¿Qué operador usaste para preguntar si un valor era mayor que otro? Compara
    `sesiones > 8` y guarda la respuesta en `mas_de_ocho`.
- title: Pista 3 · Sintaxis
  text: 'Usa el vector de respuestas lógicas dentro de los corchetes para seleccionar:
    `seleccionadas <- sesiones[mas_de_ocho]`.'
success_message: '**Checkpoint completado.** Creaste los datos, formulaste una pregunta,
  guardaste sus respuestas y utilizaste esas respuestas para seleccionar. Ya puedes
  encontrar valores por lo que cumplen sin conocer previamente sus posiciones.'
navigation:
  next: intro-r-04-001
schema_version: 1
