id: intro-r-03-006
course: intro-r
module: 03-hacer-preguntas-a-los-datos
order: 5
title: También podemos preguntar por texto
context: |-
  Para comparar texto usamos el operador de igualdad exacta `==` (doble signo igual):

  `carreras == "Sociología"`

  Vector: `carreras <- c("Sociología", "Historia", "Sociología", "Antropología")`.

  `==` evalúa igualdad; `=` se reserva para argumentos.
instruction: |-
  1. Evalúa qué elementos de `carreras` son iguales a `"Sociología"` y guarda la respuesta en `es_sociologia`.
  2. Usa `es_sociologia` dentro de corchetes para seleccionar únicamente esas carreras de `carreras`.
learning_objectives:
  r: Comparar texto con `==` y seleccionar elementos de un vector categórico.
  data: |-
    Cuatro respuestas sobre carrera.

    No introducir todavía el término formal “variable categórica”
  social: 'Aplicación a investigación social en módulo 3: hacer preguntas a los datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: beginner
type: code
starter_code: "carreras <- c(\n  \"Sociología\",\n  \"Historia\",\n  \"Sociología\"\
  ,\n  \"Antropología\"\n)\n\nes_sociologia <- \n\nes_sociologia\n\n# usa es_sociologia\
  \ para seleccionar desde carreras"
setup_code: carreras <- c("Sociología", "Historia", "Sociología", "Antropología")
solution_code: |-
  es_sociologia <- carreras == "Sociología"
  es_sociologia

  carreras[es_sociologia]
checks:
- type: object_exists
  object: es_sociologia
  message: Debes crear el objeto 'es_sociologia' usando <-.
- type: custom_r
  code: exists('es_sociologia', envir = .target_env, inherits = FALSE)
  message: El objeto 'es_sociologia' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: 'La pregunta es: “¿cada respuesta es igual a Sociología?”.'
- title: Pista 2 · Procedimiento
  text: Para preguntar si dos valores son iguales usamos `==`; el texto debe ir entre
    comillas.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    es_sociologia <- carreras == "Sociología"
    carreras[es_sociologia]
success_message: '**Bien.** La lógica es la misma que con `>`: `==` hace una pregunta
  y R produce una respuesta `TRUE/FALSE` para cada texto. Después reutilizaste esas
  respuestas para seleccionar.'
navigation:
  next: intro-r-03-007
schema_version: 1
