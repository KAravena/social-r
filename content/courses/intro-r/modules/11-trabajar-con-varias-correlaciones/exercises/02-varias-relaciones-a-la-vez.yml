id: intro-r-11-002
course: intro-r
module: 11-trabajar-con-varias-correlaciones
order: 1
title: Varias relaciones a la vez
context: |-
  Al aplicar `cor()` a una tabla con varias columnas numéricas, R calcula una **matriz de correlaciones** donde cada celda muestra la correlación entre una fila y una columna:

  `cor(tabla, method = "pearson")`
instruction: Calcula la matriz de correlaciones de la base `analisis` que preparaste
  en el ejercicio anterior.
learning_objectives:
  r: Calcular e interpretar una matriz de correlaciones bivariadas con `cor()`.
  data: Edad, horas de estudio y horas de ocio diario
  social: 'Aplicación a investigación social en módulo 11: trabajar con varias correlaciones.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # Calcula la matriz de correlaciones de analisis:
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    trabaja_01 = c(1, 1, 0, 1, 1, 0, 1, 1, 0, 1, 0, 1),
    ingreso_miles = c(420, 650, 300, 380, 720, 450, 500, 800, 520, 620, 350, 550),
    stringsAsFactors = FALSE
  )
  seguimiento <- data.frame(
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 6),
    horas_sueno = c(8.1, 7.4, NA, 7.8, 6.9, 7.2, 6.5, NA, 7.0, 7.6),
    estres = c(3, 5, 4, 6, NA, 8, 5, 7, NA, 4),
    stringsAsFactors = FALSE
  )
  analisis <- encuesta_social[, c("edad", "horas_estudio", "horas_ocio")]
solution_code: cor(analisis, method = "pearson")
checks:
- type: custom_r
  code: grepl('cor\\s*\\(', .user_code)
  message: Calcula la matriz con cor(analisis).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Piensa en una tabla donde las mismas tres variables aparecen en filas y
    columnas.'
- title: Pista 2 · Procedimiento
  text: '> La intersección entre una fila y una columna corresponde a una pareja de
    variables.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    cor(
      analisis,
      method = "pearson"
    )
success_message: '> Bien. La matriz organiza correlaciones entre variables: cada celda
  combina la variable de una fila con la de una columna.'
navigation:
  next: intro-r-11-003
schema_version: 1
