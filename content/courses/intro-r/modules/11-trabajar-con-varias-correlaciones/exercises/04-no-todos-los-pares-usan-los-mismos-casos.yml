id: intro-r-11-004
course: intro-r
module: 11-trabajar-con-varias-correlaciones
order: 3
title: No todos los pares usan los mismos casos
context: |-
  Cuando hay datos ausentes en algunas variables de la matriz:

  - `complete.obs`: elimina cualquier fila que tenga un `NA` en alguna variable.
  - `pairwise.complete.obs`: calcula cada par de correlación usando todos los casos disponibles para ese par específico.

  Base `seguimiento` con mediciones incompletas:

  | id | horas_estudio | horas_sueno | estres |
  |:---|---:|---:|---:|
  | 1 | 2 | 8.1 | 3 |
  | 2 | 4 | 7.4 | 5 |
  | 3 | 3 | NA | 4 |
  | 4 | 6 | 7.8 | 6 |
  | 5 | 5 | 6.9 | NA |
  | ... | ... | ... | ... |
instruction: Calcula la matriz de correlaciones de `seguimiento` usando el argumento
  `use = "pairwise.complete.obs"`.
learning_objectives:
  r: Comparar la eliminación por lista frente a eliminación por pares en matrices
    de correlación.
  data: Seguimiento de horas de estudio, horas de sueño y estrés. Se usa una microbase
    separada para que los `NA` no tengan el s
  social: 'Aplicación a investigación social en módulo 11: trabajar con varias correlaciones.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # Calcula la matriz usando pairwise.complete.obs para aprovechar los casos disponibles:
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    trabaja_01 = c(1, 1, 0, 1, 1, 0, 1, 1, 0, 1, 0, 1),
    ingreso_miles = c(420, 650, 300, 380, 720, 450, 500, 800, 520, 620, 350, 550),
    stringsAsFactors = FALSE
  )
  seguimiento <- data.frame(
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 6),
    horas_sueno = c(8.1, 7.4, NA, 7.8, 6.9, 7.2, 6.5, NA, 7.0, 7.6),
    estres = c(3, 5, 4, 6, NA, 8, 5, 7, NA, 4),
    stringsAsFactors = FALSE
  )
  analisis <- encuesta_social[, c("edad", "horas_estudio", "horas_ocio")]
solution_code: cor(seguimiento, use = "pairwise.complete.obs", method = "pearson")
checks:
- type: custom_r
  code: grepl('pairwise\\.complete\\.obs', .user_code)
  message: Usa el argumento use = 'pairwise.complete.obs' en cor().
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Mira qué filas tienen datos disponibles para cada pareja.'
- title: Pista 2 · Procedimiento
  text: '> `complete.obs` exige que la fila esté completa en todas las variables seleccionadas.'
- title: Pista 3 · Sintaxis / Acción
  text: '> `pairwise.complete.obs` revisa cada pareja por separado, así que el N puede
    cambiar entre celdas.'
success_message: '> Bien. Con pairwise cada relación puede estar calculada sobre un
  conjunto distinto de casos. Por eso el N forma parte del contexto necesario para
  leer la matriz.'
navigation:
  next: intro-r-11-005
schema_version: 1
