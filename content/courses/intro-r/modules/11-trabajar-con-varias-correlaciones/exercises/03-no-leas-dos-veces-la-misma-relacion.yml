id: intro-r-11-003
course: intro-r
module: 11-trabajar-con-varias-correlaciones
order: 2
title: No leas dos veces la misma relación
context: |-
  Propiedades de una matriz de correlaciones:

  - **Diagonal**: vale 1.0 porque cada variable se correlaciona consigo misma.
  - **Simetría de espejo**: la correlación entre A y B es idéntica a la de B y A.
instruction: En una matriz de 3 variables numéricas, ¿cuántos pares de correlación
  *únicos* e informativos existen (sin diagonal ni repeticiones)? Guarda ese número
  en `pares_unicos`.
learning_objectives:
  r: Interpretar la estructura de una matriz de correlaciones reconociendo simetría
    y pares únicos.
  data: La misma matriz `edad`–`horas_estudio`–`horas_ocio`
  social: 'Aplicación a investigación social en módulo 11: trabajar con varias correlaciones.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |
  # ¿Cuántos pares únicos de correlación contiene una matriz de 3 variables? (sin contar diagonal ni repeticiones)
  # pares_unicos <- 3
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    trabaja_01 = c(1, 1, 0, 1, 1, 0, 1, 1, 0, 1, 0, 1),
    ingreso_miles = c(420, 650, 300, 380, 720, 450, 500, 800, 520, 620, 350, 550),
    stringsAsFactors = FALSE
  )
  seguimiento <- data.frame(
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 6),
    horas_sueno = c(8.1, 7.4, NA, 7.8, 6.9, 7.2, 6.5, NA, 7.0, 7.6),
    estres = c(3, 5, 4, 6, NA, 8, 5, 7, NA, 4),
    stringsAsFactors = FALSE
  )
  analisis <- encuesta_social[, c("edad", "horas_estudio", "horas_ocio")]
solution_code: pares_unicos <- 3
checks:
- type: object_value
  object: pares_unicos
  expected: 3
  message: 'Una matriz de 3x3 tiene 3 pares únicos: (1,2), (1,3) y (2,3).'
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: '> Mira primero qué variable aparece en la fila y cuál en la columna.'
- title: Pista 2 · Procedimiento
  text: '> ¿Qué ocurre cuando fila y columna contienen la misma variable? ¿Y qué cambia
    entre A-B y B-A?'
- title: Pista 3 · Sintaxis / Acción
  text: '> La diagonal vale 1; fuera de ella, cuenta A-B solo una vez aunque también
    aparezca como B-A.'
success_message: '> Exacto. La diagonal compara cada variable consigo misma y la matriz
  repite cada par a ambos lados de la diagonal. Por eso solo hay tres pares únicos.'
navigation:
  next: intro-r-11-004
schema_version: 1
