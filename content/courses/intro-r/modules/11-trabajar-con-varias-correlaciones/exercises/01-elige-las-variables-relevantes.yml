id: intro-r-11-001
course: intro-r
module: 11-trabajar-con-varias-correlaciones
order: 0
title: Elige las variables relevantes
context: Para examinar relaciones entre varias variables cuantitativas preparamos
  una base que contenga únicamente las variables numéricas de interés (excluyendo
  identificadores como `id`).
instruction: Selecciona las variables `edad`, `horas_estudio` y `horas_ocio` de `encuesta_social`
  con `select()` y guárdalas en `analisis`.
learning_objectives:
  r: Seleccionar un conjunto de variables cuantitativas sustantivas para análisis
    multivariado.
  data: Queremos explorar conjuntamente cómo se relacionan la edad, las horas de estudio
    y las horas de ocio diario
  social: 'Aplicación a investigación social en módulo 11: trabajar con varias correlaciones.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: advanced
type: code
starter_code: |-
  analisis <- encuesta_social |>
    select(
      # elige las tres variables relevantes
    )
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25, 27, 26, 22, 24),
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    horas_ocio = c(6.0, 5.2, 6.1, 5.0, 5.8, 5.4, 5.6, 5.2, 5.0, 4.8, 5.5, 5.1),
    trabaja_01 = c(1, 1, 0, 1, 1, 0, 1, 1, 0, 1, 0, 1),
    ingreso_miles = c(420, 650, 300, 380, 720, 450, 500, 800, 520, 620, 350, 550),
    stringsAsFactors = FALSE
  )
  seguimiento <- data.frame(
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 6),
    horas_sueno = c(8.1, 7.4, NA, 7.8, 6.9, 7.2, 6.5, NA, 7.0, 7.6),
    estres = c(3, 5, 4, 6, NA, 8, 5, 7, NA, 4),
    stringsAsFactors = FALSE
  )
solution_code: |-
  analisis <- encuesta_social |>
    select(
      edad,
      horas_estudio,
      horas_ocio
    )
checks:
- type: object_exists
  object: analisis
  message: Debes crear el objeto 'analisis' usando <-.
- type: custom_r
  code: exists('analisis', envir = .target_env, inherits = FALSE)
  message: El objeto 'analisis' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: '> ¿Qué tres características aparecen explícitamente en la pregunta?'
- title: Pista 2 · Procedimiento
  text: '> Recupera `select()` para conservar únicamente las columnas necesarias.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    analisis <- encuesta_social |>
      select(
        edad,
        horas_estudio,
        horas_ocio
      )
success_message: '> Bien. Preparaste exactamente las tres variables relevantes y dejaste
  fuera `id`, que identifica casos pero no representa una cantidad sustantiva.'
navigation:
  next: intro-r-11-002
schema_version: 1
