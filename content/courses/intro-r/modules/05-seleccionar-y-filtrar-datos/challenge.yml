id: intro-r-05-challenge
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 99
title: 'Desafío Final: Submuestra de investigación urbana'
context: |-
  Dispones del data frame `encuesta_urbana` con `id`, `edad`, `zona`, `ingreso`, y `satisfecho`. Se requiere aislar una submuestra de residentes de la zona `"Sur"` que reporten estar satisfechos (`satisfecho == "Sí"`), conservando únicamente las columnas de interés: `edad` e `ingreso`.
instruction: |-
  1. Crea una condición lógica `filtro_sur_satisfecho` que identifique a las personas que son de la zona `"Sur"` Y que respondieron `"Sí"` en `satisfecho` (`zona == "Sur" & satisfecho == "Sí"`).
  2. Usa `encuesta_urbana` como base, filtra las filas utilizando la condición que guardaste en `filtro_sur_satisfecho` y luego conserva solo las variables `edad` e `ingreso`. Guarda el resultado en `submuestra_focal`.
  3. Calcula el ingreso promedio de esta submuestra y guárdalo en `ingreso_promedio_focal`.
learning_objectives:
  r: Integrar filtrado condicional booleano con operadores lógicos (&) y selección de columnas por nombre en un pipeline de datos.
  data: Encuesta urbana con variables geográficas, socioeconómicas y actitudinales.
  social: Delimitación de poblaciones objetivo para análisis social focalizado.
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  # 1. Crea la condición lógica combinada en 'filtro_sur_satisfecho'


  # 2. Usa encuesta_urbana, filtra con 'filtro_sur_satisfecho' y selecciona 'edad' e 'ingreso' en 'submuestra_focal'


  # 3. Calcula el ingreso promedio de la submuestra en 'ingreso_promedio_focal'

setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_urbana <- data.frame(
    id = 1:8,
    edad = c(22, 35, 41, 28, 50, 31, 26, 45),
    zona = c("Norte", "Sur", "Sur", "Centro", "Sur", "Norte", "Sur", "Centro"),
    ingreso = c(450, 680, 820, 520, 950, 480, 610, 770),
    satisfecho = c("No", "Sí", "Sí", "No", "No", "Sí", "Sí", "No"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  filtro_sur_satisfecho <- encuesta_urbana$zona == "Sur" & encuesta_urbana$satisfecho == "Sí"
  submuestra_focal <- encuesta_urbana |>
    filter(filtro_sur_satisfecho) |>
    select(edad, ingreso)
  ingreso_promedio_focal <- mean(submuestra_focal$ingreso)
diagnostics:
  - when_r: grepl("filtro_sur_satisfecho\\s*\\|>", .user_code)
    message: "Recuerda que 'filtro_sur_satisfecho' es una condición lógica (TRUE/FALSE). El pipe |> debe comenzar desde la base de datos 'encuesta_urbana'."
    type: warning
  - when_r: exists('submuestra_focal', envir = .target_env) && is.data.frame(.target_env$submuestra_focal) && nrow(.target_env$submuestra_focal) == 8
    message: "Recuerda filtrar las filas usando 'filtro_sur_satisfecho' antes de seleccionar las columnas."
    type: warning
checks:
  - type: object_exists
    object: filtro_sur_satisfecho
    message: "Debes crear la condición lógica 'filtro_sur_satisfecho'."
  - type: custom_r
    code: exists('filtro_sur_satisfecho', envir = .target_env) && is.logical(.target_env$filtro_sur_satisfecho) && isTRUE(all.equal(.target_env$filtro_sur_satisfecho, c(FALSE, TRUE, TRUE, FALSE, FALSE, FALSE, TRUE, FALSE)))
    message: "'filtro_sur_satisfecho' debe identificar casos donde zona == \"Sur\" y satisfecho == \"Sí\"."
  - type: object_exists
    object: submuestra_focal
    message: "Debes crear el data frame 'submuestra_focal'."
  - type: custom_r
    code: exists('submuestra_focal', envir = .target_env) && is.data.frame(.target_env$submuestra_focal) && nrow(.target_env$submuestra_focal) == 3 && identical(names(.target_env$submuestra_focal), c("edad", "ingreso")) && isTRUE(all.equal(as.numeric(.target_env$submuestra_focal$edad), c(35, 41, 26))) && isTRUE(all.equal(as.numeric(.target_env$submuestra_focal$ingreso), c(680, 820, 610)))
    message: "'submuestra_focal' debe ser un data frame con 3 filas filtradas y solo las columnas 'edad' e 'ingreso'."
  - type: object_exists
    object: ingreso_promedio_focal
    message: "Debes calcular el ingreso promedio en 'ingreso_promedio_focal'."
  - type: custom_r
    code: exists('ingreso_promedio_focal', envir = .target_env) && is.numeric(.target_env$ingreso_promedio_focal) && isTRUE(all.equal(as.numeric(.target_env$ingreso_promedio_focal), 703.3333333333334, tolerance = 0.01))
    message: "'ingreso_promedio_focal' debe valer aproximadamente 703.33."
hints:
  - text: 'Primero construye una condición que sea TRUE solo cuando se cumplan ambas condiciones. Usa & para unirlas: `encuesta_urbana$zona == "Sur" & encuesta_urbana$satisfecho == "Sí"`.'
  - text: 'Para crear la submuestra, comienza el pipe desde `encuesta_urbana`. Recuerda que `filter()` necesita recibir una base de datos, no solamente el vector TRUE/FALSE.'
  - text: 'Después de filtrar con `filter(filtro_sur_satisfecho)`, encadena con `|>` hacia `select(edad, ingreso)` y guarda el resultado en `submuestra_focal`.'
