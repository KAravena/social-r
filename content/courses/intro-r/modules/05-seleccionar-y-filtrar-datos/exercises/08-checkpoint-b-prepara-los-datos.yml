id: intro-r-05-008
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 7
title: 'Checkpoint B: prepara los datos'
context: |-
  **Checkpoint B — Bases y preparación**

  Para una investigación social necesitamos trabajar solo con las personas que estudian en `encuesta_jovenes`. De ellas necesitamos únicamente su edad y comuna.
instruction: Construye un flujo con `|>` que conserve a quienes estudian (`estudia
  == "Sí"`), seleccione las variables `edad` y `comuna`, y guarde el resultado en
  `datos_preparados`.
learning_objectives:
  r: Preparar un subconjunto de datos combinando `filter()` y `select()` de forma
    autónoma.
  data: Nueva encuesta juvenil para una pregunta posterior
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # prepara los datos y guárdalos en datos_preparados
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_preparados <- encuesta_jovenes |>
    filter(estudia == "Sí") |>
    select(edad, comuna)
checks:
- type: object_exists
  object: datos_preparados
  message: Debes crear el objeto 'datos_preparados' usando <-.
- type: custom_r
  code: is.data.frame(.target_env$datos_preparados) && nrow(.target_env$datos_preparados)
    == 4 && all(c('edad', 'comuna') %in% names(.target_env$datos_preparados))
  message: '''datos_preparados'' debe ser un data frame con 4 filas (estudiantes)
    y las columnas ''edad'' y ''comuna''.'
- type: custom_r
  code: grepl('filter\s*\(', .user_code) && grepl('select\s*\(', .user_code)
  message: Construye el flujo combinando filter() para los casos y select() para las
    variables con el pipe |>.
diagnostics:
- when_r: '!exists(''datos_preparados'', envir = .target_env)'
  message: Falta crear el objeto 'datos_preparados'.
  type: warning
- when_r: exists('datos_preparados', envir = .target_env) && nrow(.target_env$datos_preparados)
    == 8
  message: Recuerda filtrar a las personas que estudian (estudia == 'Sí') antes de
    seleccionar.
  type: warning
hints:
- title: Pista 1 · Orientación
  text: Primero decide qué casos necesitas conservar (quienes estudian) y qué variables
    necesitas (edad y comuna).
- title: Pista 2 · Herramienta
  text: Usa `filter(estudia == "Sí")` para los casos y luego encadena con `|>` hacia
    `select(edad, comuna)`.
- title: Pista 3 · Sintaxis
  text: Guarda el flujo completo en `datos_preparados <- encuesta_jovenes |> filter(...)
    |> select(...)`.
success_message: '**Checkpoint B completado.** Decidiste qué casos necesitabas, qué
  variables necesitabas, encadenaste ambas operaciones y guardaste un nuevo objeto
  sin depender de posiciones manuales.'
navigation:
  next: intro-r-06-001
schema_version: 1
