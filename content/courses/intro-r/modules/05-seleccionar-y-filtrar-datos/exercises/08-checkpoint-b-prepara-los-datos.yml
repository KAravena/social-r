id: intro-r-05-008
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 7
title: 'Checkpoint B: prepara los datos'
context: '**Checkpoint B — Bases y preparación**


  Para un estudio sobre juventud requerimos analizar hogares de mayores ingresos.
  Prepara la base `encuesta_jovenes` aplicando filtro y selección.'
instruction: Filtra los casos con `ingreso_hogar > 450000`, selecciona las variables
  `edad` y `comuna`, y guarda el resultado en `datos_preparados`.
learning_objectives:
  r: Preparar un subconjunto de datos combinando `filter()` y `select()` de forma
    autónoma.
  data: Nueva encuesta juvenil para una pregunta posterior
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: '# guarda aquí los datos preparados'
setup_code: "suppressPackageStartupMessages(library(dplyr))\nencuesta_social_demo\
  \ <- data.frame(\n  id = 1:8,\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25),\n  carrera\
  \ = c(\"Sociología\", \"Historia\", \"Antropología\", \"Sociología\", \"Trabajo\
  \ Social\", \"Antropología\", \"Historia\", \"Sociología\"),\n  horas_estudio =\
  \ c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\", \"No\", \"No\", \"Sí\"\
  , \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n)\nencuesta_jovenes <- data.frame(\n\
  \  id = 1:8,\n  edad = c(18, 20, 19, 22, 21, 23, 19, 24),\n  estudia = c(\"Sí\"\
  , \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  comuna = c(\"Norte\"\
  , \"Centro\", \"Sur\", \"Centro\", \"Norte\", \"Sur\", \"Norte\", \"Centro\"),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bicicleta\", \"Bus\", \"Metro\", \"Metro\"\
  , \"Bus\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: "datos_preparados <- encuesta_jovenes |>\n  filter(estudia == \"Sí\"\
  ) |>\n  select(edad, comuna)"
checks:
- type: object_exists
  object: datos_preparados
  message: Debes crear el objeto 'datos_preparados' usando <-.
- type: custom_r
  code: exists('datos_preparados', envir = .target_env, inherits = FALSE)
  message: El objeto 'datos_preparados' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero decide qué casos deben quedar y después qué variables necesitas.
- title: Pista 2 · Procedimiento
  text: Una operación conserva casos y otra conserva variables. Puedes pasar el resultado
    de la primera a la segunda con `|>`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "datos_preparados <- encuesta_jovenes |>\n  filter(estudia == \"Sí\") |>\n\
    \  select(edad, comuna)"
success_message: '**Checkpoint B completado.** Decidiste qué casos necesitabas, qué
  variables necesitabas, encadenaste ambas operaciones y guardaste un nuevo objeto
  sin depender de posiciones manuales.'
navigation:
  next: intro-r-06-001
schema_version: 1
