id: intro-r-05-001
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 0
title: Vuelve a hacer una pregunta
context: En el Módulo 3 hicimos preguntas a vectores. En el Módulo 4 aprendimos que
  una columna de una base se extrae como un vector con `$`. Ahora juntamos ambas ideas
  para formular preguntas sobre una base.
instruction: Pregunta qué edades en `encuesta_social_demo` son mayores que 21 combinando
  el operador `$` y `> 21`.
learning_objectives:
  r: Formular una condición lógica sobre una columna de un data frame con `$`.
  data: Encuesta social de ocho estudiantes
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: '# pregunta qué edades son mayores que 21'
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: encuesta_social_demo$edad > 21
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero piensa qué variable contiene la información que quieres preguntar.
- title: Pista 2 · Procedimiento
  text: En M4 recuperabas una variable con `$`; después puedes hacerle la pregunta
    con `>`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: encuesta_social_demo$edad > 21
success_message: '**Bien.** Recuperaste `edad` como vector y le hiciste una pregunta.
  Ahora hay una respuesta `TRUE/FALSE` para cada caso de la base.'
navigation:
  next: intro-r-05-002
schema_version: 1
