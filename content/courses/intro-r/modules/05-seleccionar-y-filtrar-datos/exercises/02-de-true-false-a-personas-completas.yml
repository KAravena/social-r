id: intro-r-05-002
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 1
title: De TRUE/FALSE a personas completas
context: 'En una base de datos, una respuesta `TRUE` puede conservar la fila completa
  con todas sus variables:


  `mayores_21 <- encuesta_social_demo$edad > 21`

  `encuesta_social_demo[mayores_21, ]`'
instruction: Ejecuta el código en el editor para comprobar cómo la condición `> 21`
  y cada `TRUE` conservan a la persona completa con todas sus columnas.
learning_objectives:
  r: Comprender cómo una condición lógica conserva casos completos en una base.
  data: 'La misma pregunta de E1: edades mayores que 21'
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: 'mayores_21 <- encuesta_social_demo$edad > 21

  encuesta_social_demo[mayores_21, ]'
setup_code: "suppressPackageStartupMessages(library(dplyr))\nencuesta_social_demo\
  \ <- data.frame(\n  id = 1:8,\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25),\n  carrera\
  \ = c(\"Sociología\", \"Historia\", \"Antropología\", \"Sociología\", \"Trabajo\
  \ Social\", \"Antropología\", \"Historia\", \"Sociología\"),\n  horas_estudio =\
  \ c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\", \"No\", \"No\", \"Sí\"\
  , \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n)\nencuesta_jovenes <- data.frame(\n\
  \  id = 1:8,\n  edad = c(18, 20, 19, 22, 21, 23, 19, 24),\n  estudia = c(\"Sí\"\
  , \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  comuna = c(\"Norte\"\
  , \"Centro\", \"Sur\", \"Centro\", \"Norte\", \"Sur\", \"Norte\", \"Centro\"),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bicicleta\", \"Bus\", \"Metro\", \"Metro\"\
  , \"Bus\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: 'mayores_21 <- encuesta_social_demo$edad > 21

  encuesta_social_demo[mayores_21, ]'
checks:
- type: object_exists
  object: mayores_21
  message: Debes crear el objeto 'mayores_21' usando <-.
- type: custom_r
  code: exists('mayores_21', envir = .target_env, inherits = FALSE)
  message: El objeto 'mayores_21' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Mira las posiciones donde `mayores_21` contiene `TRUE`.
- title: Pista 2 · Procedimiento
  text: Cada posición del vector lógico corresponde a la fila del mismo caso.
- title: Pista 3 · Sintaxis / Acción
  text: Los casos 2, 5, 6 y 8 tienen `TRUE`; por eso permanecen sus filas completas.
success_message: '**Bien.** La condición sigue produciendo una respuesta por caso,
  pero ahora cada `TRUE` conserva la fila completa de esa persona.'
navigation:
  next: intro-r-05-003
schema_version: 1
