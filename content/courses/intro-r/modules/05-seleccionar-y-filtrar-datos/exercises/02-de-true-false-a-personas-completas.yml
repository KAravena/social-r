id: intro-r-05-002
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 1
title: De TRUE/FALSE a personas completas
context: |-
  Al evaluar una condición en una tabla, cada respuesta `TRUE` puede conservar la fila completa con todas sus variables:

  `mayores_21 <- encuesta_social_demo$edad > 21`
  `encuesta_social_demo[mayores_21, ]`

  La coma `,` después de la condición indica a R que conserve todas las columnas de esas personas.

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---|
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: |-
  1. Guarda en `mayores_21` la condición que identifica a quienes tienen más de 21 años.
  2. Indexa las filas de la tabla con `encuesta_social_demo[mayores_21, ]` para observar las personas completas conservadas.
learning_objectives:
  r: Comprender cómo una condición lógica conserva casos completos en una base.
  data: 'La misma pregunta de E1: edades mayores que 21'
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  mayores_21 <- encuesta_social_demo$edad > 21
  encuesta_social_demo[mayores_21, ]
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  mayores_21 <- encuesta_social_demo$edad > 21
  encuesta_social_demo[mayores_21, ]
checks:
- type: object_exists
  object: mayores_21
  message: Debes crear el objeto 'mayores_21' usando <-.
- type: custom_r
  code: exists('mayores_21', envir = .target_env, inherits = FALSE)
  message: El objeto 'mayores_21' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Mira las posiciones donde `mayores_21` contiene `TRUE`.
- title: Pista 2 · Procedimiento
  text: Cada posición del vector lógico corresponde a la fila del mismo caso.
- title: Pista 3 · Sintaxis / Acción
  text: Los casos 2, 5, 6 y 8 tienen `TRUE`; por eso permanecen sus filas completas.
success_message: '**Bien.** La condición sigue produciendo una respuesta por caso,
  pero ahora cada `TRUE` conserva la fila completa de esa persona.'
navigation:
  next: intro-r-05-003
schema_version: 1
