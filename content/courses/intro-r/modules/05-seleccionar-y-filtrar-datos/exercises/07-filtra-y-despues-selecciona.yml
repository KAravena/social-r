id: intro-r-05-007
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 6
title: Filtra y después selecciona
context: 'Ahora combinaremos dos decisiones distintas.


  Necesitamos:


  1. quedarnos solo con las personas que trabajan;

  2. conservar únicamente `edad` y `carrera`.


  Piensa en dos preguntas:


  > ¿qué **casos** necesito?


  y después:


  > ¿qué **variables** necesito?


  En esta tarea primero filtramos casos y después seleccionamos variables.


  Eso no significa que siempre exista una única regla universal de orden. Aquí este
  orden responde a la pregunta.'
instruction: Completa el pipeline.
learning_objectives:
  r: Puede seguir y completar un pipeline de dos operaciones donde cada etapa recibe
    el resultado de la anterior
  data: Preparar una base de personas que trabajan conservando solo edad y carrera
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: "encuesta_social_demo |>\n  filter(__________________) |>\n  select(________,\
  \ ________)"
setup_code: "suppressPackageStartupMessages(library(dplyr))\nencuesta_social_demo\
  \ <- data.frame(\n  id = 1:8,\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25),\n  carrera\
  \ = c(\"Sociología\", \"Historia\", \"Antropología\", \"Sociología\", \"Trabajo\
  \ Social\", \"Antropología\", \"Historia\", \"Sociología\"),\n  horas_estudio =\
  \ c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\", \"No\", \"No\", \"Sí\"\
  , \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n)\nencuesta_jovenes <- data.frame(\n\
  \  id = 1:8,\n  edad = c(18, 20, 19, 22, 21, 23, 19, 24),\n  estudia = c(\"Sí\"\
  , \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  comuna = c(\"Norte\"\
  , \"Centro\", \"Sur\", \"Centro\", \"Norte\", \"Sur\", \"Norte\", \"Centro\"),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bicicleta\", \"Bus\", \"Metro\", \"Metro\"\
  , \"Bus\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: "encuesta_social_demo |>\n  filter(trabaja == \"Sí\") |>\n  select(edad,\
  \ carrera)"
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero decide qué casos necesitas; después qué variables.
- title: Pista 2 · Procedimiento
  text: El resultado de `filter()` puede pasar a `select()` mediante `|>`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "encuesta_social_demo |>\n  filter(trabaja == \"Sí\") |>\n  select(edad, carrera)"
success_message: '**Bien.** Primero decidiste qué casos necesitabas y después qué
  variables. Cada etapa recibió el resultado de la anterior.'
navigation:
