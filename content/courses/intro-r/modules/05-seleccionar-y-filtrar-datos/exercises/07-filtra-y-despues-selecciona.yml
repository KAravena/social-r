id: intro-r-05-007
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 6
title: Filtra y después selecciona
context: |-
  El pipe permite encadenar múltiples decisiones en un flujo de lectura continuo:

  ```r
  base |>
    filter(condicion) |>
    select(var1, var2)
  ```

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---|
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: Construye un pipeline con `|>` que primero filtre a las personas que
  trabajan (`trabaja == "Sí"`) y luego seleccione las variables `edad` y `carrera`.
learning_objectives:
  r: Combinar `filter()` y `select()` en un pipeline encadenado con `|>`.
  data: Preparar una base de personas que trabajan conservando solo edad y carrera
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Pipeline: filtra a quienes trabajan y selecciona edad y carrera:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  encuesta_social_demo |>
    filter(trabaja == "Sí") |>
    select(edad, carrera)
checks:
- type: custom_r
  code: grepl('filter\\s*\\(', .user_code) && grepl('select\\s*\\(', .user_code)
  message: Encadena filter() y select() usando el pipe |>.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Primero decide qué casos necesitas; después qué variables.
- title: Pista 2 · Procedimiento
  text: El resultado de `filter()` puede pasar a `select()` mediante `|>`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    encuesta_social_demo |>
      filter(trabaja == "Sí") |>
      select(edad, carrera)
success_message: '**Bien.** Primero decidiste qué casos necesitabas y después qué
  variables. Cada etapa recibió el resultado de la anterior.'
navigation:
  next: intro-r-05-008
schema_version: 1
