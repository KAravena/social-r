id: intro-r-05-004
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 3
title: Filtra otro grupo
context: 'Ahora cambia la pregunta.


  Queremos conservar solo las personas cuya carrera es:


  ```text

  Sociología

  ```


  Hazlo en dos pasos.


  **Paso 1.** Construye la condición que identifica qué casos tienen carrera `"Sociología"`.


  **Paso 2.** Usa esa misma idea para conservar las filas completas de esos casos
  con `filter()`.


  Recuerda:'
instruction: '> fuera de `filter()` recuperamos una variable desde la base con `$`;

  >

  > dentro de `filter()` ya indicamos la base y podemos nombrar directamente la variable.'
learning_objectives:
  r: Puede traducir una pregunta textual a una condición de igualdad y utilizarla
    para filtrar casos
  data: Identificar y conservar estudiantes de Sociología
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: '# 1. pregunta qué casos tienen carrera "Sociología"



  # 2. conserva solo esos casos'
setup_code: "suppressPackageStartupMessages(library(dplyr))\nencuesta_social_demo\
  \ <- data.frame(\n  id = 1:8,\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25),\n  carrera\
  \ = c(\"Sociología\", \"Historia\", \"Antropología\", \"Sociología\", \"Trabajo\
  \ Social\", \"Antropología\", \"Historia\", \"Sociología\"),\n  horas_estudio =\
  \ c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\", \"No\", \"No\", \"Sí\"\
  , \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n)\nencuesta_jovenes <- data.frame(\n\
  \  id = 1:8,\n  edad = c(18, 20, 19, 22, 21, 23, 19, 24),\n  estudia = c(\"Sí\"\
  , \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  comuna = c(\"Norte\"\
  , \"Centro\", \"Sur\", \"Centro\", \"Norte\", \"Sur\", \"Norte\", \"Centro\"),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bicicleta\", \"Bus\", \"Metro\", \"Metro\"\
  , \"Bus\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: 'encuesta_social_demo$carrera == "Sociología"


  filter(encuesta_social_demo, carrera == "Sociología")'
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: ¿Qué variable contiene la carrera de cada caso?
- title: Pista 2 · Procedimiento
  text: La condición debe preguntar si `carrera` es igual a `"Sociología"`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: 'encuesta_social_demo$carrera == "Sociología"


    filter(encuesta_social_demo, carrera == "Sociología")'
success_message: '**Bien.** Primero construiste la pregunta lógica y después usaste
  esa misma condición para conservar casos completos.'
