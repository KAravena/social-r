id: intro-r-05-004
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 3
title: Filtra otro grupo
context: |-
  Para filtrar por una categoría de texto usamos `==` con el texto exacto entre comillas:

  `filter(base, variable == "Categoría")`
instruction: Filtra `encuesta_social_demo` para conservar únicamente a los estudiantes
  de Sociología (`carrera == "Sociología"`).
learning_objectives:
  r: Filtrar casos evaluando una condición de igualdad de texto con `==`.
  data: Identificar y conservar estudiantes de Sociología
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # 1. pregunta qué casos tienen carrera "Sociología"


  # 2. conserva solo esos casos
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  encuesta_social_demo$carrera == "Sociología"

  filter(encuesta_social_demo, carrera == "Sociología")
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: ¿Qué variable contiene la carrera de cada caso?
- title: Pista 2 · Procedimiento
  text: La condición debe preguntar si `carrera` es igual a `"Sociología"`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    encuesta_social_demo$carrera == "Sociología"

    filter(encuesta_social_demo, carrera == "Sociología")
success_message: '**Bien.** Primero construiste la pregunta lógica y después usaste
  esa misma condición para conservar casos completos.'
navigation:
  next: intro-r-05-005
schema_version: 1
