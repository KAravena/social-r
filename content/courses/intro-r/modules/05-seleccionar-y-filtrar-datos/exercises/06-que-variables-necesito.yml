id: intro-r-05-006
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 5
title: Qué variables necesito
context: |-
  Mientras `filter()` elige **casos (filas)**, `select()` elige **variables (columnas)** por su nombre:

  - `filter(edad > 20)` → conserva filas
  - `select(edad, carrera)` → conserva columnas

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---|
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: Usa `select()` sobre `encuesta_social_demo` para conservar únicamente
  las variables `edad` y `carrera`.
learning_objectives:
  r: Seleccionar variables de un data frame por su nombre usando `select()`.
  data: Preparar una vista con solo `edad` y `carrera`
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Selecciona únicamente las variables edad y carrera:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: select(encuesta_social_demo, edad, carrera)
checks:
- type: custom_r
  code: grepl('select\\s*\\(', .user_code) && grepl('edad', .user_code) && grepl('carrera',
    .user_code)
  message: Selecciona las variables edad y carrera usando select(encuesta_social_demo,
    edad, carrera).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: La tarea no pide quitar personas; pide conservar ciertas variables.
- title: Pista 2 · Procedimiento
  text: '`select()` recibe primero la base y después los nombres de las variables.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: select(encuesta_social_demo, edad, carrera)
success_message: '**Bien.** Conservaste todos los casos y cambiaste únicamente qué
  variables aparecen. Eso es lo que distingue `select()` de `filter()`.'
navigation:
  next: intro-r-05-007
schema_version: 1
