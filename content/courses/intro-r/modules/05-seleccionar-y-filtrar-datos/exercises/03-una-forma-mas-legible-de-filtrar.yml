id: intro-r-05-003
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 2
title: Una forma más legible de filtrar
context: |-
  La función `filter()` del paquete `dplyr` simplifica el filtrado de casos:

  `filter(base, condicion)`

  Dentro de `filter()` escribimos directamente el nombre de la variable sin repetir `base$`.

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---|
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: Usa `filter()` sobre `encuesta_social_demo` para conservar únicamente
  a las personas que dedican más de 3 horas de estudio.
learning_objectives:
  r: Filtrar casos de un data frame usando `filter()` y condiciones directas.
  data: Misma encuesta y misma pregunta que E1–E2
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Filtra las personas que estudian más de 3 horas:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: filter(encuesta_social_demo, horas_estudio > 3)
checks:
- type: custom_r
  code: grepl('filter\\s*\\(', .user_code) && grepl('horas_estudio\\s*>\\s*3', .user_code)
  message: Filtra las horas de estudio mayores a 3 con filter(encuesta_social_demo,
    horas_estudio > 3).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: La operación busca conservar casos que cumplen una condición.
- title: Pista 2 · Procedimiento
  text: La forma general es `filter(base, condicion)`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: filter(encuesta_social_demo, edad > 21)
success_message: '**Bien.** `filter()` conservó los mismos casos que el mecanismo
  de E2. La función no cambia la idea: expresa de forma más legible qué filas deben
  permanecer.'
navigation:
  next: intro-r-05-004
schema_version: 1
