id: intro-r-05-005
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 4
title: Los datos pasan a la siguiente acción
context: |-
  El operador pipe `|>` pasa los datos de una etapa a la siguiente:

  `base |> filter(condicion)`

  Permite leer las transformaciones de izquierda a derecha sin modificar la base original guardada en memoria.

  | id | edad | carrera | horas_estudio | trabaja |
  |:---|---:|:---|---:|:---|
  | 1 | 20 | Sociología | 3 | No |
  | 2 | 22 | Historia | 5 | Sí |
  | 3 | 19 | Antropología | 2 | No |
  | 4 | 21 | Sociología | 4 | No |
  | 5 | 24 | Trabajo Social | 6 | Sí |
  | 6 | 23 | Antropología | 3 | Sí |
  | 7 | 20 | Historia | 5 | No |
  | 8 | 25 | Sociología | 2 | Sí |
instruction: Encadena `encuesta_social_demo` con el pipe `|>` hacia `filter()` para
  conservar a quienes trabajan (`trabaja == "Sí"`).
learning_objectives:
  r: Encadenar una transformación con el pipe `|>` preservando la base original.
  data: Mismo grupo de Sociología de E4
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Pasa la base con el pipe |> hacia filter() para conservar a quienes trabajan:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_jovenes <- data.frame(
    id = 1:8,
    edad = c(18, 20, 19, 22, 21, 23, 19, 24),
    estudia = c("Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    comuna = c("Norte", "Centro", "Sur", "Centro", "Norte", "Sur", "Norte", "Centro"),
    transporte = c("Bus", "Metro", "Bicicleta", "Bus", "Metro", "Metro", "Bus", "Bicicleta"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  encuesta_social_demo |>
    filter(trabaja == "Sí")
checks:
- type: custom_r
  code: grepl('\\|>|%>%', .user_code) && grepl('filter\\s*\\(', .user_code)
  message: Usa el pipe |> para pasar la base hacia filter(trabaja == 'Sí').
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Parte desde la base que quieres enviar a una acción.
- title: Pista 2 · Procedimiento
  text: '`|>` puede leerse como “pasa este resultado a la siguiente acción”.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    encuesta_social_demo |>
      filter(carrera == "Sociología")
success_message: '**Bien.** Los datos pasaron a `filter()` mediante `|>` y obtuviste
  el mismo subconjunto. La base original sigue disponible sin cambios.'
navigation:
  next: intro-r-05-006
schema_version: 1
