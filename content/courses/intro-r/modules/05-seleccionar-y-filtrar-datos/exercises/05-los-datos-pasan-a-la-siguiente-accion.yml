id: intro-r-05-005
course: intro-r
module: 05-seleccionar-y-filtrar-datos
order: 4
title: Los datos pasan a la siguiente acción
context: "En E4 escribiste una función donde la base aparecía dentro de los paréntesis:\n\
  \n```r\nfilter(encuesta_social_demo, carrera == \"Sociología\")\n```\n\nR también\
  \ permite escribir el flujo desde los datos hacia la acción:\n\n```r\nencuesta_social_demo\
  \ |>\n  filter(carrera == \"Sociología\")\n```\n\nPuedes leer `|>` como:\n\n> toma\
  \ estos datos y pásalos a la siguiente acción.\n\nVisualmente:\n\n```text\nencuesta_social_demo\n\
  ↓\nfilter(carrera == \"Sociología\")\n↓\ncasos de Sociología\n```\n\nAntes de ejecutar:\n\
  \n> ¿esperas que cambien los casos respecto de E4?\n\nNo deberían cambiar. La operación\
  \ es la misma; cambia la forma de escribir el flujo.\n\nDespués de ejecutar el pipeline,\
  \ consulta otra vez:\n\n```r\nencuesta_social_demo\n```"
instruction: y observa que la base original sigue completa.
learning_objectives:
  r: Puede leer y ejecutar un pipeline de una operación, comprendiendo que los datos
    pasan a la acción siguiente y que la bas
  data: Mismo grupo de Sociología de E4
  social: 'Aplicación a investigación social en módulo 5: seleccionar y filtrar datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: "encuesta_social_demo |>\n  filter(carrera == \"Sociología\")"
setup_code: "suppressPackageStartupMessages(library(dplyr))\nencuesta_social_demo\
  \ <- data.frame(\n  id = 1:8,\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25),\n  carrera\
  \ = c(\"Sociología\", \"Historia\", \"Antropología\", \"Sociología\", \"Trabajo\
  \ Social\", \"Antropología\", \"Historia\", \"Sociología\"),\n  horas_estudio =\
  \ c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\", \"No\", \"No\", \"Sí\"\
  , \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n)\nencuesta_jovenes <- data.frame(\n\
  \  id = 1:8,\n  edad = c(18, 20, 19, 22, 21, 23, 19, 24),\n  estudia = c(\"Sí\"\
  , \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  comuna = c(\"Norte\"\
  , \"Centro\", \"Sur\", \"Centro\", \"Norte\", \"Sur\", \"Norte\", \"Centro\"),\n\
  \  transporte = c(\"Bus\", \"Metro\", \"Bicicleta\", \"Bus\", \"Metro\", \"Metro\"\
  , \"Bus\", \"Bicicleta\"),\n  stringsAsFactors = FALSE\n)"
solution_code: "encuesta_social_demo |>\n  filter(carrera == \"Sociología\")"
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Parte desde la base que quieres enviar a una acción.
- title: Pista 2 · Procedimiento
  text: '`|>` puede leerse como “pasa este resultado a la siguiente acción”.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "encuesta_social_demo |>\n  filter(carrera == \"Sociología\")"
success_message: '**Bien.** Los datos pasaron a `filter()` mediante `|>` y obtuviste
  el mismo subconjunto. La base original sigue disponible sin cambios.'
