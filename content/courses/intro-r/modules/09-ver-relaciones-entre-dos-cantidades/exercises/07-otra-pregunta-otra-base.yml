id: intro-r-09-007
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 6
title: Otra pregunta, otra base
context: |-
  En `encuesta_lectura` registramos los minutos dedicados a leer y el puntaje de comprensión de 10 participantes:

  | id | minutos_lectura | puntaje_comprension |
  |:---|---:|---:|
  | 1 | 15 | 50 |
  | 2 | 35 | 57 |
  | 3 | 25 | 66 |
  | 4 | 55 | 84 |
  | 5 | 20 | 59 |
  | 6 | 50 | 69 |
  | 7 | 30 | 68 |
  | 8 | 60 | 83 |
  | 9 | 40 | 55 |
  | 10 | 45 | 62 |
instruction: |-
  1. Genera el gráfico de dispersión con `plot()` entre minutos de lectura y puntaje de comprensión.
  2. Calcula el coeficiente de correlación lineal con `cor()`.
learning_objectives:
  r: Analizar autónomamente una relación bivariada combinando gráfico de dispersión
    y correlación de Pearson.
  data: Tiempo de lectura y puntaje de comprensión en una nueva encuesta de diez casos
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  # representa la relación entre las dos cantidades


  # resume numéricamente la asociación lineal
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),
    horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),
    trabaja = c("Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_lectura <- data.frame(
    id = 1:10,
    minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),
    puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),
    stringsAsFactors = FALSE
  )
solution_code: |-
  plot(
    encuesta_lectura$minutos_lectura,
    encuesta_lectura$puntaje_comprension
  )

  cor(
    encuesta_lectura$minutos_lectura,
    encuesta_lectura$puntaje_comprension
  )
checks:
- type: custom_r
  code: grepl('(plot|hist|barplot)\\s*\\(', .user_code)
  message: Asegúrate de generar el gráfico solicitado utilizando la función correspondiente
    (plot, hist o barplot).
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero convierte cada par en un punto. Después resume numéricamente el patrón
    lineal.
- title: Pista 2 · Procedimiento
  text: 'Recupera las dos herramientas centrales del módulo: una gráfica y una numérica.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    plot(
      encuesta_lectura$minutos_lectura,
      encuesta_lectura$puntaje_comprension
    )

    cor(
      encuesta_lectura$minutos_lectura,
      encuesta_lectura$puntaje_comprension
    )
success_message: '> Bien. Representaste los mismos pares visualmente y numéricamente,
  interpretaste la asociación lineal y mantuviste separados asociación y causalidad.'
navigation:
  next: intro-r-10-001
schema_version: 1
