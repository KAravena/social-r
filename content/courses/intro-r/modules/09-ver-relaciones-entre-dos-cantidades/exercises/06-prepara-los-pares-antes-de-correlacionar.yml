id: intro-r-09-006
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 5
title: Prepara los pares antes de correlacionar
context: |-
  Para calcular una correlación con datos ausentes debemos conservar únicamente los casos con información en ambas variables:

  `cor(x, y, use = "complete.obs")`
instruction: Calcula la correlación de Pearson entre `horas_trabajo` y `horas_sueno`
  en `encuesta_social` indicando el argumento de pares completos `use = "complete.obs"`.
learning_objectives:
  r: Manejar datos ausentes bivariados en `cor()` mediante `use = "complete.obs"`.
  data: Entre las personas que trabajan, estudiar cómo se relacionan horas de trabajo
    semanal y horas de sueño
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  datos_trabajan <- encuesta_social |>
    filter(trabaja == "Sí") |>
    select(id, horas_trabajo, horas_sueno)

  # revisa cuántos valores faltan en cada cantidad


  # representa la relación


  # calcula la correlación usando los pares completos
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),
    horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),
    trabaja = c("Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_lectura <- data.frame(
    id = 1:10,
    minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),
    puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_trabajan <- encuesta_social |>
    filter(trabaja == "Sí") |>
    select(id, horas_trabajo, horas_sueno)

  sum(is.na(datos_trabajan$horas_trabajo))

  sum(is.na(datos_trabajan$horas_sueno))

  plot(
    datos_trabajan$horas_trabajo,
    datos_trabajan$horas_sueno
  )

  cor(
    datos_trabajan$horas_trabajo,
    datos_trabajan$horas_sueno,
    use = "complete.obs"
  )
checks:
- type: custom_r
  code: grepl('(plot|hist|barplot)\\s*\\(', .user_code)
  message: Asegúrate de generar el gráfico solicitado utilizando la función correspondiente
    (plot, hist o barplot).
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Para formar un punto necesitas disponibles ambas cantidades del mismo caso.
- title: Pista 2 · Procedimiento
  text: Primero prepara el subgrupo y revisa los missing. Después trabaja con los
    pares completos.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    cor(
      datos_trabajan$horas_trabajo,
      datos_trabajan$horas_sueno,
      use = "complete.obs"
    )
success_message: '> Bien. Preparaste el subgrupo, revisaste los missing y usaste los
  siete pares completos para representar y resumir la misma relación.'
navigation:
  next: intro-r-09-007
