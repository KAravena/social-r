id: intro-r-09-006
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 5
title: Prepara los pares antes de correlacionar
context: |-
  Antes de correlacionar debemos aislar el grupo pertinente. Queremos estudiar horas de trabajo e ingreso únicamente entre quienes efectivamente trabajan (`trabaja == "Sí"`):

  | id | horas_trabajo | ingreso_miles | trabaja |
  |:---|---:|---:|:---|
  | 1 | 20 | 420 | Sí |
  | 2 | 35 | 650 | Sí |
  | 3 | 0 | 300 | No |
  | 4 | 25 | 380 | Sí |
  | 5 | 40 | 720 | Sí |
  | ... | ... | ... | ... |
instruction: |-
  1. Filtra a quienes trabajan (`trabaja == "Sí"`) y guarda el subgrupo en `datos_trabajan`.
  2. Calcula la correlación entre `horas_trabajo` e `ingreso_miles` en ese subgrupo.
learning_objectives:
  r: Manejar preparación de datos y calcular correlación sobre el grupo pertinente.
  data: Entre las personas que trabajan, estudiar cómo se relacionan horas de trabajo
    semanal y horas de sueño
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |
  # 1. Prepara las personas que trabajan con horas_trabajo y horas_sueno:
  datos_trabajan <- encuesta_social |>
    filter(trabaja == "Sí") |>
    select(id, horas_trabajo, horas_sueno)

  # 2. Revisa valores faltantes y representa la relación con plot:


  # 3. Calcula la correlación de los pares completos con cor:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),
    horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),
    trabaja = c("Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_lectura <- data.frame(
    id = 1:10,
    minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),
    puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_trabajan <- encuesta_social |>
    filter(trabaja == "Sí") |>
    select(id, horas_trabajo, horas_sueno)

  sum(is.na(datos_trabajan$horas_trabajo))
  sum(is.na(datos_trabajan$horas_sueno))

  plot(
    datos_trabajan$horas_trabajo,
    datos_trabajan$horas_sueno
  )

  cor(
    datos_trabajan$horas_trabajo,
    datos_trabajan$horas_sueno,
    use = "complete.obs"
  )
checks:
- type: object_exists
  object: datos_trabajan
  message: Debes preparar el subconjunto 'datos_trabajan'.
- type: custom_r
  code: is.data.frame(.target_env$datos_trabajan) && nrow(.target_env$datos_trabajan)
    == 8 && all(c('horas_trabajo', 'horas_sueno') %in% names(.target_env$datos_trabajan))
  message: '''datos_trabajan'' debe contener a las 8 personas que trabajan con las
    columnas horas_trabajo y horas_sueno.'
- type: custom_r
  code: grepl('plot\\s*\\([^)]*horas_trabajo', .user_code)
  message: Genera el gráfico de dispersión con plot(datos_trabajan$horas_trabajo,
    datos_trabajan$horas_sueno).
- type: custom_r
  code: grepl('cor\\s*\\([^)]*complete\\.obs', .user_code)
  message: Calcula la correlación lineal usando cor(..., use = 'complete.obs').
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Para formar un punto necesitas disponibles ambas cantidades del mismo caso.
- title: Pista 2 · Procedimiento
  text: Primero prepara el subgrupo y revisa los missing. Después trabaja con los
    pares completos.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    cor(
      datos_trabajan$horas_trabajo,
      datos_trabajan$horas_sueno,
      use = "complete.obs"
    )
success_message: '> Bien. Preparaste el subgrupo, revisaste los missing y usaste los
  siete pares completos para representar y resumir la misma relación.'
navigation:
  next: intro-r-09-007
schema_version: 1
