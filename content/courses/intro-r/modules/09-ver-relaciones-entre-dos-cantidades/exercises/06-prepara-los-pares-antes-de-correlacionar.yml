id: intro-r-09-006
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 5
title: Prepara los pares antes de correlacionar
context: 'Queremos responder:


  > Entre las personas que trabajan,

  > ¿cómo se relacionan las horas de trabajo semanal

  > y las horas de sueño?


  Primero prepara los datos:


  - conserva solo quienes trabajan;

  - conserva `id`, `horas_trabajo` y `horas_sueno`.


  Después:


  1. revisa cuántos valores faltan en cada cantidad;

  2. determina cuántos casos pueden formar un par completo;

  3. representa la relación;

  4. calcula la correlación utilizando los pares completos;

  5. interpreta el resultado.


  Importante:


  > Tener 8 personas en el subgrupo no significa automáticamente tener 8 pares disponibles.'
instruction: 'Prepara los datos: filtra los casos completos de `horas_trabajo` y `horas_sueno` en `encuesta_social` y calcula su correlación de Pearson con `use = "complete.obs"`.'
learning_objectives:
  r: Puede preparar un subgrupo, diagnosticar missing bivariado, reconocer el número de pares completos y hacer que gráfico y correlación describan la misma muestra analítica.
  data: Entre las personas que trabajan, estudiar cómo se relacionan horas de trabajo semanal y horas de sueño
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: "datos_trabajan <- encuesta_social |>\n  filter(__________________) |>\n  select(____, _____________, ____________)\n\n# revisa cuántos valores faltan en cada cantidad\n\n\n# representa la relación\n\n\n# calcula la correlación usando los pares completos"
setup_code: "encuesta_social <- data.frame(\n  id = 1:12,\n  horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),\n  puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),\n  horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),\n  horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),\n  trabaja = c(\"Sí\", \"Sí\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n)\nencuesta_lectura <- data.frame(\n  id = 1:10,\n  minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),\n  puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),\n  stringsAsFactors = FALSE\n)"
solution_code: "datos_trabajan <- encuesta_social |>\n  filter(trabaja == \"Sí\") |>\n  select(id, horas_trabajo, horas_sueno)\n\nsum(is.na(datos_trabajan$horas_trabajo))\n\nsum(is.na(datos_trabajan$horas_sueno))\n\nplot(\n  datos_trabajan$horas_trabajo,\n  datos_trabajan$horas_sueno\n)\n\ncor(\n  datos_trabajan$horas_trabajo,\n  datos_trabajan$horas_sueno,\n  use = \"complete.obs\"\n)"
checks:
- type: object_exists
  object: datos_trabajan
  message: Debes guardar el subconjunto preparado en 'datos_trabajan'.
- type: custom_r
  code: is.data.frame(get('datos_trabajan', envir = .target_env)) && all(c('id', 'horas_trabajo', 'horas_sueno') %in% names(get('datos_trabajan', envir = .target_env)))
  message: '''datos_trabajan'' debe contener las observaciones filtradas con las variables relevantes.'
- type: custom_r
  code: grepl('cor[[:space:]]*[(]', .user_code)
  message: Calcula la correlación sobre los pares completos del subgrupo usando use = "complete.obs".
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Para formar un punto necesitas disponibles ambas cantidades del mismo caso.
- title: Pista 2 · Procedimiento
  text: Primero prepara el subgrupo y revisa los missing. Después trabaja con los pares completos.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "cor(\n  datos_trabajan$horas_trabajo,\n  datos_trabajan$horas_sueno,\n  use = \"complete.obs\"\n)"
success_message: '> Bien. Preparaste el subgrupo, revisaste los missing y usaste los siete pares completos para representar y resumir la misma relación.'
navigation:
