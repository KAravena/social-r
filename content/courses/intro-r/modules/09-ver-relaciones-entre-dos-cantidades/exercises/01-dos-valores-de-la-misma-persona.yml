id: intro-r-09-001
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 0
title: Dos valores de la misma persona
context: 'Hasta ahora describíamos una cantidad por separado.


  Ahora queremos estudiar dos cantidades al mismo tiempo.


  La clave es que cada persona aporta **dos valores que deben permanecer juntos**.


  Observa:


  ```text

  caso 1 → 2 horas de estudio + 59 puntos

  caso 2 → 4 horas de estudio + 68 puntos

  caso 3 → 3 horas de estudio + 58 puntos

  ```


  Podemos representar el caso 3 como:


  ```text

  (3, 58)

  ```


  Ese par contiene dos características de la **misma persona**.


  Responde:'
instruction: '1. ¿Qué dos valores forman el par del caso 3?

  2. ¿Podríamos combinar las 3 horas del caso 3 con los 68 puntos del caso 2?

  3. ¿Qué ocurriría si cambiáramos el orden de `puntaje_metodos` sin mover al mismo
  tiempo `horas_estudio`?'
learning_objectives:
  r: Puede identificar los dos valores cuantitativos que pertenecen a un mismo caso,
    representarlos como un par `(x, y)` y ex
  data: Horas de estudio y puntaje en un curso de métodos para personas de `encuesta_social`
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: '# Escribe las horas de estudio y el puntaje de la Persona 3 como un
  par c(x, y)

  par_persona_3 <- c(___, ___)'
setup_code: "encuesta_social <- data.frame(\n  id = 1:12,\n  horas_estudio = c(2,\
  \ 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),\n  puntaje_metodos = c(59, 68, 58, 64, 62,\
  \ 75, 65, 64, 74, 84, 59, 73),\n  horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45,\
  \ 0, 38, 0, 32),\n  horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3,\
  \ 7.7, 8.1, 7.4),\n  trabaja = c(\"Sí\", \"Sí\", \"No\", \"Sí\", \"Sí\", \"No\"\
  , \"Sí\", \"Sí\", \"No\", \"Sí\", \"No\", \"Sí\"),\n  stringsAsFactors = FALSE\n\
  )\nencuesta_lectura <- data.frame(\n  id = 1:10,\n  minutos_lectura = c(15, 35,\
  \ 25, 55, 20, 50, 30, 60, 40, 45),\n  puntaje_comprension = c(50, 57, 66, 84, 59,\
  \ 69, 68, 83, 55, 62),\n  stringsAsFactors = FALSE\n)"
solution_code: par_persona_3 <- c(3, 58)
checks:
- type: object_exists
  object: par_persona_3
  message: Debes definir 'par_persona_3'.
- type: object_value
  object: par_persona_3
  expected:
