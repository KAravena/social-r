id: intro-r-09-003
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 2
title: ¿Hacia dónde va la relación?
context: |-
  La dirección de una relación describe cómo varía una cantidad cuando la otra aumenta:

  - **Positiva**: a mayor X, mayor Y (asciende de izquierda a derecha).
  - **Negativa**: a mayor X, menor Y (desciende de izquierda a derecha).

  *Nota fundamental: Asociación empírica no demuestra causalidad.*
instruction: Observa los gráficos de referencia y clasifica la dirección asignando
  `"positiva"` o `"negativa"` a `direccion_a` y `direccion_b`.
learning_objectives:
  r: Identificar la dirección de una relación en un scatterplot distinguiéndola de
    causalidad.
  data: Tres patrones abstractos deliberadamente simples para aislar la dirección
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  # Clasifica la relación de cada gráfico como "positiva", "negativa" o "sin_direccion":
  direccion_a <- "___"  # Gráfico A
  direccion_b <- "___"  # Gráfico B
  direccion_c <- "___"  # Gráfico C
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),
    horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),
    trabaja = c("Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_lectura <- data.frame(
    id = 1:10,
    minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),
    puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),
    stringsAsFactors = FALSE
  )
solution_code: |-
  direccion_a <- "positiva"
  direccion_b <- "negativa"
  direccion_c <- "sin_direccion"
checks:
- type: object_value
  object: direccion_a
  expected: positiva
  message: 'El Gráfico A asciende de izquierda a derecha: relación positiva.'
- type: object_value
  object: direccion_b
  expected: negativa
  message: 'El Gráfico B desciende de izquierda a derecha: relación negativa.'
- type: object_value
  object: direccion_c
  expected: sin_direccion
  message: 'El Gráfico C muestra una nube dispersa sin tendencia lineal: sin dirección
    clara.'
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Lee el gráfico de izquierda a derecha.
- title: Pista 2 · Procedimiento
  text: Pregunta qué tiende a pasar con y cuando x aumenta.
- title: Pista 3 · Sintaxis / Acción
  text: A sube; B baja; C no muestra una dirección lineal clara.
success_message: '> Bien. La dirección resume una tendencia del conjunto de puntos,
  no el comportamiento exacto de cada caso.'
navigation:
  next: intro-r-09-004
schema_version: 1
