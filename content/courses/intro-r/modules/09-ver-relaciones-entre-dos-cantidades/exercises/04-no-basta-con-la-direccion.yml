id: intro-r-09-004
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 3
title: No basta con la dirección
context: Dos relaciones pueden ir en la misma dirección pero tener distinta concentración
  de puntos alrededor de una recta.
instruction: Observa los gráficos A y B. Guarda en `grafico_mas_concentrado` cuál
  de los dos (`"A"` o `"B"`) muestra los puntos más alineados alrededor de la recta.
learning_objectives:
  r: Evaluar forma, fuerza y presencia de valores atípicos en un diagrama de dispersión.
  data: Dos relaciones abstractas positivas con diferente concentración alrededor
    de una tendencia aproximadamente lineal
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |-
  # ¿Cuál gráfico tiene los puntos más concentrados alrededor de una línea? ("A" o "B")
  grafico_mas_concentrado <- "___"
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),
    horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),
    trabaja = c("Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_lectura <- data.frame(
    id = 1:10,
    minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),
    puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),
    stringsAsFactors = FALSE
  )
solution_code: grafico_mas_concentrado <- "A"
checks:
- type: object_value
  object: grafico_mas_concentrado
  expected: A
  message: El Gráfico A tiene puntos mucho más concentrados y alineados (r ≈ 0.99)
    que el B (r ≈ 0.77).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Ambos suben. Busca otra diferencia.
- title: Pista 2 · Procedimiento
  text: Mira qué tan cerca están los puntos de una tendencia aproximadamente lineal.
- title: Pista 3 · Sintaxis / Acción
  text: A está más concentrado; B está más disperso.
success_message: '> Bien. Ambos patrones son positivos, pero A está mucho más concentrado
  alrededor de una tendencia aproximadamente lineal.'
navigation:
  next: intro-r-09-005
schema_version: 1
