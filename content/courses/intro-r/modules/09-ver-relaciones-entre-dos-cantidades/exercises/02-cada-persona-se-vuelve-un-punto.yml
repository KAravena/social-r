id: intro-r-09-002
course: intro-r
module: 09-ver-relaciones-entre-dos-cantidades
order: 1
title: Cada persona se vuelve un punto
context: |-
  En un **gráfico de dispersión (scatterplot)** cada persona se representa como un punto en el plano:

  `plot(base$variable_x, base$variable_y)`

  Base `encuesta_social` (12 casos):

  | id | horas_estudio | puntaje_metodos | horas_trabajo | trabaja |
  |:---|---:|---:|---:|:---|
  | 1 | 2 | 59 | 20 | Sí |
  | 2 | 4 | 68 | 35 | Sí |
  | 3 | 3 | 58 | 0 | No |
  | 4 | 6 | 64 | 25 | Sí |
  | 5 | 5 | 62 | 40 | Sí |
  | 6 | 8 | 75 | 0 | No |
  | ... | ... | ... | ... | ... |
instruction: Genera el gráfico de dispersión con `plot()` ubicando `horas_estudio`
  en el eje horizontal y `puntaje_metodos` en el eje vertical.
learning_objectives:
  r: Generar e interpretar un diagrama de dispersión bivariado con `plot(x, y)`.
  data: Horas de estudio y puntaje de métodos en los 12 casos completos de `encuesta_social`
  social: 'Aplicación a investigación social en módulo 9: ver relaciones entre dos
    cantidades.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: intermediate
type: code
starter_code: |
  # Genera el diagrama de dispersión entre horas_estudio y puntaje_metodos:
setup_code: |-
  encuesta_social <- data.frame(
    id = 1:12,
    horas_estudio = c(2, 4, 3, 6, 5, 8, 7, 10, 9, 11, 4, 6),
    puntaje_metodos = c(59, 68, 58, 64, 62, 75, 65, 64, 74, 84, 59, 73),
    horas_trabajo = c(20, 35, 0, 25, 40, 0, 30, 45, 0, 38, 0, 32),
    horas_sueno = c(8.4, 7.7, 8.5, 7.6, 7.6, 8.2, NA, 7.1, 8.3, 7.7, 8.1, 7.4),
    trabaja = c("Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "Sí", "No", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
  encuesta_lectura <- data.frame(
    id = 1:10,
    minutos_lectura = c(15, 35, 25, 55, 20, 50, 30, 60, 40, 45),
    puntaje_comprension = c(50, 57, 66, 84, 59, 69, 68, 83, 55, 62),
    stringsAsFactors = FALSE
  )
solution_code: plot(encuesta_social$horas_estudio, encuesta_social$puntaje_metodos)
checks:
- type: custom_r
  code: grepl('plot\\s*\\(', .user_code)
  message: Genera el diagrama con plot(encuesta_social$horas_estudio, encuesta_social$puntaje_metodos).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Cada caso aporta dos valores que forman un punto.
- title: Pista 2 · Procedimiento
  text: La primera variable va al eje horizontal y la segunda al vertical.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    plot(
      encuesta_social$horas_estudio,
      encuesta_social$puntaje_metodos
    )
success_message: '> Bien. Cada punto conserva los dos valores de un mismo caso: horas
  de estudio en horizontal y puntaje en vertical.'
navigation:
  next: intro-r-09-003
schema_version: 1
