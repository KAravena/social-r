id: 09-ver-relaciones-entre-dos-cantidades
title: 'Módulo 9: Ver relaciones entre dos cantidades'
short_title: Módulo 9
order: 9
description: Analiza relaciones bivariadas numéricas mediante diagramas de dispersión
  (scatterplots) con plot() y resume su fuerza y dirección lineal con el coeficiente
  de correlación de Pearson.
learning_outcomes: &id001
- Representar dos variables cuantitativas en un gráfico de dispersión.
- Reconocer dirección y forma en una relación.
- Resumir una relación lineal mediante una correlación.
