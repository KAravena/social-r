id: intro-r-06-001
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 0
title: El valor que no está
context: |-
  En encuestas sociales es común que algunas personas no respondan una pregunta. En R, la ausencia de información se representa con `NA` (sin comillas):

  - `0`: es un valor observado (la persona reportó cero horas).
  - `NA`: el dato no está disponible (información desconocida).

  Reemplazar `NA` por 0 sería un error grave: asumiríamos que alguien no cuidó cuando en realidad no sabemos su respuesta.

  Vector disponible: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Ejecuta `horas_cuidado` y observa en la consola la diferencia entre el
  valor observado `0` y el dato ausente `NA`.
learning_objectives:
  r: Identificar `NA` como ausencia de dato y distinguirlo del valor numérico `0`.
  data: Cinco personas responden una pregunta sobre horas de cuidado
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # Escribe horas_cuidado para observar sus valores:
  
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: horas_cuidado
checks:
- type: custom_r
  code: grepl("horas_cuidado", .checker_args$user_code) && identical(.res_val, c(6, 0, NA, 8, 4))
  message: Escribe y ejecuta el objeto 'horas_cuidado' para observar sus valores.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: 'Pregunta primero: ¿conocemos la respuesta de la persona 2? ¿Y la de la persona 3?'
- title: Pista 2 · Procedimiento
  text: 'La persona 2 dio una respuesta válida: 0 horas. Para la persona 3 la información no está disponible.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Ejecuta `horas_cuidado` para ver cómo R muestra ambos valores en la consola.'
success_message: Bien. Cero es una respuesta observada (0 horas). `NA` indica que la información no está disponible.
navigation:
  next: intro-r-06-002
schema_version: 1
