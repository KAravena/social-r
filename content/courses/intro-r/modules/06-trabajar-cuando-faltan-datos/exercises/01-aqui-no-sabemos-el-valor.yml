id: intro-r-06-001
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 0
title: Aquí no sabemos el valor
context: |-
  En encuestas sociales es común que algunas personas no respondan. En R, la ausencia de información se representa con `NA` (sin comillas):

  - `0`: es un valor observado (reportó cero).
  - `NA`: el dato no está disponible (desconocido).
instruction: Consulta el vector `horas_cuidado` y distingue las posiciones con valor
  observado `0` de las posiciones con dato ausente `NA`.
learning_objectives:
  r: Identificar `NA` como ausencia de dato y distinguirlo del valor numérico `0`.
  data: Cinco personas responden una pregunta sobre horas de cuidado
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: horas_cuidado
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  encuesta_barrio <- data.frame(
    id = 1:6,
    minutos_viaje = c(35, NA, 50, 20, NA, 40),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus"),
    stringsAsFactors = FALSE
  )
solution_code: horas_cuidado
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta 'horas_cuidado' para observar los valores.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: 'Pregunta primero: ¿conocemos el valor o no?'
- title: Pista 2 · Procedimiento
  text: 'Para la persona 2 conocemos exactamente la respuesta: cero.'
- title: Pista 3 · Sintaxis / Acción
  text: Persona 2 → valor conocido 0. Persona 3 → valor ausente `NA`.
success_message: Bien. Cero es una respuesta conocida. `NA` indica que no tenemos
  un valor disponible para esa posición.
navigation:
  next: intro-r-06-002
schema_version: 1
