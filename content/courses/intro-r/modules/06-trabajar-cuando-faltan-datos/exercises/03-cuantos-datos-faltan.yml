id: intro-r-06-003
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 2
title: ¿Cuántos datos faltan?
context: |-
  En operaciones aritméticas, R trata a `TRUE` como 1 y a `FALSE` como 0. Por eso podemos contar cuántos datos faltan sumando los valores lógicos:

  `sum(is.na(vector))`

  Vector: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Cuenta cuántos valores ausentes hay en `horas_cuidado` combinando `sum()`
  e `is.na()`.
learning_objectives:
  r: Contar la cantidad de valores ausentes combinando `sum()` e `is.na()`.
  data: |-
    El mismo microvector:

    ```r
    horas_cuidado <- c(6, 0, NA, 8, 4)
    ```
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # Cuenta cuántos valores faltan en horas_cuidado:
  sum(is.na(encuesta_social_demo$horas_cuidado))
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  encuesta_barrio <- data.frame(
    id = 1:6,
    minutos_viaje = c(35, NA, 50, 20, NA, 40),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus"),
    stringsAsFactors = FALSE
  )
solution_code: sum(is.na(horas_cuidado))
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero necesitas saber qué posiciones están ausentes.
- title: Pista 2 · Procedimiento
  text: '`is.na()` produce TRUE/FALSE y `sum()` puede contar los TRUE.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: sum(is.na(horas_cuidado))
success_message: Bien. Primero identificaste qué posiciones están ausentes y después
  contaste cuántos `TRUE` produjo esa pregunta.
navigation:
  next: intro-r-06-004
schema_version: 1
