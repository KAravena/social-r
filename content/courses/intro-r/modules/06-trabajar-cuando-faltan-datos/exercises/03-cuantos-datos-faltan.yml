id: intro-r-06-003
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 2
title: ¿Cuántos faltan y cuántos quedan?
context: |-
  En operaciones aritméticas, R trata a `TRUE` como 1 y a `FALSE` como 0. Por eso podemos contar cuántos datos faltan sumando los valores lógicos:

  `sum(is.na(vector))`

  Vector: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Cuenta cuántos valores ausentes hay en `horas_cuidado` combinando `sum()`
  e `is.na()`.
learning_objectives:
  r: Contar la cantidad de valores ausentes combinando `sum()` e `is.na()`.
  data: Comprender la estructura de los datos.
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # 1. Cuenta cuántos valores faltan en horas_cuidado y guárdalo en 'faltan':


  # 2. Cuenta cuántos casos quedan disponibles y guárdalo en 'disponibles':
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  faltan <- sum(is.na(horas_cuidado))
  disponibles <- length(horas_cuidado) - faltan

  faltan
  disponibles
checks:
- type: object_exists
  object: faltan
  message: Debes guardar la cantidad de datos ausentes en el objeto 'faltan'.
- type: object_exists
  object: disponibles
  message: Debes guardar los casos disponibles en el objeto 'disponibles'.
- type: custom_r
  code: .target_env$faltan == 1 && .target_env$disponibles == 4
  message: Debe faltar 1 dato y quedar 4 disponibles (5 - 1 = 4).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Para saber cuántos quedan, resta las ausencias al total de 5 observaciones.
- title: Pista 2 · Procedimiento
  text: Usa la variable `faltan` que creaste en el paso 1 para restarla de 5.
- title: Pista 3 · Sintaxis / Acción
  text: Escribe `disponibles <- 5 - faltan`.
success_message: |-
  - **Correcto:** Muy bien. Faltan 1 dato y quedan 4 disponibles. Conocer el $N$ disponible es fundamental antes de cualquier cálculo: nos dice con cuántas personas reales estamos trabajando.
  - **Incorrecto:** Revisa el cálculo: `faltan` debe ser `sum(is.na(horas_cuidado))` y `disponibles` debe ser `5 - faltan`.

  ---
