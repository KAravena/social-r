id: intro-r-06-003
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 2
title: ¿Cuántos datos faltan?
context: 'Ya podemos detectar dónde falta información.


  Ahora queremos responder:


  > ¿cuántos datos faltan?


  `is.na()` produce TRUE/FALSE.


  Para este uso dentro de `sum()`:


  - cada `TRUE` aporta 1;

  - cada `FALSE` aporta 0.


  Por eso podemos combinar ambas ideas.


  Completa el código para contar los valores ausentes de `horas_cuidado`.'
instruction: Completa el código para contar los valores ausentes combinando `sum()` e `is.na(horas_cuidado)`.
learning_objectives:
  r: Puede contar ausencias a partir del objeto mediante `sum(is.na(x))`
  data: 'El mismo microvector:


    ```r

    horas_cuidado <- c(6, 0, NA, 8, 4)

    ```'
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: sum(____________________)
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22, 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\", \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\", \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),\n  stringsAsFactors = FALSE\n)\nhoras_cuidado <- c(6, 0, NA, 8, 4)\nencuesta_barrio <- data.frame(\n  id = 1:6,\n  minutos_viaje = c(35, NA, 50, 20, NA, 40),\n  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\", \"Metro\", \"Bus\"),\n  stringsAsFactors = FALSE\n)"
solution_code: sum(is.na(horas_cuidado))
checks:
- type: custom_r
  code: isTRUE(all.equal(.res_val, 1))
  message: El total de valores ausentes en horas_cuidado debe ser 1.
- type: custom_r
  code: grepl('sum[[:space:]]*[(][[:space:]]*is[.]na[[:space:]]*[(][[:space:]]*horas_cuidado', .user_code)
  message: Combina sum(is.na(horas_cuidado)) para contar cuántos TRUE hay.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero necesitas saber qué posiciones están ausentes.
- title: Pista 2 · Procedimiento
  text: '`is.na()` produce TRUE/FALSE y `sum()` puede contar los TRUE.'
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: sum(is.na(horas_cuidado))
success_message: Bien. Primero identificaste qué posiciones están ausentes y después contaste cuántos `TRUE` produjo esa pregunta.
