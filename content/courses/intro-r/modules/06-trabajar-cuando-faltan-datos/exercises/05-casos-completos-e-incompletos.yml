id: intro-r-06-005
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 4
title: Casos completos e incompletos
context: |-
  Disponemos de `encuesta_social_demo` con horas de cuidado:

  | id | edad | carrera | horas_estudio | trabaja | horas_cuidado |
  |:---|---:|:---|---:|:---|:---|
  | 1 | 20 | Sociología | 3 | No | 6 |
  | 2 | 22 | Historia | 5 | Sí | NA |
  | 3 | 19 | Antropología | 2 | No | 0 |
  | 4 | 21 | Sociología | 4 | No | 8 |
  | 5 | 24 | Trabajo Social | 6 | Sí | 4 |
  | 6 | 23 | Antropología | 3 | Sí | 5 |
  | 7 | 20 | Historia | 5 | No | NA |
  | 8 | 25 | Sociología | 2 | Sí | 7 |
instruction: |-
  1. Prepara `datos_trabajan` filtrando a quienes trabajan (`trabaja == "Sí"`) y seleccionando `id` y `horas_cuidado`.
  2. Cuenta cuántos valores ausentes hay en `horas_cuidado` de ese subgrupo usando `sum(is.na())`.
learning_objectives:
  r: Preparar datos y diagnosticar valores ausentes en el grupo obtenido.
  data: Comprender la estructura de los datos.
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Identifica los casos completos de registro_cuidado:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  complete.cases(registro_cuidado)
  sum(complete.cases(registro_cuidado))
checks:
- type: custom_r
  code: grepl('complete\\.cases\\s*\\(', .user_code)
  message: Usa complete.cases(registro_cuidado) para identificar las filas completas.
- type: custom_r
  code: .res_val == 3
  message: Debe haber 3 casos completos en registro_cuidado (filas 1, 4 y 5).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Un caso está completo solo si ninguna de sus variables contiene NA. En esta
    muestra, los casos 1, 4 y 5 están completos.
- title: Pista 2 · Procedimiento
  text: Usa `complete.cases(registro_cuidado)` dentro de `sum()` para contar los TRUE.
- title: Pista 3 · Sintaxis / Acción
  text: Completa con `sum(complete.cases(registro_cuidado))`.
success_message: |-
  - **Correcto:** ¡Exacto! `complete.cases()` devuelve TRUE únicamente para los casos 1, 4 y 5. De las 5 personas de la muestra, solo 3 tienen información completa en ambas variables.
  - **Incorrecto:** Ejecuta primero `complete.cases(registro_cuidado)` y luego cuenta los casos completos con `sum(complete.cases(registro_cuidado))`.

  ---
navigation:
