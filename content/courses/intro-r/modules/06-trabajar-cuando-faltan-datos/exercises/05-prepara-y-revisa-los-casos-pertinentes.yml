id: intro-r-06-005
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 4
title: Prepara y revisa los casos pertinentes
context: |-
  Disponemos de `encuesta_social_demo` con horas de cuidado:

  | id | edad | carrera | horas_estudio | trabaja | horas_cuidado |
  |:---|---:|:---|---:|:---|:---|
  | 1 | 20 | Sociología | 3 | No | 6 |
  | 2 | 22 | Historia | 5 | Sí | NA |
  | 3 | 19 | Antropología | 2 | No | 0 |
  | 4 | 21 | Sociología | 4 | No | 8 |
  | 5 | 24 | Trabajo Social | 6 | Sí | 4 |
  | 6 | 23 | Antropología | 3 | Sí | 5 |
  | 7 | 20 | Historia | 5 | No | NA |
  | 8 | 25 | Sociología | 2 | Sí | 7 |
instruction: |-
  1. Prepara `datos_trabajan` filtrando a quienes trabajan (`trabaja == "Sí"`) y seleccionando `id` y `horas_cuidado`.
  2. Cuenta cuántos valores ausentes hay en `horas_cuidado` de ese subgrupo usando `sum(is.na())`.
learning_objectives:
  r: Preparar datos y diagnosticar valores ausentes en el grupo obtenido.
  data: Queremos revisar las horas de cuidado de las personas que trabajan
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  datos_trabajan <- encuesta_social_demo |>
    filter(trabaja == "Sí") |>
    select(edad, horas_estudio)

  # cuenta cuántos valores faltan en horas_cuidado
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  encuesta_barrio <- data.frame(
    id = 1:6,
    minutos_viaje = c(35, NA, 50, 20, NA, 40),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_trabajan <- encuesta_social_demo |>
    filter(trabaja == "Sí") |>
    select(id, horas_cuidado)

  sum(is.na(datos_trabajan$horas_cuidado))
checks:
- type: object_exists
  object: datos_trabajan
  message: Debes crear el objeto 'datos_trabajan' usando <-.
- type: custom_r
  code: exists('datos_trabajan', envir = .target_env, inherits = FALSE)
  message: El objeto 'datos_trabajan' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero decide qué casos necesitas y qué variables conservar.
- title: Pista 2 · Procedimiento
  text: Después de crear `datos_trabajan`, revisa su variable `horas_cuidado` con
    la herramienta de missing que ya conoces.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    datos_trabajan <- encuesta_social_demo |>
      filter(trabaja == "Sí") |>
      select(id, horas_cuidado)

    sum(is.na(datos_trabajan$horas_cuidado))
success_message: Bien. Preparaste el grupo que necesitabas y después revisaste sus
  ausencias. El filtrado no eliminó automáticamente el `NA` de `horas_cuidado`.
navigation:
  next: intro-r-06-006
schema_version: 1
