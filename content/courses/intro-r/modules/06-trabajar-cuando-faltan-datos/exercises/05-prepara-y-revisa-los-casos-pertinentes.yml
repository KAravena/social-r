id: intro-r-06-005
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 4
title: Prepara y revisa los casos pertinentes
context: Al preparar un subconjunto debemos revisar si los casos seleccionados tienen
  datos completos. Podemos filtrar observaciones no ausentes con `!is.na(variable)`.
instruction: Filtra en `encuesta_social_demo` los casos donde `!is.na(horas_cuidado)`
  y selecciona las columnas `edad` y `horas_cuidado`.
learning_objectives:
  r: Filtrar casos con datos disponibles en un pipeline usando `!is.na()`.
  data: Queremos revisar las horas de cuidado de las personas que trabajan
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: "datos_trabajan <- encuesta_social_demo |>\n  filter(__________________)\
  \ |>\n  select(____, ____________)\n\n# cuenta cuántos valores faltan en horas_cuidado"
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  horas_cuidado = c(6, NA, 0,\
  \ 8, 4, 5, NA, 7),\n  stringsAsFactors = FALSE\n)\nhoras_cuidado <- c(6, 0, NA,\
  \ 8, 4)\nencuesta_barrio <- data.frame(\n  id = 1:6,\n  minutos_viaje = c(35, NA,\
  \ 50, 20, NA, 40),\n  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"\
  , \"Metro\", \"Bus\"),\n  stringsAsFactors = FALSE\n)"
solution_code: "datos_trabajan <- encuesta_social_demo |>\n  filter(trabaja == \"\
  Sí\") |>\n  select(id, horas_cuidado)\n\nsum(is.na(datos_trabajan$horas_cuidado))"
checks:
- type: object_exists
  object: datos_trabajan
  message: Debes crear el objeto 'datos_trabajan' usando <-.
- type: custom_r
  code: exists('datos_trabajan', envir = .target_env, inherits = FALSE)
  message: El objeto 'datos_trabajan' debe existir en el entorno.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Primero decide qué casos necesitas y qué variables conservar.
- title: Pista 2 · Procedimiento
  text: Después de crear `datos_trabajan`, revisa su variable `horas_cuidado` con
    la herramienta de missing que ya conoces.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: "datos_trabajan <- encuesta_social_demo |>\n  filter(trabaja == \"Sí\") |>\n\
    \  select(id, horas_cuidado)\n\nsum(is.na(datos_trabajan$horas_cuidado))"
success_message: Bien. Preparaste el grupo que necesitabas y después revisaste sus
  ausencias. El filtrado no eliminó automáticamente el `NA` de `horas_cuidado`.
navigation:
