id: intro-r-06-002
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 1
title: ¿Dónde falta información?
context: |-
  Para saber dónde faltan datos usamos la función `is.na()`. Esta función revisa cada posición del vector y responde con valores lógicos:

  - `TRUE`: falta información en esa posición.
  - `FALSE`: hay un valor observado disponible.

  Vector disponible: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Aplica `is.na()` sobre `horas_cuidado` para identificar qué posiciones
  contienen datos ausentes.
learning_objectives:
  r: Detectar valores ausentes en un vector mediante la función lógica `is.na()`.
  data: El mismo microvector de cinco personas
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # Identifica qué posiciones contienen datos ausentes:
  is.na(__________)
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: is.na(horas_cuidado)
checks:
- type: custom_r
  code: is.logical(.res_val) && length(.res_val) == 5 && identical(.res_val, c(FALSE, FALSE, TRUE, FALSE, FALSE))
  message: Aplica is.na(horas_cuidado) para identificar las posiciones con NA.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Necesitas una pregunta lógica que responda TRUE exactamente donde no hay dato registrado.
- title: Pista 2 · Procedimiento
  text: Pasa el vector `horas_cuidado` como argumento dentro de `is.na()`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Completa los guiones con el nombre del vector: `is.na(horas_cuidado)`.'
success_message: Exacto. `TRUE` aparece en la tercera posición, donde está el `NA`. En las demás posiciones aparece `FALSE` porque sí hay un valor disponible (incluyendo el 0).
navigation:
  next: intro-r-06-003
schema_version: 1
