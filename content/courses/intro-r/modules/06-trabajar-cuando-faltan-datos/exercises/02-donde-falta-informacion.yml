id: intro-r-06-002
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 1
title: ¿Dónde falta información?
context: |-
  Para detectar datos ausentes usamos `is.na()`. Devuelve `TRUE` donde falta información y `FALSE` donde hay un valor disponible:

  `is.na(c(6, 0, NA))` → `FALSE, FALSE, TRUE`

  Vector: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Aplica `is.na()` sobre `horas_cuidado` para identificar qué posiciones
  contienen datos ausentes.
learning_objectives:
  r: Detectar valores ausentes en un vector mediante la función lógica `is.na()`.
  data: El mismo microvector de horas de cuidado de E1
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Identifica qué posiciones contienen valores ausentes en horas_cuidado:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  encuesta_barrio <- data.frame(
    id = 1:6,
    minutos_viaje = c(35, NA, 50, 20, NA, 40),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus"),
    stringsAsFactors = FALSE
  )
solution_code: is.na(horas_cuidado)
checks:
- type: custom_r
  code: grepl('is\\.na\\s*\\(', .user_code)
  message: Aplica is.na(horas_cuidado) para identificar las posiciones con NA.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Necesitas una pregunta que sea `TRUE` justo donde falta información.
- title: Pista 2 · Procedimiento
  text: La función diseñada para preguntar por ausencia es `is.na()`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: is.na(horas_cuidado)
success_message: Bien. `TRUE` aparece justo donde falta información. `FALSE` indica
  que en esa posición sí hay un valor disponible.
navigation:
  next: intro-r-06-003
schema_version: 1
