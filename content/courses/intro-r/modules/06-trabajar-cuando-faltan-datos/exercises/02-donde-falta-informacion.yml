id: intro-r-06-002
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 1
title: ¿Dónde falta información?
context: 'Ya sabemos qué significa `NA`.


  Ahora queremos preguntar automáticamente:


  > ¿en qué posición falta información?


  R tiene una función diseñada para esa pregunta:


  ```r

  is.na(horas_cuidado)

  ```


  Antes de ejecutar:


  > ¿en qué posición esperas que aparezca `TRUE`?


  Recuerda el significado:


  ```text

  TRUE

  → en esa posición falta información


  FALSE

  → en esa posición hay un valor disponible

  ```


  Observa algo importante:'
instruction: '> la posición que contiene `0` produce `FALSE`,

  > porque cero es un valor disponible.'
learning_objectives:
  r: Puede ejecutar e interpretar `is.na()` como una pregunta que devuelve `TRUE`
    justo donde falta información
  data: El mismo microvector de horas de cuidado de E1
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: is.na(horas_cuidado)
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  horas_cuidado = c(6, NA, 0,\
  \ 8, 4, 5, NA, 7),\n  stringsAsFactors = FALSE\n)\nhoras_cuidado <- c(6, 0, NA,\
  \ 8, 4)\nencuesta_barrio <- data.frame(\n  id = 1:6,\n  minutos_viaje = c(35, NA,\
  \ 50, 20, NA, 40),\n  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"\
  , \"Metro\", \"Bus\"),\n  stringsAsFactors = FALSE\n)"
solution_code: is.na(horas_cuidado)
checks:
- type: custom_r
  code: is.logical(.res_val) && length(.res_val) == 5 && isTRUE(all.equal(.res_val, c(FALSE, FALSE, TRUE, FALSE, FALSE)))
  message: Aplica is.na(horas_cuidado) para identificar los valores ausentes en horas_cuidado.
- type: custom_r
  code: grepl('is[.]na[[:space:]]*[(][[:space:]]*horas_cuidado[[:space:]]*[)]', .user_code)
  message: Aplica is.na() al objeto horas_cuidado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Necesitas una pregunta que sea `TRUE` justo donde falta información.
- title: Pista 2 · Procedimiento
  text: La función diseñada para preguntar por ausencia es `is.na()`.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: is.na(horas_cuidado)
success_message: Bien. `TRUE` aparece justo donde falta información. `FALSE` indica
  que en esa posición sí hay un valor disponible.
