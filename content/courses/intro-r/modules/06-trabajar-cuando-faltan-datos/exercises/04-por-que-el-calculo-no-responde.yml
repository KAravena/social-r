id: intro-r-06-004
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 3
title: Por qué el cálculo no responde
context: 'Ya sabemos que falta un dato.


  Ahora intentemos calcular el total:


  ```r

  sum(horas_cuidado)

  ```


  Antes de ejecutar:


  > ¿esperas obtener un número o `NA`?


  Ejecuta.


  R devuelve:


  ```text

  NA

  ```


  Eso no significa que R se haya roto.


  Falta uno de los valores y R no inventa qué número debería ocupar esa posición.


  Si la pregunta es:


  > ¿cuál es el total de las horas **registradas**?


  podemos pedir a `sum()` que utilice únicamente los valores disponibles:


  ```r

  sum(horas_cuidado, na.rm = TRUE)

  ```


  Aquí `na.rm = TRUE` configura una opción del cálculo.'
instruction: No está preguntando igualdad y no cambia el objeto.
learning_objectives:
  r: Comprende por qué `sum(x)` puede devolver `NA`, interpreta `na.rm = TRUE` correctamente
    y distingue total de valores reg
  data: El mismo microvector de cinco personas
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: 'sum(horas_cuidado)


  sum(horas_cuidado, na.rm = TRUE)


  horas_cuidado'
setup_code: "encuesta_social_demo <- data.frame(\n  id = 1:8,\n  edad = c(20, 22,\
  \ 19, 21, 24, 23, 20, 25),\n  carrera = c(\"Sociología\", \"Historia\", \"Antropología\"\
  , \"Sociología\", \"Trabajo Social\", \"Antropología\", \"Historia\", \"Sociología\"\
  ),\n  horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),\n  trabaja = c(\"No\", \"Sí\",\
  \ \"No\", \"No\", \"Sí\", \"Sí\", \"No\", \"Sí\"),\n  horas_cuidado = c(6, NA, 0,\
  \ 8, 4, 5, NA, 7),\n  stringsAsFactors = FALSE\n)\nhoras_cuidado <- c(6, 0, NA,\
  \ 8, 4)\nencuesta_barrio <- data.frame(\n  id = 1:6,\n  minutos_viaje = c(35, NA,\
  \ 50, 20, NA, 40),\n  transporte = c(\"Bus\", \"Metro\", \"Bus\", \"Bicicleta\"\
  , \"Metro\", \"Bus\"),\n  stringsAsFactors = FALSE\n)"
solution_code: 'sum(horas_cuidado)


  sum(horas_cuidado, na.rm = TRUE)


  horas_cuidado'
