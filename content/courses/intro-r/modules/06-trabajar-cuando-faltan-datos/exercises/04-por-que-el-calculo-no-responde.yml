id: intro-r-06-004
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 3
title: Calcular con los datos disponibles
context: |-
  Si intentamos sumar `horas_cuidado`, R responderá con `NA`:

  `sum(horas_cuidado)` → `NA`

  Esto no es un error de programación. R razona con prudencia: si no conoce el valor de una persona, no puede saber el total exacto del grupo.

  Para pedirle a R que calcule usando únicamente los valores observados, usamos el argumento `na.rm = TRUE`:

  `sum(horas_cuidado, na.rm = TRUE)`

  `na.rm = TRUE` no borra observaciones de tu base ni convierte el `NA` en cero. Solo le indica a la función: *"opera con los valores que sí tenemos disponibles"*.
instruction: |-
  1. Observa el primer cálculo sin `na.rm` (devuelve `NA`).
  2. En la segunda línea, calcula la suma de los valores disponibles agregando `na.rm = TRUE`.
learning_objectives:
  r: Calcular estadísticas sobre datos disponibles usando el argumento `na.rm = TRUE`.
  data: El mismo microvector de cinco personas
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # 1. Sin indicar qué hacer con NA, el total es desconocido:
  sum(horas_cuidado)

  # 2. Suma únicamente las horas observadas usando na.rm = TRUE:
  sum(horas_cuidado, ______________)
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  sum(horas_cuidado)
  sum(horas_cuidado, na.rm = TRUE)
checks:
- type: custom_r
  code: grepl('na\\.rm\\s*=\\s*TRUE', .user_code)
  message: Usa el argumento na.rm = TRUE para calcular sobre los datos disponibles.
- type: custom_r
  code: .res_val == 18
  message: La suma de los cuatro valores observados debe ser 18 (6 + 0 + 8 + 4).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: R devuelve NA porque le falta un número para completar la suma total.
- title: Pista 2 · Procedimiento
  text: Agrega el argumento `na.rm = TRUE` dentro de `sum()` separado por coma.
- title: Pista 3 · Sintaxis / Acción
  text: 'Completa los guiones con: `na.rm = TRUE`.'
success_message: Excelente. Sin `na.rm = TRUE`, el total es desconocido (`NA`). Con `na.rm = TRUE`, R suma únicamente los 4 valores disponibles y obtiene 18 horas. Siempre debemos transparentar que este resultado representa a 4 de las 5 personas.
navigation:
  next: intro-r-06-005
schema_version: 1
