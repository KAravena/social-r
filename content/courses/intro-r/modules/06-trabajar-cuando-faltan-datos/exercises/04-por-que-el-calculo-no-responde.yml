id: intro-r-06-004
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 3
title: Por qué el cálculo no responde
context: |-
  Si un vector contiene `NA`, `sum()` o `mean()` devuelven `NA` porque el total exacto se desconoce. Para operar con los valores efectivamente disponibles agregamos `na.rm = TRUE`:

  `mean(vector, na.rm = TRUE)`

  Vector: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Calcula el promedio de las horas de cuidado disponibles aplicando `mean()`
  con el argumento `na.rm = TRUE`.
learning_objectives:
  r: Calcular estadísticas sobre datos disponibles usando el argumento `na.rm = TRUE`.
  data: El mismo microvector de cinco personas
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # 1. Observa la suma con NA:
  sum(horas_cuidado)

  # 2. Ahora calcula la media de los valores disponibles con na.rm = TRUE:
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  encuesta_barrio <- data.frame(
    id = 1:6,
    minutos_viaje = c(35, NA, 50, 20, NA, 40),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  sum(horas_cuidado)
  mean(horas_cuidado, na.rm = TRUE)
checks:
- type: custom_r
  code: grepl('na\\.rm\\s*=\\s*TRUE', .user_code)
  message: Usa el argumento na.rm = TRUE para calcular sobre los datos disponibles.
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: ¿Conocemos los cinco valores necesarios para calcular un total completo?
- title: Pista 2 · Procedimiento
  text: Algunas funciones pueden calcular usando únicamente los valores disponibles,
    pero primero debemos reconocer cuántos faltan.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: sum(horas_cuidado, na.rm = TRUE)
success_message: Bien. El primer cálculo no puede producir un total completo porque
  falta un valor. Con `na.rm = TRUE`, `sum()` utiliza únicamente los cuatro valores
  disponibles y obtiene 18.
navigation:
  next: intro-r-06-005
schema_version: 1
