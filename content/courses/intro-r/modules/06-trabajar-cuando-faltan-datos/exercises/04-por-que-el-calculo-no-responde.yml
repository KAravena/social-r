id: intro-r-06-004
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 3
title: Calcular con los datos disponibles
context: |-
  Si un vector contiene `NA`, `sum()` o `mean()` devuelven `NA` porque el total exacto se desconoce. Para operar con los valores efectivamente disponibles agregamos `na.rm = TRUE`:

  `mean(vector, na.rm = TRUE)`

  Vector: `horas_cuidado <- c(6, 0, NA, 8, 4)`.
instruction: Calcula el promedio de las horas de cuidado disponibles aplicando `mean()`
  con el argumento `na.rm = TRUE`.
learning_objectives:
  r: Calcular estadísticas sobre datos disponibles usando el argumento `na.rm = TRUE`.
  data: Comprender la estructura de los datos.
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # Suma horas_cuidado usando el argumento na.rm = TRUE:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: sum(horas_cuidado, na.rm = TRUE)
checks:
- type: custom_r
  code: grepl('na\\.rm\\s*=\\s*TRUE', .user_code)
  message: Usa el argumento na.rm = TRUE para calcular sobre los datos disponibles.
- type: custom_r
  code: .res_val == 18
  message: La suma de los cuatro valores observados debe ser 18 (6 + 0 + 8 + 4).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: R devuelve NA porque le falta un número para completar la suma total.
- title: Pista 2 · Procedimiento
  text: Agrega el argumento `na.rm = TRUE` dentro de `sum()` separado por coma.
- title: Pista 3 · Sintaxis / Acción
  text: Completa los guiones con `na.rm = TRUE`.
success_message: |-
  - **Correcto:** Excelente. Sin `na.rm = TRUE`, el total es desconocido (`NA`). Con `na.rm = TRUE`, R suma únicamente los 4 valores disponibles y obtiene 18 horas. Siempre debemos transparentar que este resultado representa a 4 de las 5 personas.
  - **Incorrecto:** Asegúrate de agregar `, na.rm = TRUE` dentro de la llamada a `sum(horas_cuidado)`.

  ---
