id: intro-r-06-006
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 5
title: Diagnosticar antes de analizar
context: |-
  En `encuesta_barrio` registramos los minutos de traslado de seis residentes:

  | id | minutos_viaje | transporte |
  |:---|---:|:---|
  | 1 | 35 | Bus |
  | 2 | NA | Metro |
  | 3 | 50 | Bus |
  | 4 | 20 | Bicicleta |
  | 5 | NA | Metro |
  | 6 | 40 | Bus |
instruction: |-
  1. Cuenta cuántos datos faltan en `minutos_viaje` usando `sum(is.na())`.
  2. Calcula el tiempo total de viaje de los casos disponibles usando `sum()` con `na.rm = TRUE`.
learning_objectives:
  r: Diagnosticar valores ausentes y calcular estadísticas con datos disponibles de
    forma autónoma.
  data: Comprender la estructura de los datos.
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |
  # 1. Prepara las personas que trabajan y conserva edad y horas_cuidado:


  # 2. Cuenta cuántos casos tienen información completa en ambas variables:
setup_code: |-
  suppressPackageStartupMessages(library(dplyr))
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  registro_cuidado <- data.frame(
    id = 1:5,
    edad = c(20, 22, NA, 21, 24),
    horas_cuidado = c(6, NA, 0, 8, 4),
    stringsAsFactors = FALSE
  )
  encuesta_vecinal <- data.frame(
    vecino = 1:6,
    reuniones = c(4, 2, NA, 5, NA, 3),
    comite = c("Sí", "No", "Sí", "Sí", "No", "Sí"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  datos_trabajan <- encuesta_social_demo |>
    filter(trabaja == "Sí") |>
    select(edad, horas_cuidado)

  sum(complete.cases(datos_trabajan))
checks:
- type: object_exists
  object: datos_trabajan
  message: Debes crear el objeto 'datos_trabajan' con el filtro y selección requeridos.
- type: custom_r
  code: is.data.frame(.target_env$datos_trabajan) && nrow(.target_env$datos_trabajan)
    == 4 && identical(.target_env$datos_trabajan$edad, c(22, 24, 23, 25)) && all(c('edad',
    'horas_cuidado') %in% names(.target_env$datos_trabajan))
  message: El objeto datos_trabajan debe contener a las 4 personas que trabajan (trabaja
    == 'Sí') y las columnas edad y horas_cuidado.
- type: custom_r
  code: .res_val == 3 && grepl('complete\\.cases', .user_code)
  message: Debe haber 3 casos completos calculados con complete.cases() (la persona
    2 tiene NA en horas_cuidado).
diagnostics: []
hints:
- title: Pista 1 · Conceptual
  text: Primero filtra por `trabaja == "Sí"` y selecciona las dos variables analíticas
    (`edad`, `horas_cuidado`).
- title: Pista 2 · Procedimiento
  text: Después aplica `complete.cases()` sobre el nuevo objeto `datos_trabajan` dentro
    de `sum()`.
- title: Pista 3 · Sintaxis / Acción
  text: Completa `select(edad, horas_cuidado)` y en la segunda línea escribe `sum(complete.cases(datos_trabajan))`.
success_message: |-
  - **Correcto:** Excelente trabajo. En `datos_trabajan` hay 4 personas que trabajan (casos 2, 5, 6 y 8). Sin embargo, la persona 2 no respondió sus horas de cuidado (`NA`). Por eso, solo 3 personas tienen información completa para analizar edad y horas de cuidado juntas.
  - **Incorrecto:** Asegúrate de filtrar `trabaja == "Sí"`, seleccionar `edad` y `horas_cuidado`, y luego contar casos completos con `sum(complete.cases(datos_trabajan))`.

  ---
