id: intro-r-06-006
course: intro-r
module: 06-trabajar-cuando-faltan-datos
order: 5
title: Otra base con datos ausentes
context: |-
  En `encuesta_barrio` registramos los minutos de traslado de seis residentes:

  | id | minutos_viaje | transporte |
  |:---|---:|:---|
  | 1 | 35 | Bus |
  | 2 | NA | Metro |
  | 3 | 50 | Bus |
  | 4 | 20 | Bicicleta |
  | 5 | NA | Metro |
  | 6 | 40 | Bus |
instruction: |-
  1. Cuenta cuántos datos faltan en `minutos_viaje` usando `sum(is.na())`.
  2. Calcula el tiempo total de viaje de los casos disponibles usando `sum()` con `na.rm = TRUE`.
learning_objectives:
  r: Diagnosticar valores ausentes y calcular estadísticas con datos disponibles de
    forma autónoma.
  data: Encuesta de barrio sobre minutos de viaje
  social: 'Aplicación a investigación social en módulo 6: trabajar cuando faltan datos.'
ui:
  show_workflow_help: false
  show_objective: true
difficulty: basic
type: code
starter_code: |-
  # revisa dónde falta minutos_viaje


  # cuenta cuántos valores faltan


  # calcula el total de los minutos registrados
setup_code: |-
  encuesta_social_demo <- data.frame(
    id = 1:8,
    edad = c(20, 22, 19, 21, 24, 23, 20, 25),
    carrera = c("Sociología", "Historia", "Antropología", "Sociología", "Trabajo Social", "Antropología", "Historia", "Sociología"),
    horas_estudio = c(3, 5, 2, 4, 6, 3, 5, 2),
    trabaja = c("No", "Sí", "No", "No", "Sí", "Sí", "No", "Sí"),
    horas_cuidado = c(6, NA, 0, 8, 4, 5, NA, 7),
    stringsAsFactors = FALSE
  )
  horas_cuidado <- c(6, 0, NA, 8, 4)
  encuesta_barrio <- data.frame(
    id = 1:6,
    minutos_viaje = c(35, NA, 50, 20, NA, 40),
    transporte = c("Bus", "Metro", "Bus", "Bicicleta", "Metro", "Bus"),
    stringsAsFactors = FALSE
  )
solution_code: |-
  is.na(encuesta_barrio$minutos_viaje)

  sum(is.na(encuesta_barrio$minutos_viaje))

  sum(encuesta_barrio$minutos_viaje, na.rm = TRUE)
checks:
- type: custom_r
  code: '!is.null(.res_val)'
  message: Ejecuta la instrucción para obtener el resultado esperado.
diagnostics:
- when_r: is.null(.res_val) && !exists('.result', envir = .target_env)
  message: Recuerda ejecutar tu código con Ctrl + Enter o pulsar el botón para comprobar.
  type: info
hints:
- title: Pista 1 · Conceptual
  text: Antes de calcular, revisa si `minutos_viaje` contiene valores ausentes.
- title: Pista 2 · Procedimiento
  text: Primero detecta y cuenta las ausencias. Después piensa cómo pedir a `sum()`
    que use los valores disponibles.
- title: Pista 3 · Sintaxis / Acción
  text: 'Puedes guiarte con la siguiente sintaxis o estructura de código:'
  code: |-
    is.na(encuesta_barrio$minutos_viaje)

    sum(is.na(encuesta_barrio$minutos_viaje))

    sum(encuesta_barrio$minutos_viaje, na.rm = TRUE)
success_message: Bien. Primero diagnosticaste las ausencias y después calculaste usando
  los valores disponibles. También identificaste cuántos casos realmente aportaron
  información.
navigation:
  next: intro-r-07-001
schema_version: 1
